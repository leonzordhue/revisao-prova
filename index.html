<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão para a prova</title>
<meta name="description" content="Simulados de 10 questões sorteadas por matéria, com nota e explicação de cada erro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F6F8FB; --grade:#E3E8F0; --tinta:#17233D; --suave:#5A6478; --linha:#CED6E2;
  --cartao:#FFFFFF; --marca:#FFE14D; --certo:#1B7F3B; --certo-bg:#E5F4EA; --errado:#B3261E; --errado-bg:#FBE9E7;
  --cor:#3448C5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#121826; --grade:#1C2436; --tinta:#E8ECF4; --suave:#A3ACBF; --linha:#2E3850;
    --cartao:#1A2233; --marca:#8A7400; --certo:#6FD08C; --certo-bg:#16301F; --errado:#FF8A80; --errado-bg:#3A1A18;
  }
}
:root[data-theme="dark"]{
  --papel:#121826; --grade:#1C2436; --tinta:#E8ECF4; --suave:#A3ACBF; --linha:#2E3850;
  --cartao:#1A2233; --marca:#8A7400; --certo:#6FD08C; --certo-bg:#16301F; --errado:#FF8A80; --errado-bg:#3A1A18;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--tinta); font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;
  background-color:var(--papel);
  background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);
  background-size:26px 26px;
}
.folha{max-width:720px; margin:0 auto; padding:28px 16px 64px}
h1,h2,.nota-num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:clamp(2rem,7vw,3.1rem); line-height:1.02; font-weight:800; letter-spacing:-.02em; margin:8px 0 12px}
h1 .grifo{background:linear-gradient(transparent 55%,var(--marca) 55%,var(--marca) 92%,transparent 92%); padding:0 .08em}
.intro{color:var(--suave); max-width:56ch; margin:0 0 28px}
button,a{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--cor); outline-offset:2px; border-radius:6px}

/* lista de matérias: abas de caderno */
.materias{display:grid; gap:12px; padding:0; margin:0; list-style:none}
.mat{background:var(--cartao); border:1px solid var(--linha); border-left:10px solid var(--c); border-radius:4px 12px 12px 4px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:14px 16px}
.mat-info{flex:1 1 260px; min-width:0}
.mat h2{font-size:1.3rem; margin:0; font-weight:800}
.mat-temas{color:var(--suave); font-size:.88rem; margin:2px 0 0; overflow-wrap:anywhere}
.mat-recorde{font-size:.85rem; color:var(--suave); margin-top:4px}
.mat-acoes{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{appearance:none; border:2px solid var(--tinta); background:var(--tinta); color:var(--papel); border-radius:999px; padding:9px 18px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; line-height:1.2}
.btn:hover{filter:brightness(1.15)}
.btn.claro{background:transparent; color:var(--tinta)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.pdfs{font-size:.85rem; display:flex; gap:12px}
.pdfs a{color:var(--suave)}
.rodape{color:var(--suave); font-size:.85rem; margin-top:36px}

/* quiz */
.barra{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px}
.etiqueta{display:inline-block; background:var(--c); color:#fff; font-weight:700; padding:4px 12px; border-radius:4px 12px 12px 4px}
.sair{background:none; border:0; color:var(--suave); text-decoration:underline; cursor:pointer; padding:6px}
.progresso{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin:6px 0 22px}
.progresso i{height:7px; border-radius:4px; background:var(--linha)}
.progresso i.feito{background:var(--c)}
.progresso i.agora{background:var(--tinta)}
.cartao{background:var(--cartao); border:1px solid var(--linha); border-radius:14px; padding:20px 18px}
.contador{font-size:.9rem; color:var(--suave); margin:0 0 4px}
.enunciado{font-size:1.15rem; font-weight:700; margin:0 0 16px; white-space:pre-line}
fieldset{border:0; margin:0; padding:0}
legend{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.alt{display:flex; gap:12px; align-items:flex-start; border:2px solid var(--linha); border-radius:10px; padding:12px 14px; margin:0 0 10px; cursor:pointer; background:var(--cartao)}
.alt:hover{border-color:var(--suave)}
.alt input{position:absolute; opacity:0; pointer-events:none}
.alt .letra{flex:none; width:28px; height:28px; border-radius:50%; border:2px solid var(--suave); display:grid; place-items:center; font-weight:700; font-size:.9rem}
.alt:has(input:checked){border-color:var(--tinta); background:linear-gradient(transparent 0,transparent 100%),var(--cartao); box-shadow:inset 6px 0 0 var(--marca)}
.alt:has(input:checked) .letra{background:var(--tinta); border-color:var(--tinta); color:var(--papel)}
.alt:has(input:focus-visible){outline:3px solid var(--cor); outline-offset:2px}
.acoes{display:flex; justify-content:flex-end; margin-top:8px}

/* resultado */
.nota{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin:6px 0 8px}
.nota-num{font-size:clamp(4.5rem,22vw,7.5rem); line-height:.85; font-weight:800; letter-spacing:-.04em; background:linear-gradient(transparent 58%,var(--marca) 58%,var(--marca) 90%,transparent 90%); padding:0 .06em}
.nota-txt{padding-bottom:6px}
.nota-txt strong{display:block; font-size:1.25rem}
.nota-txt span{color:var(--suave)}
h3{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:1.3rem; margin:30px 0 12px}
.erro{border-left:6px solid var(--errado); margin-bottom:14px}
.erro .enunciado{font-size:1.05rem; margin-bottom:12px}
.linha-resp{display:flex; gap:10px; align-items:flex-start; border-radius:8px; padding:8px 10px; margin:0 0 6px}
.linha-resp b{flex:none}
.linha-resp.sua{background:var(--errado-bg); color:var(--errado)}
.linha-resp.sua span{color:var(--tinta)}
.linha-resp.certa{background:var(--certo-bg); color:var(--certo)}
.linha-resp.certa span{color:var(--tinta)}
.porque{margin:10px 0 0; padding-top:10px; border-top:1px dashed var(--linha)}
.porque b{display:block; font-size:.85rem; color:var(--suave)}
details.acertos{margin-top:8px}
details.acertos summary{cursor:pointer; font-weight:700; padding:8px 0}
.acerto{padding:10px 0; border-top:1px solid var(--linha)}
.acerto p{margin:0}
.acerto .ok{color:var(--certo); font-weight:700}
.botoes{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px}
.parabens{background:var(--certo-bg); color:var(--certo); border-radius:10px; padding:12px 14px; font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .entra{animation:entra .22s ease-out}
  @keyframes entra{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<main class="folha" id="app" aria-live="polite"></main>
<script>
const DADOS = [{"id":"biologia","nome":"Biologia","cor":"#2E7D4F","temas":["Artrópodes: características gerais","Aracnídeos e miriápodes","Anelídeos","Crustáceos e insetos"],"q":[[0,"Segundo o livro, os artrópodes correspondem a que porcentagem aproximada das espécies animais conhecidas?","Mais de 80%",["Cerca de 20%","Cerca de 50%","Menos de 10%"],"O livro afirma que mais de 80% de todas as espécies animais conhecidas são artrópodes, cerca de 1 milhão de espécies descritas."],[0,"O exoesqueleto dos artrópodes é formado principalmente por:","Quitina, um polissacarídeo estrutural",["Celulose, produzida pela epiderme","Calcário, igual ao das conchas dos moluscos","Queratina, a mesma proteína dos cabelos"],"O exoesqueleto é um esqueleto externo rígido formado principalmente de quitina, um polissacarídeo estrutural produzido pela epiderme."],[0,"Qual alternativa NÃO é uma função do exoesqueleto dos artrópodes citada no livro?","Realizar as trocas gasosas pela superfície do corpo",["Proteger o corpo como uma armadura","Evitar a perda de água","Dar suporte estrutural aos músculos"],"O exoesqueleto é impermeável, por isso as trocas gasosas NÃO ocorrem pela superfície do corpo; elas acontecem em brânquias, pulmões foliáceos ou traqueias."],[0,"Como os artrópodes conseguem se movimentar apesar de terem um exoesqueleto rígido?","Possuem apêndices articulados, e nas articulações o exoesqueleto é mais macio e flexível",["O exoesqueleto amolece todos os dias durante a noite","Eles não têm exoesqueleto nas pernas, apenas no tronco","Movem-se apenas por contração do celoma, como as minhocas"],"A rigidez limitaria o movimento, mas todos os artrópodes têm apêndices articulados; na articulação existe uma membrana flexível que permite o movimento."],[0,"Nos artrópodes, os segmentos do corpo se agrupam em unidades maiores com funções especializadas, como cabeça, tórax e abdômen. Essas unidades são chamadas de:","Tagmas",["Metâmeros","Omatídios","Parapódios"],"O agrupamento de segmentos em regiões especializadas (cabeça, tórax, abdômen) recebe o nome de tagmas. Omatídios são unidades dos olhos compostos e parapódios são apêndices de anelídeos."],[0,"O crescimento dos artrópodes ocorre por mudas. Esse processo é chamado de:","Ecdise, regulada pelo hormônio ecdisona",["Metamorfose, regulada pela quitina","Fragmentação, regulada pelo clitelo","Mitose, regulada pela hemolinfa"],"O artrópode precisa abandonar o exoesqueleto e produzir outro maior: é o crescimento por mudas, chamado ecdise, regulado pelo hormônio ecdisona."],[0,"Na fase de intermuda, o que acontece com o artrópode?","Ocorre o crescimento real dos tecidos até preencher todo o exoesqueleto",["O animal abandona o exoesqueleto velho","O animal absorve água ou ar para expandir o corpo","A nova cutícula endurece e vira o novo exoesqueleto"],"Na intermuda os tecidos crescem de verdade até preencher o exoesqueleto. Abandonar o exoesqueleto e expandir o corpo acontece na muda."],[0,"Durante a muda, por que o artrópode toma água ou ar?","Para expandir o corpo enquanto o novo exoesqueleto ainda está macio",["Para respirar, já que perdeu as traqueias","Para dissolver o exoesqueleto velho","Para produzir a ecdisona"],"Logo após abandonar o exoesqueleto velho, o animal toma água ou ar e expande o corpo dentro do exoesqueleto novo, ainda macio; depois a cutícula endurece."],[0,"No gráfico de crescimento do livro, como é a curva de tamanho dos artrópodes em comparação com a de outros animais?","Em degraus, porque o tamanho aumenta de forma brusca a cada muda",["Contínua e suave, igual à dos outros animais","Decrescente, porque eles encolhem a cada muda","Em linha reta, sem nenhuma variação"],"O exoesqueleto rígido só deixa o corpo aumentar logo após cada muda; por isso o gráfico dos artrópodes sobe em degraus, enquanto o dos outros animais é uma curva contínua."],[0,"As quelíceras são:","Um par de apêndices cefálicos em forma de pinça, que podem inocular veneno",["Placas fortes e denteadas que cortam e trituram alimentos","Os órgãos produtores de teia das aranhas","As asas anteriores endurecidas dos besouros"],"Quelíceras são apêndices da cabeça geralmente em pinça; podem inocular veneno, rasgar ou triturar alimento, carregar ovos e cavar. Placas denteadas são as mandíbulas."],[0,"As mandíbulas dos artrópodes são:","Um par de apêndices cefálicos transformados em placas fortes e denteadas, usadas para cortar ou triturar",["Apêndices em forma de pinça que injetam veneno","Apêndices localizados no abdômen usados para nadar","Estruturas excretoras ligadas ao intestino"],"Mandíbulas são placas fortes e denteadas inseridas lateralmente na cabeça, usadas para cortar ou triturar o alimento."],[0,"Qual é a sequência correta do sistema digestório básico de um artrópode?","Boca, esôfago, estômago, intestino, reto e ânus",["Boca, papo, moela, intestino e ânus","Boca, estômago, esôfago, reto e intestino","Boca e cavidade gastrovascular, sem ânus"],"O sistema digestório dos artrópodes é completo e geralmente retilíneo: boca, esôfago, estômago (com ceco digestivo), intestino, reto e ânus. Papo e moela foram vistos na minhoca."],[0,"O sistema circulatório dos artrópodes é:","Aberto: a hemolinfa sai de vasos curtos e banha os órgãos na hemocele",["Fechado: o sangue circula sempre dentro de vasos","Inexistente: os nutrientes passam de célula em célula","Duplo: com circulação pulmonar e sistêmica"],"Nos artrópodes o coração bombeia hemolinfa para vasos curtos que desembocam na hemocele, onde estão os órgãos; é um sistema circulatório aberto."],[0,"Por onde a hemolinfa retorna ao coração dos artrópodes?","Pelos ostíolos",["Pelos nefridióporos","Pelos espiráculos","Pelas fiandeiras"],"A hemolinfa volta da hemocele para o coração através de aberturas chamadas ostíolos. Espiráculos são aberturas das traqueias."],[0,"Como a hemocele é definida no livro?","A principal cavidade corporal, na qual os órgãos ficam imersos na hemolinfa",["O tubo que leva o ar até as células dos insetos","O anel que produz o casulo das minhocas","A parte do exoesqueleto que fica nas articulações"],"A hemocele é a principal cavidade do corpo dos artrópodes, onde os órgãos ficam mergulhados na hemolinfa."],[0,"Por que as trocas gasosas dos artrópodes não ocorrem pela superfície do corpo, como nos anelídeos?","Porque o exoesqueleto é impermeável",["Porque eles não precisam de oxigênio","Porque o corpo deles é muito pequeno","Porque a hemolinfa não transporta gases"],"O exoesqueleto impermeável impede a troca de gases pela pele; por isso surgiram estruturas específicas: brânquias, pulmões foliáceos e traqueias."],[0,"Associe corretamente o grupo de artrópodes à estrutura de trocas gasosas:","Crustáceos: brânquias; aracnídeos: pulmões foliáceos; insetos: traqueias",["Crustáceos: traqueias; aracnídeos: brânquias; insetos: pulmões foliáceos","Crustáceos: pulmões foliáceos; aracnídeos: traqueias; insetos: brânquias","Todos os três respiram apenas pela pele"],"Crustáceos (aquáticos) usam brânquias; aracnídeos têm pulmões foliáceos, parecidos com folhas; insetos têm traqueias que se abrem nos espiráculos."],[0,"Nos insetos, o ar entra no sistema de traqueias por orifícios chamados:","Espiráculos",["Ostíolos","Nefróstomas","Omatídios"],"As traqueias se comunicam com o ar por meio dos espiráculos e levam oxigênio diretamente para as células."],[0,"Os pulmões foliáceos dos aracnídeos recebem esse nome porque:","Têm estrutura que lembra folhas, com a hemolinfa circulando por dentro",["São feitos de clorofila, como as folhas","Ficam do lado de fora do corpo, como folhas soltas","Só funcionam quando o animal está em cima de plantas"],"Os pulmões foliáceos ficam numa cavidade e têm lâminas parecidas com folhas; a hemolinfa circula dentro delas e entra em contato com o oxigênio."],[0,"Os túbulos de Malpighi são estruturas:","Excretoras, ligadas ao trato digestório de insetos, miriápodes e aracnídeos",["Respiratórias, exclusivas dos crustáceos","Reprodutoras, que armazenam espermatozoides","Sensoriais, localizadas nas antenas"],"Os túbulos de Malpighi são uma rede de túbulos fechados que saem da parede do trato digestório para a hemocele; eles fazem a excreção em insetos, miriápodes e aracnídeos."],[0,"Segundo o #FicaADica do livro, quais características dos túbulos de Malpighi ajudam os artrópodes a viver no ambiente terrestre?","A reabsorção de água e a excreção de ácido úrico, que reduzem a perda de água",["A excreção de muita amônia diluída em água","A eliminação de água pela pele","A produção de seda pelas fiandeiras"],"Ao reabsorver água e eliminar ácido úrico (que sai com pouca água), o animal perde menos líquido, uma estratégia fundamental para viver em terra."],[0,"Sobre a reprodução da maioria dos artrópodes, é correto afirmar que:","Têm sexos separados e, em geral, fecundação interna",["São todos hermafroditas com fecundação externa","Reproduzem-se apenas por fragmentação","Não apresentam nenhum cuidado com os ovos"],"A maioria tem sexos separados e fecundação interna; os espermatozoides muitas vezes vão em pacotes fechados, e muitos incubam os ovos com algum cuidado parental."],[0,"O sistema nervoso dos artrópodes é formado por:","Um cérebro e um cordão nervoso ventral ganglionado",["Uma rede nervosa difusa, sem cérebro","Um cordão nervoso dorsal, como nos vertebrados","Apenas olhos compostos ligados às antenas"],"O sistema nervoso tem cérebro e cordão nervoso ventral com gânglios em cada segmento, parecido com o dos anelídeos."],[0,"Para que servem principalmente os olhos compostos dos artrópodes, segundo o livro?","Para detectar movimentos com grande eficiência",["Para enxergar no escuro total","Para sentir cheiros","Para produzir luz"],"O livro destaca que os olhos compostos são extremamente eficazes na detecção de movimento; os olhos simples detectam intensidade e direção da luz."],[0,"Nas aranhas e escorpiões, as fendas nas pernas cobertas por uma fina membrana servem para:","Detectar vibrações, como os movimentos de uma presa na teia",["Respirar, funcionando como espiráculos","Liberar veneno","Produzir a teia"],"Essas fendas têm receptores sensoriais; mudanças de tensão causadas, por exemplo, pela presa na teia estimulam os receptores."],[0,"Quantos pares de pernas possuem os insetos?","Três pares",["Dois pares","Quatro pares","Cinco pares"],"Os insetos são hexápodes: três pares de pernas (seis pernas). Aracnídeos têm quatro pares e decápodes, cinco."],[0,"Sobre as asas dos insetos, o livro afirma que:","Não são consideradas apêndices, pois são folhas do exoesqueleto com veias tubulares",["São pernas modificadas","Ficam presas ao abdômen","Existem em todos os insetos"],"As asas são formadas por duas folhas de exoesqueleto (superior e inferior) com veias por onde passa hemolinfa; por isso não são consideradas apêndices."],[0,"Segundo a filogenia apresentada, os artrópodes se dividem em dois grandes grupos:","Quelicerados e mandibulados",["Insetos e aracnídeos","Errantes e sedentários","Crustáceos e miriápodes"],"Hoje os artrópodes são divididos em quelicerados (Chelicerata), com quelíceras, e mandibulados (Mandibulata), com mandíbulas."],[0,"Os mandibulados se dividem em:","Miriápodes e pancrustáceos",["Aracnídeos e insetos","Escorpiões e aranhas","Poliquetos e oligoquetos"],"Os mandibulados são compostos por dois grupos principais: miriápodes (Myriapoda) e pancrustáceos (Pancrustacea)."],[0,"Por que o livro diz que \"aracnídeos\" e \"crustáceos\" não são categorias taxonômicas válidas?","Porque nomeiam grupos artificiais, apesar de usados informalmente",["Porque esses animais já foram extintos","Porque são, na verdade, tipos de insetos","Porque não têm exoesqueleto"],"Pela filogenia molecular, esses nomes não correspondem a grupos naturais (monofiléticos); são usados informalmente, mas são grupos artificiais."],[0,"O fóssil de Arthropleura, descoberto na Inglaterra, chama atenção porque:","Era um artrópode de cerca de 3 metros, próximo dos milípedes, do Período Carbonífero",["Era a primeira aranha que produzia teia","Era um anelídeo marinho com 3 metros","Era o ancestral das abelhas"],"O texto de abertura mostra o Arthropleura: artrópode ancestral de 3 m, do Carbonífero (359 a 299 milhões de anos), próximo dos milípedes."],[1,"O corpo dos aracnídeos é dividido em:","Cefalotórax e abdômen",["Cabeça, tórax e abdômen","Cabeça e tronco","Tórax e cauda"],"Os aracnídeos têm o corpo dividido em cefalotórax e abdômen. Cabeça, tórax e abdômen é a divisão dos insetos; cabeça e tronco, dos miriápodes."],[1,"Quantos pares de pernas tem um aracnídeo?","Quatro pares",["Três pares","Cinco pares","Um par por segmento"],"O esquema do escorpião mostra 4 pares de pernas, além de quelíceras e pedipalpos."],[1,"Os pedipalpos dos aracnídeos são:","Apêndices ao lado da boca que seguram a presa e ajudam na alimentação",["Os órgãos que produzem a teia","As estruturas de respiração","O ferrão na ponta da cauda"],"Pedipalpos ficam ao lado da boca e seguram a presa, auxiliando a alimentação; nos machos de aranha, a ponta dilatada guarda espermatozoides."],[1,"Como é a digestão da maioria dos aracnídeos?","Extracorpórea: lançam enzimas sobre a presa e sugam o alimento liquefeito",["Totalmente interna, com moela para triturar","Feita por bactérias do solo","Por filtração da água, como as cracas"],"A maioria dos aracnídeos é predadora e faz digestão fora do corpo: as enzimas liquefazem a presa e depois o alimento é sugado."],[1,"As fiandeiras das aranhas são:","Órgãos produtores de teia",["Garras venenosas do tronco","Olhos compostos","Patas usadas para nadar"],"As fiandeiras produzem a teia. Todas as aranhas podem produzir teia, mas nem todas fazem."],[1,"Qual afirmação sobre as aranhas está de acordo com o livro?","Todas podem produzir teia, mas nem todas o fazem",["Todas são herbívoras","Têm fecundação externa na água","Não possuem veneno"],"As aranhas são predadoras com veneno (neurotoxinas); todas têm capacidade de produzir teia, mas nem todas fazem; reproduzem-se com fertilização interna."],[1,"A paralisação e a morte da presa das aranhas acontecem pela ação de:","Neurotoxinas presentes no veneno",["Ácido úrico liberado pela boca","Pelos urticantes","Seda enrolada na presa"],"O livro diz que a paralisação e a morte da presa se dão pela ação de neurotoxinas contidas no veneno."],[1,"Nos machos das aranhas, a extremidade dilatada dos pedipalpos serve para:","Armazenar espermatozoides e transferi-los para a fêmea",["Produzir veneno","Fiar a teia","Respirar"],"Os pedipalpos do macho têm a ponta dilatada, que armazena e transfere espermatozoides para o corpo da fêmea."],[1,"Quantos ovos uma aranha pode depositar, segundo o livro?","Até 3 mil, em ninhos de seda",["No máximo 10","Cerca de 1 milhão","Apenas 1 por vez"],"As aranhas podem depositar até 3 mil ovos no ambiente, em ninhos de seda."],[1,"Qual aranha é descrita como agressiva, que se apoia nas pernas traseiras e levanta as dianteiras quando ameaçada?","Armadeira (gênero Phoneutria)",["Aranha-marrom (gênero Loxosceles)","Viúva-negra (gênero Latrodectus)","Caranguejeira"],"A armadeira é agressiva: quando ameaçada, apoia-se nas pernas traseiras e levanta as dianteiras. Sua picada é dolorosa."],[1,"Qual aranha costuma causar acidentes quando é comprimida contra o corpo dentro de roupas e sapatos, e tem picada geralmente indolor?","Aranha-marrom",["Armadeira","Caranguejeira","Viúva-negra"],"A aranha-marrom não é agressiva e vive dentro das casas; os acidentes ocorrem quando ela é comprimida, e a picada geralmente não dói."],[1,"A viúva-negra (gênero Latrodectus) é reconhecida por:","Coloração preta com faixas vermelhas; a fêmea chega a 1,5 cm",["Coloração marrom com pontos claros e até 17 cm","Corpo coberto de pelos urticantes","Cor amarela e cauda com ferrão"],"A viúva-negra é preta com faixas vermelhas; a fêmea mede até 1,5 cm. Até 17 cm é a armadeira."],[1,"Sobre a aranha caranguejeira, o livro afirma que:","Assusta pelo tamanho, mas raramente causa acidentes graves; o problema são os pelos urticantes",["É a principal causadora de mortes por picada no Brasil","É a menor aranha do Brasil","Vive só dentro de casas, em sapatos"],"Apesar da aparência, a caranguejeira não costuma causar acidentes graves; os incômodos vêm do contato da pele com os pelos urticantes."],[1,"Onde é encontrada, com mais frequência, a aranha-marrom?","Dentro das residências, em móveis, tijolos e sapatos",["Em vegetação arbustiva e gramíneas","Apenas em florestas fechadas","Em lagoas e rios"],"A aranha-marrom vive em áreas urbanas, dentro das casas, abrigada em móveis, tijolos e sapatos. Vegetação arbustiva é ambiente da viúva-negra."],[1,"O télson dos escorpiões é:","O aparelho inoculador de veneno, no último segmento da cauda",["O par de garras do primeiro segmento do tronco","O órgão que produz a teia","O olho composto da cabeça"],"Na extremidade do abdômen, no último segmento da cauda, fica o télson, que inocula o veneno."],[1,"Qual é a principal espécie de escorpião causadora de acidentes graves no Brasil, inclusive com óbitos, principalmente de crianças?","Escorpião-amarelo (Tityus serrulatus)",["Escorpião-marrom (Tityus bahiensis)","Escorpião-preto-da-Amazônia (Tityus obscurus)","Escorpião-imperador"],"O livro destaca o escorpião-amarelo, Tityus serrulatus, como a principal espécie causadora de acidentes graves, com registro de óbitos, principalmente em crianças."],[1,"Os escorpiões responsáveis pelos acidentes graves no Brasil pertencem ao gênero:","Tityus",["Phoneutria","Loxosceles","Latrodectus"],"Os escorpiões de importância médica no Brasil são do gênero Tityus. Os outros três gêneros são de aranhas."],[1,"Qual é o principal sintoma de uma picada de escorpião na maioria dos casos?","Dor",["Febre alta imediata","Perda de memória","Queda de cabelo"],"Após a picada, a dor é o principal sintoma; depois podem aparecer vermelhidão, formigamento e sudorese."],[1,"Qual medida de prevenção contra escorpiões é recomendada no livro?","Sacudir roupas e calçados antes de usar",["Dormir com as janelas abertas","Colocar as mãos em buracos para afugentá-los","Acumular entulho longe de casa sem proteção"],"O livro recomenda sacudir roupas e calçados, não colocar as mãos em buracos ou troncos e usar calçados e luvas ao manusear entulho."],[1,"Os escorpiões têm hábito:","Principalmente noturno, sendo mais ativos nos meses quentes",["Diurno, ativos apenas no inverno","Aquático, vivendo em rios","Parasita, vivendo dentro de outros animais"],"A maioria das espécies tem hábito noturno e é mais ativa durante os meses mais quentes."],[1,"O corpo dos miriápodes é dividido em:","Dois tagmas: cabeça e um longo tronco",["Cefalotórax e abdômen","Cabeça, tórax e abdômen","Um único segmento"],"Os miriápodes têm corpo dividido em apenas dois tagmas: a cabeça e um tronco longo com muitos segmentos e pares de pernas."],[1,"Como respiram os miriápodes?","Por traqueias",["Por brânquias","Por pulmões foliáceos","Pela pele"],"Os miriápodes são estritamente terrestres e respiram por traqueias."],[1,"As centopeias (lacraias) pertencem ao grupo:","Chilopoda",["Diplopoda","Decapoda","Diptera"],"Centopeias ou lacraias são do grupo Chilopoda. Piolhos-de-cobra são Diplopoda."],[1,"De onde vem o veneno das centopeias?","De uma glândula em um par de apêndices modificados do tronco, que formam garras",["Do télson, na ponta da cauda","Das quelíceras da cabeça","Das glândulas repugnatórias laterais"],"O veneno potente das centopeias é produzido por uma glândula alojada em um par de apêndices do tronco transformados em garras."],[1,"Os piolhos-de-cobra (Diplopoda) têm, em cada segmento:","Dois pares de pernas",["Um par de pernas","Três pares de pernas","Nenhuma perna"],"Os milípedes têm corpo cilíndrico com até centenas de segmentos, cada um com dois pares de pernas."],[1,"A maioria dos piolhos-de-cobra é:","Detritívora, comendo plantas e matéria orgânica em decomposição",["Predadora de aves pequenas","Parasita de mamíferos","Filtradora de água"],"A maioria é detritívora e tem papel importante na decomposição da matéria vegetal e na ciclagem de nutrientes do solo."],[1,"Qual é o comportamento de defesa típico dos piolhos-de-cobra?","Enrolar o corpo e liberar fluidos tóxicos ou repelentes",["Atacar com garras venenosas","Levantar as pernas dianteiras e saltar","Produzir teia"],"Eles se deslocam devagar, enrolam-se quando ameaçados e muitos têm glândulas repugnatórias que liberam fluidos tóxicos ou repelentes."],[2,"Por que os anelídeos são chamados de \"vermes segmentados\"?","Porque o corpo é dividido em anéis, ou segmentos",["Porque têm o corpo coberto de exoesqueleto","Porque se dividem ao meio para se reproduzir","Porque possuem pernas articuladas"],"O nome Annelida vem de \"anéis\": o corpo é dividido em segmentos repetidos."],[2,"Os anelídeos são animais:","Triploblásticos, celomados, com trato digestório completo e circulação fechada",["Diploblásticos, sem celoma e sem ânus","Com exoesqueleto de quitina e circulação aberta","Sem sistema nervoso"],"O livro descreve os anelídeos como triploblásticos, celomados, com trato digestório completo e sistema circulatório fechado."],[2,"A repetição de elementos internos e externos em cada segmento do corpo dos anelídeos é chamada de:","Metameria",["Ecdise","Metamorfose","Hermafroditismo"],"Em cada segmento há repetição de elementos internos e externos, condição denominada metameria."],[2,"No celoma dos anelídeos, os compartimentos são separados por:","Septos",["Ostíolos","Élitros","Omatídios"],"O celoma é dividido em compartimentos separados por septos, o que dá aos animais a aparência segmentada."],[2,"Os parapódios são:","Apêndices não articulados que podem ser usados em trocas gasosas, proteção e ancoragem",["Pernas articuladas dos insetos","Garras venenosas das centopeias","Anéis reprodutores das minhocas"],"Os parapódios são apêndices sem articulação; quando presentes, variam de forma e função: trocas gasosas, proteção, ancoragem."],[2,"As cerdas dos anelídeos:","Variam em formato e tamanho e podem estar ausentes em alguns grupos, como nas sanguessugas",["Existem igualmente em todos os anelídeos","São feitas de quitina e cobrem todo o corpo como armadura","São os órgãos de visão"],"As cerdas caracterizam os anelídeos, mas podem faltar em vários grupos, como nas sanguessugas."],[2,"O celoma das minhocas é preenchido por um fluido que ajuda na sustentação do corpo. Esse sistema é chamado de:","Esqueleto hidrostático",["Exoesqueleto","Endoesqueleto calcário","Hemocele"],"O fluido do celoma funciona como esqueleto hidrostático, que sustenta o corpo e permite a locomoção junto com os músculos."],[2,"Como a minhoca se locomove?","Músculos longitudinais e circulares contraem e relaxam alternadamente, e as cerdas ancoram o corpo",["Batendo asas","Com pernas articuladas","Com jatos de água pelo nefridióporo"],"As ondulações vão de trás para frente: os segmentos ficam longos e finos ou grossos e curtos, e as cerdas se estendem para ancorar o corpo."],[2,"Qual é a sequência correta do trato digestório da minhoca?","Boca, faringe, esôfago, papo, moela, intestino e ânus",["Boca, estômago, ceco, reto e ânus","Boca, moela, papo, esôfago e ânus","Boca e cavidade gastrovascular"],"No esquema da minhoca: boca, faringe, esôfago, papo, moela, intestino e ânus."],[2,"Na minhoca, qual é a função do papo e da moela?","O papo armazena o alimento e a moela o tritura",["O papo tritura e a moela armazena","Os dois fazem trocas gasosas","Os dois produzem o casulo"],"O livro explica que a minhoca tem papo para armazenar o alimento e moela para triturá-lo."],[2,"Como é chamado o anelídeo que se alimenta de partículas em suspensão na água, capturadas por tentáculos?","Suspensívoro ou filtrador",["Predador","Detritívoro","Parasita"],"Suspensívoros ou filtradores se alimentam da matéria em suspensão na água; alguns usam tentáculos ou coroas que geram correntes de água."],[2,"Os anelídeos detritívoros:","Alimentam-se de restos orgânicos, ingerindo o substrato enquanto escavam",["Caçam pequenos invertebrados com receptores químicos","Sugam sangue de outros animais","Filtram a água do mar com cirros"],"Os detritívoros comem restos orgânicos; alguns são pouco seletivos e ingerem o substrato ao escavar."],[2,"O sistema circulatório dos anelídeos é:","Fechado: o sangue circula sempre dentro de vasos, em fluxo contínuo",["Aberto, com hemocele","Ausente","Igual ao dos insetos"],"Os anelídeos têm sistema circulatório fechado; o sangue circula somente dentro de vasos."],[2,"Nos anelídeos, o vaso dorsal e o vaso ventral transportam o sangue, respectivamente:","Para a região anterior e para a região posterior",["Para a região posterior e para a região anterior","Os dois para a cabeça","Os dois para a cauda"],"O vaso dorsal leva o sangue para a região anterior (cabeça) e o vaso ventral para a região posterior."],[2,"Os \"corações\" das minhocas são:","Regiões de vasos musculares mais dilatadas que bombeiam o sangue",["Um coração com quatro cavidades, como o humano","Os ostíolos da hemocele","As moelas"],"Algumas espécies, como as minhocas, desenvolveram regiões de vasos musculares dilatados, chamadas de corações."],[2,"Como respira a maioria dos anelídeos?","Pela superfície do corpo (respiração cutânea)",["Por traqueias","Por pulmões foliáceos","Por espiráculos"],"Em muitos anelídeos, a superfície do corpo é o principal local das trocas gasosas: respiração cutânea. Alguns têm brânquias ou coroas tentaculares."],[2,"Os órgãos excretores da maioria dos anelídeos são:","Os nefrídios (metanefrídios)",["Os túbulos de Malpighi","As brânquias","As fiandeiras"],"A maioria dos anelídeos tem nefrídios, também chamados de metanefrídios, geralmente em pares por segmento."],[2,"No nefrídio, por onde entra o líquido celomático e por onde saem as excretas?","Entra pelo nefróstoma e sai pelo nefridióporo",["Entra pelo nefridióporo e sai pelo nefróstoma","Entra pela boca e sai pelo ânus","Entra pelos espiráculos e sai pelos ostíolos"],"O líquido do celoma entra pela abertura do tubo (nefróstoma), sofre reabsorção e as excretas saem pelo poro excretor (nefridióporo)."],[2,"A principal excreta eliminada pelos nefrídios dos anelídeos é:","Amônia",["Ácido úrico","Quitina","Albumina"],"O livro informa que as excretas formadas são principalmente amônia. Ácido úrico é a excreta destacada nos túbulos de Malpighi dos artrópodes terrestres."],[2,"O sistema nervoso dos anelídeos é formado por:","Um par de gânglios cerebrais dorsais e cordões nervosos ventrais com pares de gânglios",["Um cérebro dorsal e medula espinal","Uma rede nervosa sem gânglios","Apenas olhos compostos"],"Os anelídeos têm um par de gânglios cerebrais dorsais e pares de gânglios ao longo de cordões nervosos ventrais."],[2,"Os georreceptores dos anelídeos ajudam a:","Manter a orientação ao escavar um túnel ou tubo",["Detectar a luz","Sentir o gosto do alimento","Ouvir sons"],"Quimiorreceptores e georreceptores ajudam a manter a orientação adequada na escavação de túneis."],[2,"O clitelo é:","Um anel característico ligado à reprodução de minhocas e sanguessugas",["O órgão que tritura o alimento","O vaso sanguíneo dorsal","A ventosa posterior das sanguessugas"],"O clitelo é um anel ligado à reprodução; nas minhocas está sempre visível e nas sanguessugas aparece só na estação reprodutiva."],[2,"Como ocorre a fecundação nas minhocas?","Fecundação cruzada mútua: duas minhocas hermafroditas trocam gametas com os clitelos alinhados em direções opostas",["Autofecundação, sem parceiro","Fecundação externa na água do mar","Por fragmentação do corpo"],"As minhocas são hermafroditas, mas fazem fecundação cruzada mútua: alinhadas em direções opostas, trocam gametas."],[2,"Qual é a função da albumina dentro do casulo da minhoca?","Nutrir o zigoto",["Proteger contra predadores com veneno","Formar o exoesqueleto","Respirar"],"Após a fecundação, o clitelo secreta substâncias para formar o casulo, que contém albumina, substância que nutrirá o zigoto."],[2,"Na composteira da questão do livro, Ana encontrou estruturas amarronzadas de formato oval. O que são?","Casulos de minhoca, formados pelo clitelo e contendo ovos",["Fezes de moscas","Sementes das frutas","Fungos decompositores"],"As estruturas ovais amarronzadas são casulos: o clitelo secreta o envoltório, que recebe óvulos e espermatozoides e depois se fecha."],[2,"Além da reprodução sexuada, alguns anelídeos se reproduzem assexuadamente por:","Fragmentação, regenerando partes perdidas",["Ecdise","Metamorfose completa","Brotamento de asas"],"Existem anelídeos que se reproduzem por fragmentação e regeneram parapódios, cerdas, tentáculos e partes do tronco; a cabeça, porém, dificilmente é regenerada."],[2,"Na maioria dos anelídeos com sexos separados, como costuma ocorrer a fecundação?","Externamente, na água, seguida de desenvolvimento de larva",["Internamente, sempre dentro de um casulo","Por autofecundação","Não há fecundação"],"A maioria tem sexos separados e fecundação externa na água, com desenvolvimento de uma larva; algumas espécies têm fecundação interna."],[2,"Hoje, os anelídeos são organizados em dois grandes grupos:","Errantes (Errantia) e sedentários (Sedentaria)",["Poliquetos e oligoquetos","Quelicerados e mandibulados","Holometábolos e hemimetábolos"],"Estudos moleculares mostraram que as classes antigas eram artificiais; hoje se destacam Errantia e Sedentaria."],[2,"Por que as antigas classes de anelídeos (poliquetos, oligoquetos e hirudíneos) são consideradas grupos artificiais?","Porque estudos moleculares mostraram que elas não refletem a história evolutiva do grupo",["Porque esses animais não existem mais","Porque todos os anelídeos são iguais","Porque foram classificados pela cor"],"As divisões baseadas em morfologia (como número de cerdas) não refletem a evolução; oligoquetos seriam subgrupo de poliquetos e sanguessugas subgrupo de oligoquetos."],[2,"Os anelídeos errantes:","Têm vida ativa, a maioria é marinha e predadora, com apêndices anteriores e mandíbulas",["Vivem fixos em tubos e são filtradores","Não têm segmentos","São todos parasitas de vertebrados"],"Os errantes (cerca de 25% das espécies) nadam, escavam e rastejam; a maioria é marinha, predadora, com antenas, palpos e cirros e boca com mandíbulas."],[2,"Qual grupo de anelídeos inclui as minhocas e as sanguessugas?","Sedentários",["Errantes","Quelicerados","Miriápodes"],"Os sedentários incluem os antigos oligoquetos, como minhocas e sanguessugas, e poliquetos como o verme árvore-de-natal."],[2,"O \"verme árvore-de-natal\" e o \"espanador\" usam suas partes coloridas (palpos plumosos) para:","Trocas gasosas e alimentação, saindo do tubo onde vivem",["Atacar outros animais com veneno","Nadar rapidamente","Produzir o casulo"],"São anelídeos sedentários que vivem em tubos; as espirais coloridas são palpos plumosos usados nas trocas gasosas e na alimentação."],[2,"Qual anelídeo é um errante que pode chegar a 3 metros de comprimento?","Eunice aphroditois",["Lumbricus terrestris","Eisenia fetida","Sanguessuga medicinal"],"O livro cita Eunice aphroditois como um errante do grupo dos maiores anelídeos, chegando a 3 m."],[2,"As sanguessugas se caracterizam por:","Ventosas anterior e posterior, sem parapódios nem cerdas",["Muitos parapódios e cerdas longas","Exoesqueleto de quitina","Respiração por traqueias"],"As sanguessugas têm número fixo de segmentos, celoma reduzido e ventosas anterior e posterior; não apresentam parapódios nem cerdas."],[2,"Por que as sanguessugas são usadas atualmente na medicina para reduzir hematomas?","Por causa do anticoagulante que secretam",["Porque produzem antibióticos","Porque comem bactérias","Porque soltam veneno que anestesia o corpo todo"],"Hoje as sanguessugas são usadas para reduzir hematomas em áreas difíceis de tratar, graças ao anticoagulante que secretam."],[2,"Qual espécie de minhoca é especialmente usada em processos de compostagem?","Eisenia fetida, a minhoca-californiana",["Lumbricus terrestris, a minhoca comum","Eunice aphroditois","Nereimyra punctata"],"A minhoca-californiana, Eisenia fetida, é especialmente usada na compostagem; digere muita matéria orgânica e tem alta fecundidade e crescimento rápido."],[2,"Por que as minhocas são chamadas de \"engenheiras do ecossistema\"?","Porque participam da agregação e da porosidade do solo",["Porque constroem tubos de calcário no mar","Porque polinizam as plantas","Porque produzem seda"],"Ao escavar e ingerir sedimentos, as minhocas reciclam matéria orgânica, aumentam a fertilidade e a aeração do solo, participando da agregação e da porosidade da terra."],[2,"Na composteira caseira de três caixas descrita no livro, o que fica na caixa de cima no início?","Terra, minhocas e a matéria orgânica a ser decomposta",["Só terra, sem minhocas","Nada; ela fica vazia","O líquido rico em nutrientes"],"Na montagem: a caixa de cima tem terra, minhocas e matéria orgânica; a do meio só terra; a de baixo fica vazia e recebe o líquido."],[2,"Qual alimento NÃO deve ser colocado na composteira, segundo o livro?","Carnes e queijos",["Cascas de legumes","Restos de poda","Pedaços de fruta"],"Alimentos que apodrecem, como carnes e queijos, não devem ser usados; alimentos ácidos ou salgados também prejudicam o ecossistema."],[2,"Na composteira, para que serve cobrir tudo com serragem ou palha?","Manter a umidade e bloquear insetos invasores, como moscas",["Alimentar as minhocas","Aquecer as minhocas até 100 °C","Matar as bactérias"],"A serragem ou palha mantém a umidade e bloqueia a ação de insetos invasores, como moscas; a tampa fica fechada."],[2,"O líquido que escorre para a caixa de baixo da composteira pode ser usado como:","Adubo e pesticida nas plantas",["Água para beber","Combustível","Remédio para pessoas"],"O líquido rico em nutrientes pode ser usado nas plantas como adubo e pesticida."],[2,"O livro diz que cerca de 52% do resíduo das cidades é orgânico. Qual benefício ambiental da compostagem é citado?","Diminuição do efeito estufa, pois menos material vai para aterros e lixões",["Aumento da camada de ozônio","Produção de petróleo","Fim de todas as doenças"],"Compostar esse resíduo diminui o efeito estufa, porque o material deixa de ir para aterros e lixões e vira húmus."],[3,"Os pancrustáceos são formados por:","Crustáceos e insetos",["Aranhas e escorpiões","Centopeias e piolhos-de-cobra","Minhocas e sanguessugas"],"Os crustáceos, junto com os insetos, formam o grupo dos pancrustáceos (Pancrustacea ou Tetraconata)."],[3,"Uma característica que define os pancrustáceos é:","Um par de olhos compostos formados por omatídios",["Quatro pares de pernas","Quelíceras e pedipalpos","Respiração cutânea"],"Os pancrustáceos têm olhos compostos formados por muitas unidades idênticas chamadas omatídios, que juntos geram uma imagem completa."],[3,"O que são omatídios?","Unidades funcionais de formação de imagem que formam os olhos compostos",["Segmentos do corpo das minhocas","Glândulas de veneno","Asas reduzidas das moscas"],"Cada omatídio é uma unidade de formação de imagem; o conjunto deles forma o olho composto."],[3,"O corpo dos crustáceos geralmente é formado por:","Cefalotórax e abdome",["Cabeça, tórax e abdome","Cabeça e tronco","Um único tagma"],"O corpo dos crustáceos geralmente é composto por cefalotórax (coberto pela carapaça) e abdome."],[3,"Quais são os maiores crustáceos, segundo o livro?","Caranguejos-aranha, que chegam a 4 metros",["Camarões, que chegam a 1 metro","Copépodes, com 2 metros","Krills, com 50 cm"],"Os maiores crustáceos são os caranguejos-aranha, com até 4 m; os menores, como os copépodes, são microscópicos."],[3,"As cracas se alimentam:","Filtrando a água com cirros, tufos de cílios",["Caçando peixes com pinças","Sugando sangue de baleias","Comendo folhas de árvores"],"As cracas usam cirros (tufos de cílios) para filtrar material em suspensão na água; são suspensívoras."],[3,"Cymothoa exigua, o \"peixe-comedor-de-língua\", é um exemplo de crustáceo:","Parasita, que entra pelas brânquias do peixe e se agarra à língua para sugar sangue",["Filtrador de plâncton","Decompositor de folhas","Polinizador"],"O livro usa Cymothoa exigua como exemplo de parasitismo: entra pelas brânquias e se fixa na língua do hospedeiro para sugar sangue."],[3,"O que é hermafroditismo sequencial, comum em crustáceos?","A inversão do sexo do indivíduo ao longo da vida",["Ter os dois sexos ao mesmo tempo","Reproduzir-se sem parceiro por fragmentação","Ter vários parceiros na mesma estação"],"No hermafroditismo sequencial ocorre uma inversão do sexo, controlada por fatores genéticos, fisiológicos e comportamentais. Ter os dois sexos ao mesmo tempo é o simultâneo."],[3,"O caranguejo chama-maré macho levanta e abaixa sua pinça desenvolvida para:","Atrair a fêmea, um comportamento de \"corte\"",["Cavar a toca","Filtrar a água","Afastar as aves"],"Na época reprodutiva, esse movimento faz parte da \"corte\", comportamento de conquista do parceiro."],[3,"As pulgas-d'água são muito usadas em ensaios ambientais de toxicidade porque:","São de fácil cultivo e têm alta taxa reprodutiva",["Vivem 100 anos","São resistentes a qualquer poluente","São grandes e fáceis de ver"],"Por serem de fácil cultivo e se reproduzirem muito, as pulgas-d'água são usadas para testar a toxicidade da água."],[3,"As artêmias são importantes porque:","São fonte de alimento para aves aquáticas em poças temporárias e lagoas",["Destroem os cascos dos navios","Transmitem a malária","Polinizam flores"],"As artêmias são comuns em poças temporárias e lagoas e servem de alimento importante para aves aquáticas."],[3,"O gênero de cracas Balanus é conhecido por:","Causar grande parte da incrustação de navios e estruturas portuárias",["Viver dentro do corpo humano","Ser o maior crustáceo do mundo","Produzir seda"],"O livro destaca Balanus como responsável por grande parte da incrustação de navios e estruturas portuárias."],[3,"As cracas presas ao corpo das baleias ganham com essa associação:","Transporte pelos oceanos, que facilita a obtenção de alimento, e proteção",["Sangue da baleia como alimento","Oxigênio extra pelos pulmões da baleia","Calor para chocar os ovos"],"Aderidas às baleias, as cracas são transportadas pelos oceanos, o que facilita conseguir alimento e traz proteção."],[3,"A ordem Decapoda recebe esse nome porque seus animais têm:","Cinco pares de pernas (dez pés)",["Dez antenas","Dez segmentos","Dez olhos"],"Decapoda vem do grego déka (dez) e poús (pés): cinco pares de pernas, ou apêndices torácicos."],[3,"Qual animal NÃO pertence à ordem Decapoda?","Craca",["Caranguejo","Camarão","Lagosta"],"Caranguejos, camarões e lagostas são decápodes. A craca é um crustáceo séssil de outro grupo (Thecostraca, cirripédios)."],[3,"Sobre o acasalamento de caranguejos, camarões e lagostas, o livro afirma que:","Está associado à muda; algumas fêmeas só copulam após a muda, quando o revestimento está mole",["Ocorre apenas em água doce","É feito por fragmentação","Não tem relação com o exoesqueleto"],"Machos de algumas espécies só copulam com o exoesqueleto endurecido, enquanto algumas fêmeas só copulam logo após a muda."],[3,"Na \"andada\" do caranguejo-uçá, os catadores são proibidos de capturar os caranguejos. Esse período se chama:","Defeso, e serve para preservar a espécie durante a reprodução",["Muda, porque os caranguejos trocam de casca","Ecdise, porque perdem as patas","Metamorfose, porque viram larvas"],"Na andada os caranguejos saem para se reproduzir; proibir a captura nesse período (defeso) protege a reprodução e a espécie."],[3,"O nome Hexapoda, dado ao grupo dos insetos, faz referência a:","Três pares de pernas",["Seis pares de asas","Seis olhos","Seis segmentos"],"Hexapoda se refere aos três pares (seis) de pernas presentes em algum estágio da vida desses animais."],[3,"O corpo dos insetos é dividido em:","Cabeça, tórax e abdômen",["Cefalotórax e abdômen","Cabeça e tronco","Tórax e cauda"],"Os insetos têm cabeça (antenas e peças bucais), tórax (pernas e asas) e abdômen."],[3,"Qual tipo de aparelho bucal tem o gafanhoto?","Mordedor-mastigador",["Sugador","Lambedor","Perfurante-sugador"],"Grilos e gafanhotos têm mandíbulas poderosas que cortam e mastigam o alimento: aparelho mordedor-mastigador."],[3,"Qual tipo de aparelho bucal tem o mosquito?","Perfurante-sugador",["Mordedor-mastigador","Lambedor","Filtrador"],"O mosquito tem um apêndice adaptado para furar a pele do hospedeiro e sugar o líquido: perfurante-sugador."],[3,"A maioria das moscas tem aparelho bucal:","Lambedor, com maxilas e lábio alongados formando uma língua",["Mordedor-mastigador","Perfurante-sugador","De quelíceras"],"A maioria das moscas tem os apêndices bucais modificados em uma língua lambedora."],[3,"Um biólogo viu uma borboleta desenrolar um tubo para dentro do centro da flor. Isso indica que ela:","Tem aparelho bucal sugador e se alimenta de néctar",["Tem mandíbulas e come pétalas","É uma predadora de abelhas","Deposita ovos com esse tubo"],"O tubo enrolado é um aparelho bucal sugador, adaptado a alimentos líquidos como o néctar."],[3,"Como os músculos do voo movem as asas dos insetos?","Indiretamente, alterando a forma do tórax",["Diretamente, presos na ponta das asas","Com ajuda do vento, sem músculos","Pela pressão da hemolinfa nas asas"],"Os músculos do voo não se ligam diretamente às asas; eles mudam a forma do tórax, e isso move as asas."],[3,"No voo dos insetos, quando o músculo vertical se contrai, a asa:","Sobe",["Desce","Para","Dobra para trás"],"No esquema do livro: o músculo vertical se contrai e move a asa para cima; o músculo horizontal se contrai e move a asa para baixo."],[3,"Por que o voo é considerado uma inovação fundamental para o sucesso dos insetos?","Ajuda a fugir de predadores, encontrar alimento, localizar parceiros e explorar ambientes",["Permite que os insetos respirem","Faz os insetos crescerem sem mudas","Impede que os insetos sejam polinizadores"],"O voo permite fuga, busca de alimento e parceiros e exploração de novos ambientes, contribuindo para a enorme diversidade dos insetos."],[3,"Qual é a sequência da metamorfose completa (holometábolo)?","Ovo, larva, pupa e adulto",["Ovo, ninfa e adulto","Ovo, jovem e adulto","Larva, ovo, adulto e pupa"],"Holometábolos passam por metamorfose completa: o ovo eclode em larva, que vira pupa, da qual emerge o adulto (ex.: borboleta)."],[3,"Um gafanhoto passa por ovo, ninfa e adulto, e as ninfas já se parecem com o adulto. Esse desenvolvimento é:","Hemimetábolo (metamorfose incompleta)",["Holometábolo (metamorfose completa)","Ametábolo (sem metamorfose)","Direto com pupa"],"No desenvolvimento hemimetábolo as ninfas são parecidas com o adulto e mudam de tamanho e forma, por exemplo com o desenvolvimento das asas."],[3,"Insetos ametábolos, como a traça, são aqueles que:","Não passam por metamorfose: o jovem já é parecido com o adulto",["Passam por larva e pupa","Passam por ninfa","Nunca chegam à fase adulta"],"Ametábolos têm desenvolvimento direto: ovo, jovem e adulto, sem transformações."],[3,"Por que o desenvolvimento holometábolo foi vantajoso para os insetos?","Larvas e adultos ocupam nichos diferentes, o que evita a competição entre eles",["Porque os adultos vivem para sempre","Porque as larvas já nascem voando","Porque não precisam se alimentar"],"As larvas holometábolas têm nichos ecológicos diferentes dos adultos, evitando a competição intraespecífica; por isso essas espécies são cerca de 10 vezes mais numerosas."],[3,"A malária tem como agente causador e transmissor, respectivamente:","O protozoário Plasmodium e a fêmea do mosquito Anopheles",["O vírus da dengue e o mosquito Culex","O Trypanosoma cruzi e o barbeiro","A bactéria da peste e a pulga"],"A malária é causada pelo protozoário Plasmodium e transmitida pela picada da fêmea do mosquito Anopheles."],[3,"A doença de Chagas é transmitida por:","Triatomíneos, conhecidos como barbeiros",["Mosquitos do gênero Culex","Pulgas","Moscas domésticas"],"A doença de Chagas é provocada pelo Trypanosoma cruzi e transmitida por triatomíneos (Triatoma infestans), os barbeiros."],[3,"Segundo o livro, as pulgas estão relacionadas a qual doença?","Peste bubônica",["Malária","Filariose","Cólera"],"O livro relaciona as pulgas à peste bubônica e as moscas à febre tifoide, à cólera e à ascaridíase."],[3,"A filariose é causada pelo verme Wuchereria bancrofti, cujas larvas completam o desenvolvimento em mosquitos do gênero:","Culex",["Anopheles","Lutzomyia","Triatoma"],"As larvas da Wuchereria bancrofti completam o desenvolvimento em mosquitos hematófagos do gênero Culex."],[3,"Qual é um benefício dos insetos citado no livro?","Servem como indicadores da qualidade da água e da contaminação do solo",["Todos produzem mel","Nenhum transmite doenças","Destroem todas as plantações"],"Além de polinizar e produzir mel, seda e cera, os insetos podem ser usados como bioindicadores da qualidade ambiental."],[3,"Qual ordem de insetos tem o maior número de espécies, cerca de 380 mil?","Coleoptera (besouros)",["Lepidoptera (borboletas)","Hymenoptera (formigas e abelhas)","Diptera (moscas)"],"Os besouros (Coleoptera) formam a ordem com mais espécies de insetos, cerca de 380 mil."],[3,"Os élitros dos besouros são:","As asas anteriores modificadas em coberturas duras, que protegem as asas posteriores membranosas",["As patas traseiras usadas para pular","As antenas","As peças bucais sugadoras"],"Os besouros têm asas anteriores duras e firmes (élitros) e asas posteriores membranosas abaixo delas."],[3,"As asas das borboletas e mariposas (Lepidoptera) são cobertas por:","Escamas",["Pelos urticantes","Placas calcárias","Élitros"],"Os lepidópteros têm dois pares de asas com escamas, que também cobrem partes externas do corpo."],[3,"As larvas das borboletas, chamadas lagartas, têm aparelho bucal:","Mastigador, e se alimentam principalmente de plantas",["Sugador, e se alimentam de néctar","Perfurante, e sugam sangue","Filtrador"],"As lagartas são mastigadoras e comem plantas; já os adultos têm peças bucais tubulares para absorver néctar."],[3,"Formigas, abelhas e vespas pertencem à ordem:","Hymenoptera",["Diptera","Coleoptera","Lepidoptera"],"Os himenópteros (Hymenoptera), com cerca de 115 mil espécies, incluem formigas, abelhas e vespas; tendem a formar comunidades sociais."],[3,"Os dípteros (moscas e mosquitos) recebem esse nome porque:","Têm apenas duas asas (um par); o outro par virou halteres",["Têm dois pares de pernas","Têm duas antenas grandes","Vivem em dois ambientes"],"Diptera significa \"duas asas\": eles têm só um par; o outro par foi reduzido aos halteres, usados para equilíbrio no voo."],[3,"Os halteres das moscas servem para:","Equilibrar o inseto durante o voo",["Sugar sangue","Produzir sons para atrair parceiros","Respirar"],"Os halteres são o segundo par de asas reduzido; servem para o equilíbrio durante o voo."],[3,"Por que a diminuição das abelhas pode causar um \"efeito cascata\"?","Sem polinização não se formam frutos e sementes, e faltariam plantas, base da cadeia alimentar",["Porque as abelhas comem todos os outros insetos","Porque sem abelhas o mel acabaria e as plantas morreriam de fome","Porque as abelhas produzem o oxigênio do planeta"],"O texto de abertura explica: sem polinização não há frutos nem sementes; sem sementes não se cultivam plantas, que formam a base da cadeia alimentar."],[3,"Quais fatores o livro aponta para a diminuição das populações de abelhas?","Mudanças climáticas, uso de agrotóxicos e perda de hábitat pelo desmatamento",["Excesso de flores e chuvas","Aumento do número de apicultores","Ataque de minhocas"],"O livro cita a combinação de mudanças climáticas, agrotóxicos e perda de hábitat causada pelo desmatamento."],[3,"Algumas formigas não têm asas. O que o livro diz sobre isso?","As asas podem surgir na época da reprodução, para o voo de acasalamento",["Elas perderam as patas também","Nunca, em nenhum momento, aparecem asas","As asas ficam escondidas dentro do abdômen"],"Formigas (e cupins) não têm asas, mas essas estruturas podem surgir na época de reprodução para o voo de acasalamento."]]},{"id":"fisica","nome":"Física","cor":"#D2491F","temas":["Temperatura, calor e equilíbrio térmico","Termometria e escalas termométricas","Propagação do calor: condução","Convecção e irradiação","Calorimetria","Trocas de calor e calorímetro"],"q":[[0,"A Termologia é a parte da Física que estuda:","o calor, a temperatura e a transferência de energia térmica",["apenas o movimento dos corpos e suas causas","a luz e a formação de imagens","as cargas elétricas em repouso"],"Termologia é o estudo do calor, da temperatura e de como a energia térmica é transferida entre os corpos."],[0,"A temperatura de um corpo é uma medida:","do grau de agitação das partículas que o formam",["da quantidade de calor que o corpo possui","da massa total do corpo","do volume ocupado pelo corpo"],"Temperatura mede o grau de agitação das partículas (energia cinética). Corpo não possui calor; calor é energia em trânsito."],[0,"Em qual estado físico a agitação das partículas de uma substância costuma ser maior?","Gasoso",["Sólido","Líquido","É igual nos três estados"],"A agitação é maior no estado gasoso, depois no líquido e é menor no sólido."],[0,"O calor pode ser definido como:","energia térmica em trânsito, transferida por causa de uma diferença de temperatura",["a temperatura de um corpo muito quente","uma substância que fica guardada dentro dos corpos","a energia que um corpo possui quando está parado"],"Calor é energia térmica transferida espontaneamente de um corpo para outro por diferença de temperatura. Não fica armazenado no corpo."],[0,"Espontaneamente, o calor flui sempre:","do corpo de maior temperatura para o de menor temperatura",["do corpo de menor temperatura para o de maior temperatura","do corpo de maior massa para o de menor massa","do corpo maior para o menor, independente da temperatura"],"O calor passa espontaneamente do corpo mais quente para o mais frio, até as temperaturas se igualarem."],[0,"Qual frase está fisicamente correta?","O fogo transfere calor para o bombeiro.",["O fogo possui muito calor.","A temperatura do fogo passa para o bombeiro.","A roupa do bombeiro o isola da temperatura."],"Corpo não possui calor e temperatura não \"passa\" de um corpo para outro. O que é transferido é calor, e a roupa isola do calor."],[0,"Por que a frase \"a roupa do bombeiro isola da temperatura\" está errada?","Porque a roupa isola do calor, que é a energia transferida; temperatura não se transfere",["Porque a roupa não isola nada","Porque temperatura e calor são a mesma coisa","Porque a roupa aumenta a temperatura do bombeiro"],"O que passa de um corpo para outro é calor. A roupa dificulta a passagem de calor, e não \"da temperatura\"."],[0,"Uma panela quente é colocada sobre uma mesa de pedra fria. Depois de um tempo:","panela e mesa atingem a mesma temperatura (equilíbrio térmico)",["a mesa fica mais quente que a panela","a panela continua sempre mais quente que a mesa","o calor passa da mesa para a panela"],"O calor vai da panela (mais quente) para a mesa (mais fria) até que as duas fiquem com a mesma temperatura: equilíbrio térmico."],[0,"Dois corpos estão em equilíbrio térmico quando:","têm a mesma temperatura e não há mais troca líquida de calor entre eles",["têm a mesma massa","têm a mesma quantidade de calor guardada","são feitos do mesmo material"],"Equilíbrio térmico significa temperaturas iguais; por isso o fluxo de calor entre eles cessa."],[0,"A Lei Zero da Termodinâmica afirma que, se A está em equilíbrio térmico com B, e B com C, então:","A está em equilíbrio térmico com C",["A está mais quente que C","C está mais quente que A","nada se pode afirmar sobre A e C"],"Pela Lei Zero, se A e C estão em equilíbrio com B, A e C têm a mesma temperatura, logo estão em equilíbrio entre si."],[0,"A Lei Zero da Termodinâmica é o princípio que permite:","o uso de termômetros para comparar temperaturas",["calcular a potência de um secador","explicar a brisa marítima","definir o calor latente"],"O termômetro (corpo B) entra em equilíbrio com o corpo medido; pela Lei Zero, dá para comparar temperaturas de corpos diferentes."],[0,"Ao receber calor sem mudar de estado, a energia cinética das partículas de um corpo:","aumenta, e a temperatura sobe",["diminui, e a temperatura cai","não muda","aumenta, mas a temperatura cai"],"Receber calor aumenta a agitação (energia cinética) das partículas, o que se percebe como aumento de temperatura."],[0,"A energia cinética das partículas, ligada à temperatura, está associada a movimentos de:","translação, rotação e vibração",["apenas translação","apenas vibração","reflexão e refração"],"O livro cita translação, rotação e vibração como formas de agitação das partículas."],[1,"Termometria é:","a medição da temperatura de um corpo usando outro corpo, o termômetro",["o estudo da propagação do calor no vácuo","o cálculo do calor latente","o estudo da dilatação dos metais"],"Termometria é a parte da Termologia que mede temperatura por meio de um segundo corpo, o termômetro."],[1,"Grandeza termométrica é:","uma grandeza que varia com a temperatura e permite medi-la",["a temperatura de ebulição da água","a massa do termômetro","a quantidade de calor de um corpo"],"Exemplos: comprimento da coluna de líquido (termômetro analógico) e resistência ou corrente elétrica (termômetro digital)."],[1,"Em um termômetro analógico de líquido, a grandeza termométrica é:","o comprimento da coluna de líquido",["a resistência elétrica","a cor do vidro","a massa do líquido"],"No termômetro analógico, a altura (comprimento) da coluna de líquido muda com a temperatura."],[1,"Em um termômetro digital, a grandeza termométrica pode ser:","a resistência elétrica ou a corrente elétrica",["o comprimento de uma coluna de mercúrio","a massa do aparelho","a cor do visor"],"Termômetros digitais usam a variação de resistência ou de corrente elétrica com a temperatura."],[1,"Por que é preciso esperar alguns minutos com o termômetro clínico na axila?","Porque o termômetro só indica a própria temperatura e precisa entrar em equilíbrio térmico com o corpo",["Porque o mercúrio precisa evaporar","Porque o calor do termômetro precisa passar para o paciente","Porque a pele precisa esfriar"],"O termômetro mostra a sua própria temperatura. Só depois do equilíbrio térmico ela é igual à do corpo."],[1,"Para construir uma escala termométrica são usados dois pontos fixos, que são:","a fusão do gelo e a ebulição da água, ambas a 1 atm",["a temperatura do corpo humano e a do ambiente","o zero absoluto e a fusão do ferro","a ebulição do álcool e a fusão do mercúrio"],"Os pontos fixos são a fusão do gelo e a ebulição da água sob pressão normal (1 atm)."],[1,"Qual é a sequência correta para construir uma escala termométrica?","Escolher dois pontos fixos, atribuir valores a eles e dividir o intervalo em partes iguais",["Medir a massa do termômetro e dividir pelo volume","Escolher um único ponto e contar de 10 em 10","Usar apenas o zero absoluto como referência"],"O livro descreve três passos: dois pontos fixos, valores arbitrários para eles e divisão do intervalo em partes iguais."],[1,"Na escala Celsius, os pontos de fusão do gelo e de ebulição da água (1 atm) valem:","0 °C e 100 °C",["32 °C e 212 °C","273 °C e 373 °C","0 °C e 180 °C"],"Celsius: 0 °C no gelo fundente e 100 °C na água em ebulição, com 100 divisões."],[1,"Na escala Fahrenheit, os pontos de fusão do gelo e de ebulição da água (1 atm) valem:","32 °F e 212 °F",["0 °F e 100 °F","273 °F e 373 °F","0 °F e 180 °F"],"Fahrenheit: 32 °F e 212 °F, intervalo dividido em 180 partes."],[1,"Entre os pontos fixos, quantas divisões têm as escalas Celsius e Fahrenheit, respectivamente?","100 e 180",["100 e 100","180 e 100","212 e 32"],"Celsius: 100 − 0 = 100 partes. Fahrenheit: 212 − 32 = 180 partes."],[1,"A escala Fahrenheit é usada principalmente:","nos Estados Unidos e em poucos outros países",["no Brasil e na maior parte do mundo","apenas em laboratórios científicos","no Sistema Internacional"],"O livro diz que a Fahrenheit é usada por poucos países, entre eles os EUA. A Celsius é a mais usada no mundo."],[1,"A relação de conversão entre Celsius e Fahrenheit é:","θC/5 = (θF − 32)/9",["θC/9 = (θF − 32)/5","θC = θF − 32","θC/5 = θF/9 + 32"],"Pela proporção entre os intervalos (100 e 180 partes), vale θC/5 = (θF − 32)/9."],[1,"Quanto vale 100 °C em Fahrenheit?","212 °F",["180 °F","132 °F","373 °F"],"θC/5 = (θF − 32)/9 → 20 = (θF − 32)/9 → θF = 212 °F, que é o ponto de ebulição da água."],[1,"Quanto vale 25 °C em Fahrenheit?","77 °F",["45 °F","57 °F","81 °F"],"25/5 = (θF − 32)/9 → 5·9 = θF − 32 → θF = 77 °F."],[1,"Quanto vale 41 °F em Celsius?","5 °C",["9 °C","41 °C","18 °C"],"θC/5 = (41 − 32)/9 = 1 → θC = 5 °C."],[1,"Quanto vale −40 °C em Fahrenheit?","−40 °F",["40 °F","−72 °F","8 °F"],"−40/5 = (θF − 32)/9 → −72 = θF − 32 → θF = −40 °F. As duas escalas coincidem em −40."],[1,"Uma variação de 10 °C corresponde a qual variação na escala Fahrenheit?","18 °F",["10 °F","50 °F","42 °F"],"Para variações: ΔθC/5 = ΔθF/9 → 10/5 = ΔθF/9 → ΔθF = 18 °F. O 32 não entra em variação."],[1,"A temperatura de um paciente subiu 9 °F. Em Celsius, a variação foi de:","5 °C",["9 °C","41 °C","16,2 °C"],"ΔθC/5 = ΔθF/9 → ΔθC/5 = 9/9 → ΔθC = 5 °C."],[1,"O zero absoluto corresponde a aproximadamente:","−273 °C, a menor agitação possível das partículas",["0 °C, quando a água congela","−100 °C, a menor temperatura da Terra","273 °C, o máximo de agitação"],"Zero absoluto ≈ −273,15 °C (0 K): estado de agitação mínima das partículas."],[1,"A escala absoluta Kelvin foi proposta por:","William Thomson (Lord Kelvin), em 1848",["Jean-Baptiste Fourier, em 1822","Anders Celsius, em 1742","Isaac Newton, em 1687"],"O livro atribui a escala absoluta a William Thomson, o Lord Kelvin, em 1848."],[1,"Lord Kelvin chegou ao zero absoluto observando que, a volume constante, a pressão de um gás:","diminui 1/273 do valor a cada 1 °C que a temperatura baixa",["dobra a cada 1 °C que a temperatura baixa","não muda com a temperatura","aumenta quando a temperatura baixa"],"A pressão cai 1/273 por grau; extrapolando, ela se anularia em cerca de −273 °C, o zero absoluto."],[1,"A unidade de temperatura no Sistema Internacional é:","o kelvin (K)",["o grau Celsius (°C)","o grau Fahrenheit (°F)","a caloria (cal)"],"No SI a temperatura é medida em kelvin (K). Caloria é unidade de energia (calor)."],[1,"A relação entre a temperatura absoluta T e a temperatura Celsius é:","T = θC + 273",["T = θC − 273","T = 273 − θC","T = θC · 273"],"Kelvin e Celsius têm o mesmo tamanho de grau e a escala Kelvin começa 273 abaixo: T = θC + 273."],[1,"A água ferve a 100 °C (1 atm). Em kelvin isso equivale a:","373 K",["273 K","100 K","212 K"],"T = 100 + 273 = 373 K."],[1,"O gelo funde a 0 °C (1 atm). Em kelvin isso equivale a:","273 K",["0 K","32 K","373 K"],"T = 0 + 273 = 273 K."],[1,"Uma temperatura de 300 K corresponde a:","27 °C",["573 °C","−27 °C","300 °C"],"θC = T − 273 = 300 − 273 = 27 °C."],[1,"Uma substância esquentou 30 °C. Na escala Kelvin a variação foi de:","30 K",["303 K","243 K","54 K"],"Kelvin e Celsius têm divisões do mesmo tamanho, então ΔT = ΔθC = 30 K."],[1,"Na Antártida já se registrou −89 °C e em erupções vulcânicas a lava chega a 1 200 °C. A diferença entre essas temperaturas é:","1 289 °C",["1 111 °C","1 200 °C","1 389 °C"],"Δθ = 1 200 − (−89) = 1 289 °C."],[1,"(Mackenzie) A indicação em Fahrenheit é 4/5 da indicação em Celsius. Essa temperatura em Celsius vale:","−32 °C",["32 °C","−40 °C","160 °C"],"θC/5 = (0,8θC − 32)/9 → 9θC = 4θC − 160 → θC = −32 °C."],[1,"A temperatura de −32 °C, em kelvin, é:","241 K",["305 K","32 K","−241 K"],"T = −32 + 273 = 241 K."],[1,"(UEL) Uma escala E marca 1 °E no gelo fundente e 96 °E na água fervente. A relação com Celsius é:","θE = 0,95θC + 1",["θE = θC + 1","θE = 0,96θC","θE = 1,05θC − 1"],"O intervalo de 100 °C vale 95 °E. Então (θE − 1)/95 = θC/100 → θE = 0,95θC + 1."],[1,"A escala E (1 °E no gelo e 96 °E na ebulição) marca o mesmo valor que a escala Celsius em:","20",["0","1","96"],"x = 0,95x + 1 → 0,05x = 1 → x = 20."],[2,"As três formas de propagação do calor são:","condução, convecção e irradiação",["fusão, vaporização e condensação","reflexão, refração e difração","compressão, expansão e dilatação"],"O calor se propaga por condução, convecção e irradiação."],[2,"Na condução térmica, as partículas do material:","vibram em torno de suas posições e passam a agitação às vizinhas, sem se deslocar",["se deslocam de uma ponta à outra do material","emitem ondas eletromagnéticas que atravessam o vácuo","sobem quando aquecidas e descem quando esfriam"],"Na condução a energia passa de partícula para partícula por vibração; não há transporte de matéria."],[2,"Um bombeiro segura uma barra de metal com a outra ponta no fogo e sente a mão esquentar. A propagação principal é:","condução",["convecção","irradiação","condensação"],"O calor passa ao longo do metal, de partícula para partícula: condução."],[2,"A condução térmica:","precisa de um meio material para acontecer",["ocorre melhor no vácuo","só acontece em líquidos e gases","depende de ondas eletromagnéticas"],"Como a energia passa de partícula para partícula, a condução precisa de meio material."],[2,"A Lei de Fourier, que trata da condução do calor, recebeu o nome de:","Jean-Baptiste Joseph Fourier (1768–1830)",["William Thomson (Lord Kelvin)","Anders Celsius","James Dewar"],"O livro apresenta a lei de Jean-Baptiste Joseph Fourier (1768–1830)."],[2,"O fluxo de calor φ é definido como:","a quantidade de calor dividida pelo tempo, φ = Q/Δt",["a temperatura dividida pela massa","o calor multiplicado pela massa","a área dividida pela espessura"],"Fluxo de calor é Q/Δt, medido em cal/s ou J/s (watt)."],[2,"No SI, a unidade do fluxo de calor é:","watt (J/s)",["caloria","kelvin","J/kg"],"φ = Q/Δt → joule por segundo = watt (W)."],[2,"Pela Lei de Fourier, φ = k·A·(θA − θB)/L. O fluxo de calor aumenta quando:","a área aumenta ou a espessura diminui",["a espessura aumenta","a diferença de temperatura diminui","o coeficiente k diminui"],"φ é diretamente proporcional a k, A e Δθ e inversamente proporcional à espessura L."],[2,"Na Lei de Fourier, a letra L representa:","a espessura (comprimento) da parede atravessada pelo calor",["o calor latente","a massa do material","o tempo de aquecimento"],"Em φ = k·A·Δθ/L, L é a espessura do material."],[2,"Na Lei de Fourier, k é:","o coeficiente de condutibilidade térmica, que depende do material",["a temperatura em kelvin","a capacidade térmica","o calor específico"],"k mede quão bem o material conduz calor. Unidade SI: J/(s·m·K)."],[2,"Se a espessura de uma parede dobra e o resto não muda, o fluxo de calor por condução:","cai pela metade",["dobra","quadruplica","não muda"],"φ é inversamente proporcional a L: dobrando L, φ cai pela metade."],[2,"Se a diferença de temperatura entre as faces de uma placa triplica, o fluxo de calor:","triplica",["cai para um terço","não muda","fica 9 vezes maior"],"φ é diretamente proporcional a (θA − θB)."],[2,"Pela tabela do livro, qual destes materiais é o melhor condutor de calor?","Prata (k ≈ 1,01)",["Ferro (k ≈ 0,163)","Vidro (k ≈ 0,0025)","Madeira (k ≈ 0,0001)"],"A prata tem o maior k da tabela, seguida do cobre (0,99)."],[2,"Pela tabela do livro, qual destes materiais é o pior condutor (melhor isolante)?","Ar (k ≈ 0,000057)",["Cobre (k ≈ 0,99)","Alumínio (k ≈ 0,5)","Chumbo (k ≈ 0,083)"],"O ar tem o menor k da tabela, por isso é ótimo isolante."],[2,"De modo geral, os metais são:","bons condutores de calor",["isolantes térmicos","maus condutores, como a madeira","condutores apenas no vácuo"],"Metais (prata, cobre, alumínio, ferro) têm k alto; vidro, ar e madeira têm k baixo."],[2,"Qual grupo contém apenas isolantes térmicos, segundo a tabela?","vidro, ar e madeira",["cobre, prata e alumínio","ferro, chumbo e cobre","prata, vidro e alumínio"],"Vidro, ar e madeira têm os menores coeficientes de condutibilidade."],[2,"(UEA) Para a chapa de uma lanchonete fritar hambúrgueres, o material mais indicado, por ser bom condutor, é:","aço",["lã","borracha","isopor"],"O aço é metal e conduz bem o calor. Lã, borracha, fibra de vidro e isopor são isolantes."],[2,"Uma panela de ferro tem fundo de área 50 cm² e espessura 8 mm, k = 80 W/(m·K). A sopa está a 50 °C e a mesa a 20 °C. O fluxo de calor é:","1 500 W",["150 W","3 000 W","750 W"],"φ = 80 · 50·10⁻⁴ · 30 / 0,008 = 1 500 W."],[2,"Com fluxo de 1 500 W, a quantidade de calor transferida em 2 s é:","3 000 J",["750 J","1 500 J","1 502 J"],"Q = φ · Δt = 1 500 · 2 = 3 000 J."],[3,"A convecção é a propagação do calor em que:","há deslocamento de matéria por diferença de densidade causada pela temperatura",["a energia passa de partícula em partícula sem deslocamento","a energia viaja por ondas eletromagnéticas no vácuo","o calor passa apenas pelos sólidos"],"Na convecção, porções de fluido aquecidas (menos densas) sobem e as frias (mais densas) descem."],[3,"A convecção ocorre principalmente em:","líquidos e gases",["sólidos","vácuo","metais"],"Só fluidos (líquidos e gases) permitem o deslocamento de matéria que forma as correntes de convecção."],[3,"Em uma corrente de convecção no ar, o ar quente:","sobe, por ser menos denso",["desce, por ser mais denso","fica parado","sobe, por ser mais denso"],"Aquecido, o ar se expande, fica menos denso e sobe; o ar frio, mais denso, desce."],[3,"Por que o congelador da geladeira fica na parte de cima?","O ar resfriado fica mais denso e desce, formando correntes de convecção que esfriam todo o interior",["Porque o calor sobe por condução","Porque o ar frio é menos denso e sobe","Porque a irradiação só funciona de cima para baixo"],"O ar frio, mais denso, desce; o ar mais quente sobe até o congelador. Isso cria a corrente de convecção."],[3,"Durante o dia, perto do mar, a brisa sopra:","do mar para a terra (brisa marítima)",["da terra para o mar (brisa terrestre)","sempre de cima para baixo","paralela à praia, sem relação com a temperatura"],"De dia a areia esquenta mais rápido; o ar sobre ela sobe e o ar do mar ocupa o lugar: vento do mar para a terra."],[3,"À noite, perto do mar, a brisa sopra:","da terra para o mar (brisa terrestre)",["do mar para a terra (brisa marítima)","não há vento à noite","de baixo para cima apenas"],"À noite a areia esfria mais rápido que a água; o ar sobre o mar, mais quente, sobe e o vento vai da terra para o mar."],[3,"A brisa marítima acontece porque, durante o dia:","a areia se aquece mais rapidamente que a água do mar",["a água se aquece mais rapidamente que a areia","o Sol não aquece a areia","o ar sobre o mar é menos denso"],"A areia aquece mais rápido, o ar sobre ela fica menos denso e sobe; o ar do mar vem ocupar o lugar."],[3,"No interior da Terra, as correntes de convecção no manto:","movimentam as placas tectônicas",["formam a brisa marítima","produzem a radiação infravermelha do Sol","congelam o núcleo do planeta"],"O livro relaciona as correntes de convecção do manto ao movimento das placas e ao vulcanismo."],[3,"Ao esquentar água numa panela sobre a fogueira, a água do fundo esquenta, sobe, e a de cima desce. Isso é:","convecção",["condução","irradiação","solidificação"],"O movimento de subida da água quente e descida da fria é a corrente de convecção."],[3,"A irradiação térmica é a propagação do calor por meio de:","ondas eletromagnéticas",["choques entre partículas vizinhas","deslocamento de massas de ar","correntes de água"],"Na irradiação a energia viaja como ondas eletromagnéticas, principalmente infravermelho."],[3,"Qual forma de propagação do calor pode ocorrer no vácuo?","Irradiação",["Condução","Convecção","Nenhuma delas"],"Só a irradiação dispensa meio material. É assim que o calor do Sol chega à Terra."],[3,"Em incêndios de poços de petróleo, bombeiros se protegem atrás de placas metálicas porque elas bloqueiam principalmente o calor transmitido por:","irradiação",["condução","convecção","fusão"],"O calor das chamas chega até eles como ondas eletromagnéticas; as placas barram essa radiação."],[3,"Sobre a emissão térmica, é correto afirmar:","todo corpo emite radiação térmica, e quanto maior a temperatura, maior a energia emitida",["só corpos muito quentes, como o Sol, emitem radiação","corpos frios não emitem nenhuma radiação","a emissão não depende da temperatura"],"Todos os corpos emitem; a emissão depende da cor, do tamanho e principalmente da temperatura."],[3,"À temperatura ambiente, os corpos emitem principalmente radiação:","infravermelha",["ultravioleta","visível azul","raios X"],"Por isso existem câmeras de visão noturna e termômetros infravermelhos."],[3,"Câmeras de visão noturna e termômetros sem contato funcionam captando:","radiação infravermelha emitida pelos corpos",["correntes de convecção","condução pelo ar","som emitido pelos corpos"],"Corpos à temperatura ambiente emitem infravermelho, que esses aparelhos detectam."],[3,"Dois corpos iguais, A e B, com θA > θB, trocam calor por irradiação. O saldo da troca é:","de A para B, pois A emite mais do que B",["de B para A, pois B emite mais","nulo, pois os dois emitem igual","de A para B, porque B não emite nada"],"Os dois emitem, mas o mais quente emite mais; por isso o saldo vai de A para B."],[3,"(UECE) Sobre o copo térmico: I. paredes duplas com vácuo evitam trocas de calor; II. a convecção se forma mais facilmente com líquido frio, por isso a tampa; III. a superfície interna é feita para evitar trocas por irradiação. São verdadeiras:","I e III",["I e II","apenas II","I, II e III"],"O vácuo barra condução e convecção; a superfície espelhada reduz a irradiação. A II está errada."],[3,"O vácuo entre as paredes de uma garrafa térmica dificulta principalmente:","a condução e a convecção",["apenas a irradiação","a fusão e a vaporização","a dilatação do vidro"],"Sem matéria entre as paredes, não há condução nem convecção. A irradiação é reduzida pelas paredes espelhadas."],[3,"Numa vaporeira de bambu sobre a panela, o calor chega aos alimentos:","por condução na panela e convecção do vapor que sobe",["só por irradiação","só por condução","por solidificação do vapor"],"O fundo da panela conduz o calor para a água; o vapor quente sobe por convecção até os alimentos."],[3,"O calor do Sol chega até a Terra por:","irradiação",["condução","convecção","condensação"],"Entre o Sol e a Terra há vácuo; só a irradiação atravessa o vácuo."],[4,"A Calorimetria é a área da Física que estuda:","as trocas de calor entre corpos, as mudanças que elas provocam e a medição do calor",["apenas as escalas de temperatura","o movimento dos planetas","a eletricidade estática"],"Calorimetria estuda as trocas de calor, seus efeitos (variação de temperatura ou de estado) e como medi-las."],[4,"Em um sistema isolado, pelo Princípio da Conservação da Energia:","o calor cedido por um corpo é igual ao calor recebido pelo outro",["o calor desaparece aos poucos","os corpos nunca atingem equilíbrio","o calor cedido é sempre maior que o recebido"],"Sem perdas para fora, toda a energia cedida por um corpo é recebida pelos outros."],[4,"Calor sensível é o calor que:","provoca variação de temperatura no corpo",["provoca mudança de estado físico sem mudar a temperatura","só existe nos gases","passa pelo vácuo"],"Calor sensível muda a agitação das partículas, e a temperatura sobe ou desce."],[4,"Calor latente é o calor que:","provoca mudança de estado físico sem variar a temperatura",["faz a temperatura subir","só aparece na condução","é sempre negativo"],"O calor latente reorganiza as moléculas (muda o estado) e a temperatura fica constante."],[4,"Um bloco de gelo a −10 °C recebe calor (1 atm). O que acontece primeiro?","A temperatura sobe até 0 °C, e só então o gelo começa a derreter",["O gelo derrete imediatamente a −10 °C","A água começa a ferver","A temperatura cai"],"Primeiro o calor é sensível (aquece o gelo até 0 °C). A 0 °C ele passa a ser latente e o gelo derrete."],[4,"Durante a fusão do gelo a 0 °C (1 atm), a temperatura da mistura de ge
