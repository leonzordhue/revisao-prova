Cada pessoa trabalhava sozinha à noite","Apenas crianças cortavam cana","Usavam máquinas a vapor"],"O corte exigia rapidez e precisão."],[4,"Por que a expectativa de vida dos escravizados nos engenhos era muito baixa?","Jornadas exaustivas, castigos duros, acidentes, doenças e excesso de violência",["Porque se alimentavam melhor que os senhores","Porque trabalhavam pouco","Porque moravam nas cidades"],"O sistema de vigilância e punição era rígido e violento."],[4,"Nas cidades, as atividades \"de ganho\" dos escravizados eram:","pequenos serviços nas ruas, como vender alimentos, transportar pessoas e mercadorias e abastecer água",["trabalhos nas minas de ouro","o corte da cana","a administração das Câmaras"],"Eles entregavam um valor fixo ao senhor e podiam guardar o que sobrava."],[4,"A alforria era:","a compra ou concessão da liberdade de uma pessoa escravizada",["um tipo de imposto sobre o açúcar","a casa de purgar","um castigo"],"Com o dinheiro do ganho, alguns conseguiam comprar a liberdade."],[4,"Qual era a forma mais comum de resistência à escravidão?","A fuga",["O pagamento de impostos","A conversão ao protestantismo","A mudança para a Europa"],"A fuga permitia conquistar a liberdade e desorganizar as atividades escravistas."],[4,"Os quilombos eram:","comunidades formadas por pessoas escravizadas que fugiram do cativeiro",["engenhos movidos a água","colégios jesuítas","feitorias portuguesas na África"],"Surgiram principalmente perto de regiões com muitos cativos."],[4,"O Quilombo dos Palmares localizava-se no atual estado de:","Alagoas",["São Paulo","Maranhão","Rio Grande do Sul"],"Durou mais de cem anos e abrigou milhares de pessoas."],[4,"O Quilombo dos Palmares existiu aproximadamente:","entre o fim do século XVI e o início do século XVIII",["entre 1900 e 1950","apenas no ano de 1630","durante o século XX"],"Foi um dos quilombos mais duradouros."],[4,"Em 1988, a Constituição Brasileira:","reconheceu a importância histórica das terras quilombolas, garantindo o direito à demarcação",["proibiu os quilombos","acabou com a escravidão","criou o tráfico atlântico"],"A regularização, porém, ainda é lenta e as comunidades sofrem ameaças."],[4,"Além da fuga, uma forma de resistência dos escravizados era:","o boicote e a destruição de máquinas e ferramentas",["a compra de engenhos","a doação de terras aos senhores","o alistamento no exército holandês"],"Isso afetava a produção e ajudava em negociações."],[4,"A construção de vínculos sociais e culturais entre os escravizados era importante porque:","preservava elementos culturais africanos e criava redes de solidariedade",["facilitava o trabalho dos feitores","aumentava os lucros dos senhores","acabava com as festas"],"Festas, crenças, línguas e famílias ajudaram a formar a cultura brasileira."],[4,"A imagem de Rugendas (1835) mostra escravizados dançando o batuque, que é:","uma dança de matriz afro-brasileira",["uma dança holandesa","uma procissão jesuíta","uma dança indígena tupi"],"Representa a preservação cultural como forma de resistência."],[4,"Na obra \"Negra tatuada vendendo caju\" (1827), o artista Jean-Baptiste Debret retratou:","o comércio de rua praticado por mulheres escravizadas, com tatuagem que preservava tradições africanas",["a expulsão dos holandeses","uma reunião da Câmara municipal","um engenho real movido a água"],"Debret, francês, viveu no Brasil no início do século XIX."],[5,"Atualmente, o Brasil é:","o maior produtor mundial de cana-de-açúcar",["o menor produtor de cana do mundo","importador de todo o açúcar que consome","produtor apenas de café"],"Segundo a Conab, foram quase 650 milhões de toneladas em 2017."],[5,"Além do açúcar, a cana é usada hoje para produzir:","etanol (biocombustível) e bebidas alcoólicas, como a cachaça",["petróleo e carvão mineral","ouro e prata","algodão e lã"],"O livro cita etanol e cachaça."],[5,"No século XV, quais ilhas atlânticas foram transformadas em zonas de produção de açúcar?","Açores, Canárias, Cabo Verde, São Tomé e Madeira",["Malvinas, Fernando de Noronha e Marajó","Cuba, Jamaica e Haiti","Japão, Filipinas e Taiwan"],"Portugueses e espanhóis implantaram ali grandes propriedades monocultoras com trabalho escravo."],[5,"O modelo de produção açucareira implantado nas ilhas atlânticas e levado à América baseava-se em:","grandes propriedades monocultoras e trabalho escravo",["pequenas hortas familiares","fábricas com máquinas a vapor","trabalho assalariado de europeus"],"Na América, o território maior permitiu uma rede de fazendas e engenhos."],[5,"O território americano era vantajoso em relação às ilhas atlânticas porque:","era muito maior, evitando o rápido esgotamento do solo",["não tinha indígenas","era mais frio","já tinha engenhos prontos"],"O esgotamento do solo prejudicou a produção na Ilha da Madeira."],[5,"Por volta de 1580, a produção açucareira concentrou-se principalmente:","em Pernambuco e na Baía de Todos-os-Santos",["em São Paulo e Minas Gerais","no Grão-Pará e no Amazonas","no Rio Grande do Sul"],"Essas regiões tinham condições naturais e políticas favoráveis."],[5,"O massapê é:","um solo extremamente fértil, ideal para a cana",["um tipo de engenho","uma doença da cana","um imposto colonial"],"Pernambuco e a Bahia tinham massapê e chuvas adequadas."],[5,"Entre 1570 e 1629, o número de engenhos de açúcar no Nordeste:","passou de 60 para 350",["caiu de 350 para 60","ficou em 10","passou de 1 para 2"],"Esse salto comprova o sucesso do empreendimento açucareiro."],[5,"Qual destes NÃO é um fator do sucesso do açúcar em Pernambuco e na Bahia, segundo o livro?","A proibição do trabalho escravo",["O solo massapê","O regime de chuvas adequado","A facilidade de navegação até Portugal"],"O açúcar dependia do trabalho escravizado; os outros fatores foram citados no livro."],[5,"O regime monocultor significa:","o cultivo de apenas um produto em vastas extensões de terra",["o cultivo de muitos produtos diferentes","uma forma de governo","a criação de gado sem plantações"],"Nos engenhos, a terra era dedicada à cana-de-açúcar."],[5,"Depois do plantio, quanto tempo era preciso esperar pela primeira colheita da cana?","Cerca de 15 meses",["Uma semana","Dez anos","Um dia"],"Após a colheita, a cana era cortada e levada ao engenho por escravizados."],[5,"Os \"engenhos reais\" eram aqueles que:","usavam a água dos rios para movimentar as máquinas e eram os maiores e mais produtivos",["pertenciam ao rei de Portugal","eram movidos a vapor","eram movidos apenas por escravizados"],"Os engenhos movidos por animais eram menores."],[5,"A garapa é:","o líquido doce extraído da moagem da cana",["o resíduo da fornalha","o nome dado aos lavradores","um tipo de navio"],"A garapa era fervida para separar as impurezas."],[5,"Por que os engenhos precisavam estar perto de bosques e florestas?","Porque as fornalhas que ferviam a garapa consumiam muita lenha",["Para esconder o açúcar dos holandeses","Para criar gado","Para proteger contra o frio"],"A escassez de madeira chegou a fazer engenhos fecharem."],[5,"Nas \"casas de purgar\", ocorria:","a separação do melaço do açúcar",["a moagem da cana","o plantio das mudas","o julgamento dos escravizados"],"O melaço podia virar açúcar inferior ou cachaça."],[5,"O melaço podia ser reprocessado para produzir:","açúcar de qualidade inferior ou a bebida alcoólica chamada pinga ou cachaça",["pão","tecido","pólvora"],"O açúcar cristalizado era embalado e exportado para a Europa."],[5,"Os maiores engenhos chegavam a ter:","centenas de escravizados",["apenas um trabalhador","nenhum trabalhador escravizado","milhões de trabalhadores"],"Engenhos médios tinham mais de 20; os maiores, centenas."],[5,"Os lavradores livres na sociedade açucareira:","plantavam cana e a levavam para moer no engenho, pois não podiam pagar os altos custos de um engenho próprio",["eram donos dos maiores engenhos","eram escravizados","governavam as capitanias"],"O investimento em maquinário e escravizados era muito alto."],[5,"No relato holandês, quando o lavrador plantava em terras do senhor de engenho, na maioria dos casos o açúcar era dividido:","2/5 para o lavrador e 3/5 para o senhor",["tudo para o lavrador","metade e metade","9/10 para o lavrador"],"Se o lavrador tinha terras próprias, a divisão era metade e metade."],[5,"O grupo no topo da sociedade açucareira era formado:","pelos senhores de engenho",["pelos lavradores livres","pelos escravizados","pelos trabalhadores livres pobres"],"Toda a economia da região girava em torno deles."],[5,"Para mostrar seu poder, os senhores de engenho enriquecidos:","construíam residências luxuosas e compravam títulos e genealogias que indicassem origem aristocrática",["distribuíam suas terras aos escravizados","iam morar nos quilombos","deixavam de produzir açúcar"],"Também faziam doações para construir capelas e igrejas."],[5,"As mulheres na sociedade açucareira:","também comandaram engenhos, por viuvez ou herança, com grande influência local",["eram proibidas de ter propriedades","só trabalhavam na Europa","não existiam nos engenhos"],"O livro destaca que senhores de engenho não eram apenas homens."],[5,"Nas cidades açucareiras, os comerciantes formavam:","uma camada intermediária que às vezes tinha mais prestígio que os senhores de engenho",["a base da sociedade","o grupo de escravizados","o clero"],"Eles controlavam a exportação do açúcar e o comércio de escravizados."],[5,"A base da sociedade açucareira era formada:","pelos escravizados, que em alguns períodos eram mais da metade da população",["pelos senhores de engenho","pelos comerciantes","pelos jesuítas"],"Eles realizavam a maior parte das atividades produtivas."],[6,"Em 1578, o rei português dom Sebastião:","desapareceu na batalha de Alcácer-Quibir, no atual Marrocos, sem deixar filhos",["fundou a cidade de Salvador","expulsou os holandeses","criou o Governo-Geral"],"Seu desaparecimento abriu uma disputa pelo trono português."],[6,"Quem ocupou o trono de Portugal após a disputa sucessória?","Felipe II, rei da Espanha",["Maurício de Nassau","Henrique II, rei da França","Tomé de Souza"],"Ele tinha direitos ao trono pelos casamentos entre as famílias reais."],[6,"A União Ibérica foi o período em que:","a monarquia espanhola impôs sua autoridade sobre a Península Ibérica e as colônias portuguesas",["Portugal dominou a Espanha","o Brasil ficou independente","os holandeses governaram Portugal"],"Começou em 1581, quando Felipe II foi coroado rei de Portugal."],[6,"A União Ibérica começou e terminou, respectivamente, em:","1581 e 1640",["1500 e 1822","1630 e 1654","1548 e 1588"],"Em 1640 Portugal recuperou sua autonomia política."],[6,"Antes da União Ibérica, os holandeses participavam do açúcar brasileiro:","fazendo empréstimos aos senhores de engenho e controlando rotas comerciais do açúcar na Europa",["plantando cana em Portugal","capturando indígenas","governando a colônia"],"Os Países Baixos eram um dos centros comerciais mais dinâmicos da época."],[6,"Por que os holandeses decidiram invadir a América portuguesa?","Porque a Espanha, durante a União Ibérica, proibiu a participação holandesa no açúcar brasileiro",["Porque queriam converter os indígenas ao catolicismo","Porque Portugal pediu ajuda","Porque queriam encontrar ouro na Bahia"],"A Espanha queria enfraquecer a economia dos Países Baixos, com quem estava em conflito."],[6,"Os Países Baixos estavam em conflito com a Espanha porque:","lutavam pela autonomia política em relação ao domínio espanhol",["queriam conquistar Portugal","eram aliados da França Antártica","queriam acabar com o açúcar"],"Faziam parte do Sacro Império Romano, dominado pelos espanhóis."],[6,"A primeira invasão holandesa, em 1624, ocorreu:","na Bahia, e foi derrotada no ano seguinte",["em Pernambuco, e durou 24 anos","no Maranhão, e nunca terminou","em São Paulo"],"Forças espanholas e portuguesas expulsaram os holandeses em 1625."],[6,"Em 1630, os holandeses ocuparam:","Pernambuco, principal área produtora de açúcar, ficando por mais de duas décadas",["a Bahia, por apenas um ano","o Rio de Janeiro","Portugal"],"Foram expulsos definitivamente em 1654."],[6,"Em 1641, os holandeses invadiram feitorias portuguesas em Angola porque:","era a principal fornecedora de escravizados para os engenhos americanos",["lá havia ouro","queriam fundar a França Antártica","era a capital de Portugal"],"Assim controlavam a produção de açúcar e o tráfico de escravizados."],[6,"O território dominado pelos holandeses no Brasil, do Ceará até o Rio São Francisco, ficou conhecido como:","Nova Holanda",["França Antártica","Estado do Grão-Pará","Nova Lusitânia"],"Os holandeses se apossaram de cidades, fortalezas e engenhos do litoral."],[6,"Qual foi uma consequência das guerras entre holandeses e ibéricos?","Destruição de engenhos, redução de empréstimos e grande fuga de escravizados para quilombos",["Crescimento da produção de açúcar","Fim da escravidão","Independência do Brasil"],"A economia açucareira entrou em crise sem precedentes."],[6,"Quem foi João Maurício de Nassau?","Coronel holandês que governou o Brasil holandês a partir de 1637",["Rei da Espanha","Primeiro bispo do Brasil","Líder da Revolta de Beckman"],"Ele investiu na produção de açúcar e em melhorias urbanas no Recife."],[6,"Qual destas foi uma ação do governo de Nassau?","Trazer cientistas e artistas para estudar e registrar a paisagem e a natureza",["Expulsar os jesuítas do Maranhão","Criar a Câmara de São Vicente","Fundar a vila de São Paulo"],"Também fez obras de melhoramento urbano no Recife, capital do Brasil holandês."],[6,"A capital do território holandês no Brasil era:","Recife",["Salvador","Olinda","São Luís"],"Nassau fez obras urbanas em Recife."],[6,"O que ajudou os portugueses a expulsar os holandeses, a partir de 1645?","Os holandeses interromperam os empréstimos e começaram a cobrar dívidas, levando os fazendeiros a apoiar a reconquista",["A ajuda militar da França","A descoberta de ouro em Pernambuco","A chegada de Felipe II"],"A luta terminou com a expulsão em 1654."],[6,"Para encerrar a guerra, o tratado de paz com os holandeses estabeleceu que:","Portugal pagaria uma indenização de 4 milhões de cruzados",["a Holanda pagaria a Portugal","o Brasil seria dividido entre os dois","os holandeses ficariam com a Bahia"],"Sem recursos, Portugal criou um imposto sobre o açúcar da colônia."],[6,"Por que o açúcar nordestino entrou em declínio após a expulsão dos holandeses?","Os holandeses passaram a produzir açúcar nas Antilhas, gerando concorrência",["Acabou a cana-de-açúcar no mundo","Portugal proibiu o açúcar","Os escravizados foram libertados"],"O açúcar das Antilhas diminuiu os lucros dos comerciantes e senhores locais."],[6,"As instabilidades econômicas causadas pelo declínio do açúcar só foram superadas com:","a descoberta do ouro nas Minas Gerais, entre o fim do século XVII e o início do XVIII",["a chegada dos franceses","a criação da Companhia de Jesus","a volta de Nassau"],"O ouro trouxe nova fonte de riqueza para o império português."],[7,"Após 1640, a situação econômica de Portugal era desfavorável porque:","a luta pela independência e contra os holandeses foi custosa, e houve perda de territórios e rotas na África e na Ásia",["Portugal tinha dinheiro demais","o Brasil deixou de produzir tudo","os jesuítas tomaram o poder"],"Com isso, o Brasil se tornou o centro econômico mais importante do império."],[7,"O Conselho Ultramarino, criado em 1642, tinha o papel de:","assessorar o rei nas decisões sobre os territórios coloniais, garantindo maior controle",["libertar os escravizados","organizar as Missões jesuíticas","comandar o exército holandês"],"Fazia parte dos mecanismos para ampliar o controle sobre o Brasil."],[7,"As revoltas coloniais do século XVII e início do XVIII tinham caráter:","não independentista: questionavam pontos da dominação, sem duvidar da autoridade do rei",["independentista, querendo separar o Brasil de Portugal","religioso, contra a Igreja Católica","abolicionista, contra a escravidão"],"Pediam, por exemplo, o fim de um imposto ou a extinção de uma companhia."],[7,"A Revolta de Beckman ocorreu:","no Grão-Pará e Maranhão, em 1684",["em Pernambuco, entre 1710 e 1711","na Bahia, em 1624","em São Vicente, em 1532"],"Foi uma reação às medidas da Companhia de Comércio."],[7,"A Companhia de Comércio do Grão-Pará e Maranhão, fundada em 1682, tinha:","o monopólio de todo o comércio da região por vinte anos",["a função de catequizar indígenas","o objetivo de acabar com a escravidão","o controle das Câmaras municipais"],"Coordenava importações, exportações e cobrava taxas de transporte."],[7,"Por que os colonos do Maranhão ficaram insatisfeitos com a Companhia de Comércio?","Ela não fornecia os escravizados africanos prometidos",["Ela vendia escravizados baratos demais","Ela pagava impostos aos colonos","Ela fundou muitos colégios"],"Sem africanos, os colonos escravizaram indígenas, o que gerou protestos dos jesuítas."],[7,"Quem liderou a Revolta de Beckman?","Os irmãos Manuel e Tomás Beckman, com Jorge de Sampaio de Carvalho",["Maurício de Nassau","Felipe II","Tomé de Souza"],"Eram senhores de engenho insatisfeitos com a companhia."],[7,"O que os revoltosos de Beckman fizeram?","Depuseram o governador, expulsaram os jesuítas e extinguiram a companhia de comércio",["Declararam a independência do Brasil","Entregaram o Maranhão aos holandeses","Libertaram todos os escravizados"],"Também criaram uma Junta-Geral de Governo."],[7,"Como terminou a Revolta de Beckman?","Um novo governador, Gomes Freire, mandou enforcar Manuel Beckman e Jorge de Sampaio e restabeleceu a companhia",["Os revoltosos venceram e governaram por 100 anos","Portugal aceitou todas as exigências","A companhia foi extinta para sempre"],"Outros participantes foram punidos com prisão perpétua."],[7,"A Guerra dos Mascates aconteceu em:","Pernambuco, entre 1710 e 1711",["Maranhão, em 1684","Bahia, em 1624","Minas Gerais, em 1789"],"Foi uma disputa entre comerciantes de Recife e senhores de engenho de Olinda."],[7,"Quem eram os \"mascates\"?","Comerciantes de Recife, em geral de origem portuguesa, chamados assim de forma pejorativa",["Senhores de engenho de Olinda","Indígenas do Maranhão","Soldados holandeses"],"Eles emprestavam dinheiro aos senhores de engenho."],[7,"Qual decisão de 1710 provocou a Guerra dos Mascates?","A elevação de Recife à condição de vila, com autonomia em relação a Olinda",["A expulsão dos jesuítas","A criação da Companhia de Comércio","A transferência da capital para o Rio"],"Recife ganhou Câmara própria e poder de cobrar dívidas e definir o preço do açúcar."],[7,"Por que os senhores de engenho de Olinda se revoltaram na Guerra dos Mascates?","Sentiram que o governo português privilegiava os comerciantes portugueses de Recife",["Queriam que Recife fosse vila","Queriam a volta dos holandeses","Defendiam o fim da escravidão"],"Os senhores, em maioria nascidos na colônia, viram o direito de se rebelar."],[7,"Qual foi o resultado da Guerra dos Mascates?","A Coroa confirmou Recife como vila, e os senhores de engenho saíram enfraquecidos",["Olinda passou a mandar em Recife para sempre","Os comerciantes foram expulsos","O Brasil ficou independente"],"Um novo governador foi escolhido e a decisão da Coroa foi mantida."],[7,"O que as revoltas de Beckman e dos Mascates têm em comum, segundo o livro?","Portugal impôs sua autoridade, nomeando funcionários e tomando decisões que privilegiavam os interesses metropolitanos",["Ambas conseguiram a independência","Ambas foram lideradas por jesuítas","Ambas ocorreram na Bahia"],"Os colonos foram percebendo que os interesses da metrópole não eram os mesmos que os deles."]]},{"id":"matematica","nome":"Matemática","cor":"#3448C5","temas":["Probabilidade","Sistema métrico decimal","Massa e capacidade","Medidas de tempo","Polígonos","Estatística e medidas de tendência central","Gráficos estatísticos"],"q":[[0,"Espaço amostral (Ω) é:","o conjunto de todos os resultados possíveis de um evento",["o resultado mais provável de um evento","o número de casos favoráveis","a chance de um evento não acontecer"],"Ex.: no lançamento de um dado, Ω = {1, 2, 3, 4, 5, 6}."],[0,"Qual é o espaço amostral do lançamento de uma moeda?","{cara, coroa}",["{cara}","{1, 2, 3, 4, 5, 6}","{coroa, coroa}"],"A moeda tem dois resultados possíveis: cara ou coroa."],[0,"Qual é o espaço amostral do lançamento de um dado comum?","{1, 2, 3, 4, 5, 6}",["{1, 6}","{0, 1, 2, 3, 4, 5}","{2, 4, 6}"],"Um dado comum tem seis faces, numeradas de 1 a 6."],[0,"A probabilidade de um evento A é calculada por:","P(A) = n(A)/n(Ω), casos favoráveis divididos pelos casos possíveis",["P(A) = n(Ω)/n(A)","P(A) = n(A) − n(Ω)","P(A) = n(A) · n(Ω)"],"Divide-se o número de casos favoráveis pelo total de casos possíveis."],[0,"O resultado de uma probabilidade pode ser representado como:","fração, número decimal ou porcentagem",["apenas fração","apenas porcentagem","apenas número inteiro"],"Ex.: 2/3 ≈ 0,667 ≈ 66,7%."],[0,"Em um jogo, o jogador tem bônus de 3 casas e quer andar 6 ou mais casas jogando um dado. Qual a probabilidade?","2/3, cerca de 66,7%",["1/2","1/6","1/3"],"Precisa tirar 3, 4, 5 ou 6: 4 casos em 6. P = 4/6 = 2/3."],[0,"Qual a probabilidade de um evento impossível, como tirar 7 em um dado comum?","0",["1","1/7","7/6"],"Não há casos favoráveis: P = 0/6 = 0."],[0,"Qual a probabilidade de um evento certo, como tirar um número menor que 7 em um dado comum?","1, ou 100%",["0","6/7","1/6"],"Todos os 6 resultados são favoráveis: P = 6/6 = 1."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um número par?","1/2",["1/6","3/9","1/3"],"Casos favoráveis: 2, 4, 6 (3). P = 3/6 = 1/2."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um número ímpar?","1/2",["1/6","3/9","1/3"],"Casos favoráveis: 1, 3, 5 (3). P = 3/6 = 1/2."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um múltiplo de 3?","1/3",["2/3","2/8","1/2"],"Casos favoráveis: 3, 6 (2). P = 2/6 = 1/3."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um número maior que 4?","1/3",["2/3","2/8","1/2"],"Casos favoráveis: 5, 6 (2). P = 2/6 = 1/3."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um número menor que 3?","1/3",["2/3","2/8","1/2"],"Casos favoráveis: 1, 2 (2). P = 2/6 = 1/3."],[0,"Ao lançar um dado comum, qual a probabilidade de sair o número 5?","1/6",["5/6","1/7","1/2"],"Casos favoráveis: 5 (1). P = 1/6 = 1/6."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um número primo?","1/2",["1/6","3/9","1/3"],"Casos favoráveis: 2, 3, 5 (3). P = 3/6 = 1/2."],[0,"Ao lançar um dado comum, qual a probabilidade de sair um divisor de 6?","2/3",["1/3","4/10","1/4"],"Casos favoráveis: 1, 2, 3, 6 (4). P = 4/6 = 2/3."],[0,"Uma caixa tem 8 bolas azuis, 10 amarelas e 12 roxas, iguais no formato. Retirando uma ao acaso, qual a probabilidade de ela NÃO ser roxa?","3/5",["2/5","3/2","1/30"],"Total = 30 bolas; não roxa = 30 − 12 = 18. P = 18/30 = 3/5."],[0,"Uma caixa tem 5 bolas azuis, 7 amarelas e 8 roxas, iguais no formato. Retirando uma ao acaso, qual a probabilidade de ela NÃO ser azul?","3/4",["1/4","3","1/20"],"Total = 20 bolas; não azul = 20 − 5 = 15. P = 15/20 = 3/4."],[0,"Uma caixa tem 4 bolas azuis, 6 amarelas e 10 roxas, iguais no formato. Retirando uma ao acaso, qual a probabilidade de ela NÃO ser amarela?","7/10",["3/10","7/3","1/20"],"Total = 20 bolas; não amarela = 20 − 6 = 14. P = 14/20 = 7/10."],[0,"Uma caixa tem 3 bolas azuis, 9 amarelas e 6 roxas, iguais no formato. Retirando uma ao acaso, qual a probabilidade de ela NÃO ser roxa?","2/3",["1/3","2","1/18"],"Total = 18 bolas; não roxa = 18 − 6 = 12. P = 12/18 = 2/3."],[0,"Uma caixa tem 6 bolas azuis, 6 amarelas e 8 roxas, iguais no formato. Retirando uma ao acaso, qual a probabilidade de ela NÃO ser amarela?","7/10",["3/10","7/3","1/20"],"Total = 20 bolas; não amarela = 20 − 6 = 14. P = 14/20 = 7/10."],[0,"Numa turma de 30 alunos presentes, 6 não fizeram a tarefa. Sorteando um aluno, qual a chance de ele ter feito a tarefa?","
