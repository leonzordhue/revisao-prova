lo e água:","permanece em 0 °C até todo o gelo derreter",["sobe continuamente","cai abaixo de 0 °C","sobe até 100 °C"],"O calor recebido rompe as ligações entre as moléculas e não aumenta a temperatura: gelo e água coexistem a 0 °C."],[4,"Uma panela de água no fogo passa de 20 °C para 60 °C sem ferver. O calor recebido foi:","sensível",["latente","de condensação","de solidificação"],"Houve variação de temperatura sem mudança de estado: calor sensível."],[4,"Calor específico (c) é:","a quantidade de calor que 1 unidade de massa precisa trocar para variar 1 unidade de temperatura",["o calor total que um corpo possui","a temperatura de fusão de uma substância","o calor necessário para mudar o estado de um corpo"],"c = Q/(m·Δθ). Ex.: c da água = 1 cal/(g·°C)."],[4,"Um corpo de 100 g recebe 50 cal e sua temperatura aumenta 5 °C. Seu calor específico é:","0,1 cal/(g·°C)",["10 cal/(g·°C)","1 cal/(g·°C)","0,5 cal/(g·°C)"],"c = Q/(m·Δθ) = 50/(100·5) = 0,1 cal/(g·°C)."],[4,"Uma barra de aço de 5 kg e uma moeda de aço de 7 g têm:","o mesmo calor específico, pois ele só depende da substância",["calores específicos diferentes, porque as massas são diferentes","a mesma capacidade térmica","calor específico zero"],"Calor específico não depende da massa. A capacidade térmica, sim (a barra tem C muito maior)."],[4,"Pela tabela do livro (J/kg·K), qual substância tem o maior calor específico?","Água (4 184)",["Alumínio (902)","Ferro (451)","Cobre (385)"],"A água tem calor específico muito alto: precisa de muito calor para variar sua temperatura."],[4,"Pela tabela, entre alumínio (902), ferro (451) e cobre (385) J/(kg·K), qual esquenta mais com a mesma quantidade de calor e mesma massa?","Cobre, pois tem o menor calor específico",["Alumínio, pois tem o maior calor específico","Ferro, pois está no meio","Todos variam igual"],"Δθ = Q/(m·c). Com Q e m iguais, quem tem menor c varia mais a temperatura."],[4,"A capacidade térmica (C) de um corpo é:","a quantidade de calor por unidade de variação de temperatura, C = Q/Δθ",["o calor específico dividido pela massa","a temperatura máxima que o corpo aguenta","o calor latente de fusão"],"C = Q/Δθ. Unidade SI J/K; usual cal/°C."],[4,"Um corpo precisa de 50 cal para aumentar 5 °C. Sua capacidade térmica é:","10 cal/°C",["250 cal/°C","0,1 cal/°C","55 cal/°C"],"C = Q/Δθ = 50/5 = 10 cal/°C. Ou seja, 10 cal sobem 1 °C."],[4,"A relação entre capacidade térmica e calor específico é:","C = m·c",["C = c/m","C = m/c","C = c − m"],"Dividindo C = Q/Δθ por c = Q/(m·Δθ), sobra C/c = m, ou seja, C = m·c."],[4,"Para uma mesma substância, se a massa do corpo dobra, a capacidade térmica:","dobra",["cai pela metade","não muda","quadruplica"],"C = m·c: com o mesmo c, C é proporcional à massa."],[4,"As faíscas de um esmeril estão muito quentes, mas não queimam a pele do operador. Isso acontece porque:","elas têm capacidade térmica muito pequena e trocam pouco calor até o equilíbrio",["elas têm calor específico zero","elas não estão quentes de verdade","a pele tem capacidade térmica nula"],"Faíscas têm massa minúscula, logo C pequena: liberam pouco calor ao esfriar. A água fervente, com C grande, queima."],[4,"Um corpo de baixa capacidade térmica:","sofre grande variação de temperatura recebendo pouco calor",["precisa de muito calor para mudar pouco a temperatura","não troca calor","tem sempre massa grande"],"Δθ = Q/C. Com C pequena, pouco calor já muda bastante a temperatura."],[4,"A Equação Fundamental da Calorimetria é:","Q = m·c·Δθ",["Q = m·L","φ = k·A·Δθ/L","T = θC + 273"],"Q = m·c·Δθ dá o calor sensível. Q = m·L é o calor latente."],[4,"Quanto calor é preciso para aquecer 200 g de água (c = 1 cal/g·°C) de 20 °C a 70 °C?","10 000 cal",["1 000 cal","14 000 cal","4 000 cal"],"Q = m·c·Δθ = 200 · 1 · 50 = 10 000 cal."],[4,"Quanto calor 500 g de água (c = 1 cal/g·°C) perdem ao esfriar de 80 °C para 30 °C?","25 000 cal (cedidas)",["15 000 cal","40 000 cal","2 500 cal"],"Q = 500 · 1 · (30 − 80) = −25 000 cal. O sinal negativo indica calor cedido."],[4,"Um bloco de 300 g de ferro (c = 0,1 cal/g·°C) recebe 600 cal. Sua temperatura sobe:","20 °C",["2 °C","200 °C","60 °C"],"Δθ = Q/(m·c) = 600/(300 · 0,1) = 20 °C."],[4,"A unidade de calor no SI é:","o joule (J)",["a caloria (cal)","o watt (W)","o kelvin (K)"],"No SI calor é energia, medida em joules. Na Calorimetria a caloria é muito usada."],[4,"A relação entre caloria e joule é aproximadamente:","1 cal ≅ 4,18 J",["1 cal = 1 000 J","1 J ≅ 4,18 cal","1 cal = 273 J"],"O livro dá 1 cal ≅ 4,18 J."],[4,"Um alimento libera 100 cal. Em joules, isso é cerca de:","418 J",["24 J","100 J","4 180 J"],"100 · 4,18 = 418 J."],[4,"A Equação Fundamental também pode ser escrita, usando a capacidade térmica, como:","Q = C·Δθ",["Q = C/Δθ","Q = C·m·L","Q = Δθ/C"],"Como C = m·c, Q = m·c·Δθ = C·Δθ."],[4,"Calor latente (L) de mudança de estado é:","a quantidade de calor por unidade de massa necessária para o corpo mudar de fase, sem variar a temperatura",["o calor necessário para variar 1 °C de 1 g","a temperatura de ebulição","o calor perdido para o ambiente"],"L = Q/m, ou seja, Q = m·L."],[4,"A fórmula do calor latente é:","Q = m·L",["Q = m·c·Δθ","Q = C·Δθ","Q = L/m"],"Para mudar de estado: Q = m·L."],[4,"A unidade de calor latente no SI é:","J/kg, sendo comum usar cal/g",["J/K","cal/°C","watt"],"L = Q/m: energia por massa. SI J/kg; usual cal/g."],[4,"Para substâncias puras, durante a mudança de estado a temperatura:","permanece constante",["aumenta sempre","diminui sempre","oscila sem parar"],"Todo o calor vai para reorganizar as moléculas; por isso aparece um patamar no gráfico."],[4,"No gráfico de aquecimento da água a 1 atm, os trechos horizontais (patamares) representam:","as mudanças de estado (fusão a 0 °C e vaporização a 100 °C)",["o aquecimento do líquido","o resfriamento do vapor","erros de medida"],"Nos patamares a temperatura é constante porque o calor é latente."],[4,"No gráfico de aquecimento da água a 1 atm, entre 0 °C e 100 °C a água está:","no estado líquido",["no estado sólido","no estado gasoso","sempre em mudança de estado"],"Abaixo de 0 °C sólido, entre 0 e 100 °C líquido, acima de 100 °C gasoso."],[4,"A passagem do estado sólido para o líquido chama-se:","fusão, com calor recebido (Q > 0)",["solidificação, com calor cedido","vaporização, com calor recebido","condensação, com calor cedido"],"Fusão: sólido para líquido, o corpo recebe calor (L > 0)."],[4,"A passagem do líquido para o sólido chama-se:","solidificação, com calor cedido (Q < 0)",["fusão, com calor recebido","condensação, com calor recebido","vaporização, com calor cedido"],"Solidificação: líquido para sólido; o corpo cede calor (L < 0)."],[4,"A passagem do gasoso para o líquido chama-se:","condensação, com calor cedido (Q < 0)",["vaporização, com calor recebido","fusão, com calor cedido","solidificação, com calor recebido"],"Condensação: gás para líquido; o corpo cede calor (L < 0)."],[4,"A passagem do líquido para o gasoso chama-se:","vaporização, com calor recebido (Q > 0)",["condensação, com calor cedido","solidificação, com calor cedido","fusão, com calor recebido"],"Vaporização: líquido para gás; o corpo recebe calor (L > 0)."],[4,"Se o calor latente de fusão do gelo é 80 cal/g, o calor latente de solidificação da água é:","−80 cal/g",["80 cal/g","0 cal/g","540 cal/g"],"Mesmo valor e sinal contrário: L de solidificação = −L de fusão."],[4,"Quanto calor é necessário para derreter 1 000 g de gelo a 0 °C (Lf = 80 cal/g)?","80 000 cal",["8 000 cal","1 080 cal","800 000 cal"],"Q = m·L = 1 000 · 80 = 80 000 cal (80 kcal)."],[4,"Quanto calor é necessário para aquecer 1 000 g de água de 0 °C até 100 °C (c = 1 cal/g·°C)?","100 000 cal",["10 000 cal","1 000 cal","80 000 cal"],"Q = m·c·Δθ = 1 000 · 1 · 100 = 100 000 cal."],[4,"Quanto calor é necessário para vaporizar 1 000 g de água a 100 °C (Lv = 540 cal/g)?","540 000 cal",["54 000 cal","100 000 cal","640 000 cal"],"Q = m·L = 1 000 · 540 = 540 000 cal."],[4,"Para 1 000 g de água, qual etapa exige mais calor: fundir o gelo, aquecer de 0 a 100 °C ou vaporizar?","Vaporizar (540 000 cal)",["Fundir o gelo (80 000 cal)","Aquecer de 0 a 100 °C (100 000 cal)","As três exigem o mesmo"],"Comparando: fusão 80 kcal, aquecimento 100 kcal, vaporização 540 kcal. A vaporização exige muito mais."],[4,"Para derreter 50 g de gelo a 0 °C (Lf = 80 cal/g) são necessárias:","4 000 cal",["130 cal","1,6 cal","400 cal"],"Q = m·L = 50 · 80 = 4 000 cal."],[4,"Uma garrafa de alumínio de 100 g tem c = 0,22 cal/(g·°C). Sua capacidade térmica é:","22 cal/°C",["0,22 cal/°C","100 cal/°C","220 cal/°C"],"C = m·c = 100 · 0,22 = 22 cal/°C."],[4,"A mesma garrafa (C = 22 cal/°C) é aquecida de 20 °C para 60 °C. O calor recebido é:","880 cal",["440 cal","1 320 cal","22 cal"],"Q = C·Δθ = 22 · 40 = 880 cal."],[4,"O \"equivalente em água\" de um corpo com C = 22 cal/°C é a massa de água com a mesma capacidade térmica. Ela vale:","22 g",["2,2 g","220 g","100 g"],"Para a água, c = 1 cal/(g·°C). C = m·c → 22 = m · 1 → m = 22 g."],[4,"Potência térmica é:","a quantidade de calor fornecida dividida pelo tempo, P = Q/Δt",["o calor dividido pela massa","a temperatura multiplicada pelo tempo","o mesmo que calor latente"],"Indica a rapidez com que um aparelho (como o secador de cabelo) fornece calor."],[4,"No SI, a potência térmica é medida em:","watt (W), que é joule por segundo",["caloria","kelvin","cal/g"],"P = Q/Δt → J/s = W. Também se usa cal/s ou cal/min."],[4,"Um aquecedor fornece 12 000 cal em 2 minutos. Sua potência é:","6 000 cal/min",["24 000 cal/min","100 cal/min","12 000 cal/min"],"P = Q/Δt = 12 000/2 = 6 000 cal/min."],[4,"(UEA) Uma garrafa com 500 g de água a 20 °C (c = 1 cal/g·°C) perde 250 cal por minuto no congelador. Em quanto tempo a água chega a 0 °C?","40 minutos",["10 minutos","20 minutos","50 minutos"],"Q = 500 · 1 · 20 = 10 000 cal; t = 10 000/250 = 40 min."],[4,"(UERJ) Um aparelho condensa 0,02 g de vapor por ciclo, 15 ciclos por minuto, com L = 2 400 J/g. A taxa de calor perdida é:","12 J/s",["9 J/s","720 J/s","48 J/s"],"Por minuto: 15 · 0,02 · 2 400 = 720 J. Por segundo: 720/60 = 12 J/s."],[5,"Num sistema termicamente isolado, a soma das quantidades de calor trocadas é:","zero (Q1 + Q2 + ... = 0)",["sempre positiva","sempre negativa","igual à massa total"],"O calor cedido (negativo) é igual ao recebido (positivo), então a soma é nula."],[5,"Um calorímetro é:","um recipiente de material isolante que impede trocas de calor com o meio externo",["um aparelho que mede apenas temperaturas negativas","um tipo de termômetro digital","um aquecedor elétrico"],"O calorímetro isola o sistema para que as trocas ocorram só entre as substâncias dentro dele."],[5,"Um calorímetro é chamado de ideal quando:","sua capacidade térmica é desprezível e ele não participa das trocas",["ele aquece a água sozinho","tem paredes de metal","tem capacidade térmica muito grande"],"Calorímetro ideal: C desprezível, logo QA + QB = 0."],[5,"Se o calorímetro não é ideal, a equação das trocas fica QA + QB + Qc = 0. Se Qc > 0:","o calorímetro absorveu calor dos corpos",["o calorímetro cedeu calor aos corpos","não houve troca nenhuma","o sistema não está em equilíbrio"],"Qc positivo significa calor recebido pelo calorímetro."],[5,"Café quente é colocado numa xícara fria. Com o tempo:","o café cede calor à xícara até as temperaturas se igualarem",["a xícara cede calor ao café","o café fica cada vez mais quente","não há troca de calor"],"O mais quente (café) cede calor ao mais frio (xícara) até o equilíbrio térmico."],[5,"Misturam-se, num recipiente isolado, 100 g de água a 80 °C e 100 g de água a 20 °C. A temperatura de equilíbrio é:","50 °C",["60 °C","100 °C","40 °C"],"Massas iguais da mesma substância: média das temperaturas, (80 + 20)/2 = 50 °C."],[5,"Misturam-se 200 g de água a 10 °C com 100 g de água a 70 °C (sistema isolado). A temperatura final é:","30 °C",["40 °C","50 °C","20 °C"],"200·(θ − 10) + 100·(θ − 70) = 0 → 300θ = 9 000 → θ = 30 °C."],[5,"Num calorímetro ideal há 200 g de água a 25 °C. Coloca-se um bloco de ferro de 500 g a 100 °C (c = 0,1 cal/g·°C). A temperatura de equilíbrio é:","40 °C",["62,5 °C","25 °C","75 °C"],"200·1·(θ − 25) + 500·0,1·(θ − 100) = 0 → 250θ = 10 000 → θ = 40 °C."],[5,"Num copo há 200 g de água a 25 °C. Que massa de gelo a 0 °C (L = 80 cal/g) faz a água chegar a 0 °C, derretendo todo o gelo?","62,5 g",["80 g","25 g","200 g"],"Calor cedido pela água: 200·1·25 = 5 000 cal. Massa de gelo: 5 000/80 = 62,5 g."],[5,"Uma piscina em dia frio recebe água quente. Esse sistema não é isolado porque:","a água troca calor também com o ambiente (Q1 + Q2 + Qmeio = 0)",["a água quente não troca calor","não existe equilíbrio em piscinas","o ambiente não tem temperatura"],"Em sistema não isolado o meio externo participa: Qmeio > 0 se recebe calor, Qmeio < 0 se cede."],[5,"(FUVEST) Um copo com 250 g de água a 100 °C é posto em 1 L (1 000 g) de água a 25 °C, considerando só trocas entre eles. No primeiro equilíbrio a temperatura é:","40 °C",["62,5 °C","28 °C","50 °C"],"250·(θ − 100) + 1 000·(θ − 25) = 0 → 1 250θ = 50 000 → θ = 40 °C."],[5,"(FUVEST, continuação) O copo, agora a 40 °C, vai para outro litro de água a 25 °C. A nova temperatura de equilíbrio é aproximadamente:","28 °C",["25 °C","32,5 °C","40 °C"],"250·(θ − 40) + 1 000·(θ − 25) = 0 → 1 250θ = 35 000 → θ = 28 °C."],[5,"Em uma troca de calor dentro de um sistema isolado, o corpo que esquenta tem Q:","positivo (recebeu calor)",["negativo (cedeu calor)","nulo","igual à sua temperatura"],"Convenção: Q > 0 para calor recebido e Q < 0 para calor cedido."]]},{"id":"geografia","nome":"Geografia","cor":"#1F8A82","temas":["Desmatamento nas florestas equatoriais","Novo Código Florestal e outras florestas","Taiga, Savanas e Cerrado","Desertificação e arenização","Ambientalismo, Clube de Roma e Estocolmo","Brundtland, Rio-92 e Kyoto","Impasses, Paris e o Brasil no debate ecopolítico"],"q":[[0,"Segundo o livro, qual é o fator decisivo para a ameaça aos ecossistemas globais?","O modelo predatório de exploração dos recursos naturais, ligado à industrialização e ao consumismo",["Apenas o tamanho da população mundial","As mudanças naturais do clima","A atividade dos vulcões"],"O livro afirma que o modelo predatório (industrialização e consumismo) deve ser questionado muito mais que o tamanho da população."],[0,"Os maiores impactos da expansão das atividades humanas, segundo o capítulo, são:","o desmatamento e a redução da biodiversidade mundial",["o aumento das chuvas e dos rios","o crescimento das florestas boreais","a diminuição das cidades"],"O texto aponta desmatamento e perda de biodiversidade como os maiores impactos, sofridos principalmente pelas populações mais carentes."],[0,"Quem sofre principalmente as consequências do desmatamento e da perda de biodiversidade?","As populações mais carentes",["Apenas os grandes empresários","Somente os países ricos","Ninguém, pois os efeitos são apenas naturais"],"O livro destaca que as consequências já são sentidas principalmente pelas populações mais pobres."],[0,"Quais atividades econômicas estão entre as principais causas do desmatamento dos domínios florestais?","Retirada de madeira, abertura de áreas para o agronegócio e mineração",["Turismo ecológico e pesquisa científica","Criação de parques nacionais","Reflorestamento e manejo sustentável"],"O texto cita retirada de madeira, agronegócio e mineração como causas do desmatamento."],[0,"As florestas equatoriais são chamadas de autofágicas porque:","garantem os nutrientes para o próprio desenvolvimento a partir do húmus que elas mesmas formam",["se alimentam de outros biomas vizinhos","crescem em solos muito férteis naturalmente","não precisam de chuva"],"Os nutrientes vêm do húmus formado pela decomposição da matéria orgânica que cai das próprias árvores."],[0,"O húmus corresponde:","à porção da serrapilheira que está em estágios de decomposição",["à camada de rocha abaixo do solo","à água acumulada nos rios","ao sal que se forma na superfície do solo"],"Húmus é a parte da serrapilheira (folhas, galhos, restos orgânicos) em decomposição."],[0,"Normalmente o húmus tem espessura de 1 a 3 cm. Em algumas regiões da Amazônia, ele pode chegar a:","meio metro",["10 metros","1 milímetro","5 metros"],"O livro informa que, em algumas regiões da Amazônia, o húmus chega a meio metro."],[0,"Uma das primeiras consequências do desmatamento das florestas equatoriais é:","o fim da produção de húmus, deixando o solo sem proteção contra as chuvas",["o aumento da fertilidade do solo","a formação imediata de uma nova floresta","a diminuição das chuvas para zero"],"Sem árvores, acaba a formação do húmus e o solo fica exposto às chuvas diárias do clima equatorial."],[0,"Os três principais tipos de degradação dos solos citados no livro são:","erosão superficial, lixiviação e laterização",["fusão, condensação e evaporação","arenização, salinização e glaciação","terremoto, maremoto e vulcanismo"],"O texto descreve erosão superficial, lixiviação e laterização."],[0,"Na erosão superficial, os sedimentos carregados pela chuva se depositam em áreas mais baixas, como leitos de rios, causando:","assoreamento dos rios",["aumento da profundidade dos rios","formação de geleiras","laterização dos rios"],"O acúmulo de sedimentos no leito dos rios é o assoreamento."],[0,"Como a vegetação protege o solo da erosão superficial?","As folhas interceptam as gotas de chuva e diminuem a força com que chegam ao chão",["A vegetação aumenta a força das gotas de chuva","As raízes atraem mais chuva","A vegetação aquece o solo e evapora toda a água"],"As copas reduzem o impacto da chuva no solo; sem elas, a água arrasta os sedimentos."],[0,"A lixiviação é o processo em que:","a água da chuva infiltra, dissolve nutrientes da superfície do solo e os leva para camadas mais profundas",["os minerais sobem por capilaridade e formam uma crosta","o vento leva a areia de um lugar para outro","a água congela dentro do solo"],"Na lixiviação os nutrientes são \"lavados\" para baixo; é maior quando o solo não tem cobertura vegetal."],[0,"A laterização acontece quando:","a água com minerais dissolvidos sobe por capilaridade, evapora, e os minerais formam uma camada impermeável na superfície",["os nutrientes são levados para as camadas profundas","os sedimentos se depositam nos rios","a vegetação cresce rapidamente"],"Com o calor do sol, a água sobe e evapora, \"como se o solo transpirasse\"; os minerais se unem numa camada dura e impermeável."],[0,"Por que solos laterizados contribuem para enchentes?","Porque a camada impermeável dificulta a infiltração e a recarga dos aquíferos, sobrecarregando os rios",["Porque absorvem toda a água da chuva","Porque aumentam a transpiração das árvores","Porque deixam o solo mais fértil"],"Sem infiltração, a água escorre para os rios, que transbordam."],[0,"Grande parte da umidade do ar na região equatorial depende:","da transpiração da floresta",["do degelo das montanhas","da água dos oceanos congelados","das fábricas da região"],"O livro explica que o desmatamento altera o regime de chuvas porque a umidade do ar depende da transpiração da floresta."],[0,"Com o desmatamento, os rios da região equatorial tendem a:","se acidificar, pela grande quantidade de húmus depositada, prejudicando a biodiversidade fluvial",["ficar mais limpos e profundos","congelar","perder toda a água imediatamente"],"O húmus carregado para os rios os acidifica, prejudicando peixes e outras espécies."],[0,"Abaixo do húmus, os solos da Amazônia são:","arenosos e pouco férteis",["muito férteis e argilosos","formados só por rochas vulcânicas","congelados o ano todo"],"Por isso, sem o húmus, a floresta tem dificuldade de se recompor."],[0,"Por que reflorestar áreas degradadas da floresta equatorial é muito difícil?","Porque as espécies nativas dependem do húmus, e o solo abaixo dele é pobre",["Porque não chove na região","Porque as árvores amazônicas não produzem sementes","Porque a lei proíbe o reflorestamento"],"Sem húmus e com solo arenoso e pouco fértil, as espécies nativas não conseguem se desenvolver."],[0,"Segundo o livro, as áreas desmatadas de floresta equatorial tendem a passar por:","savanização, com estações chuvosas e secas",["glaciação","desertificação polar","formação de manguezais"],"O texto diz que essas áreas tendem a virar savanas, com estação chuvosa e estação seca."],[0,"De acordo com a FAO, o Brasil é:","o segundo país com maior área florestal do mundo, atrás apenas da Rússia",["o país com a menor área florestal da América do Sul","o primeiro em área florestal, à frente da Rússia","o décimo país em área florestal"],"O Brasil tem cerca de 12% das florestas do mundo e quase 50% das sul-americanas, atrás só da Rússia (cerca de 20%)."],[0,"O Brasil possui aproximadamente quanto das florestas sul-americanas?","Quase 50%",["Cerca de 5%","Cerca de 12%","Mais de 90%"],"Pelos dados da FAO no livro: cerca de 12% das florestas mundiais e quase metade das sul-americanas."],[0,"Qual floresta brasileira, próxima ao litoral, foi quase totalmente destruída desde o Período Colonial?","Mata Atlântica",["Floresta Amazônica","Taiga","Mata dos Cocais"],"O livro cita a Mata Atlântica como exemplo de floresta litorânea quase destruída."],[0,"O MapBiomas é:","um projeto multi-institucional de mapeamento anual do uso e cobertura da terra no Brasil",["uma lei que proíbe o desmatamento","um parque nacional na Amazônia","uma conferência da ONU"],"O Projeto de Mapeamento Anual do Uso e Cobertura da Terra no Brasil reúne órgãos e ONGs."],[0,"Na tabela da FAO (2015), qual país tinha a maior área florestal em áreas protegidas?","Brasil",["Estados Unidos","Rússia","China"],"O Brasil aparece em 1º lugar, com cerca de 206 milhões de hectares protegidos."],[0,"A Amazônia já perdeu aproximadamente quanto da sua área original?","Cerca de 20%",["Cerca de 2%","Cerca de 80%","Nada, ela está intacta"],"O livro informa que a Amazônia perdeu cerca de 20% da área original."],[0,"Segundo o livro, o que aconteceu com os índices de desmatamento da Amazônia após o novo Código Florestal de 2012?","Voltaram a subir",["Caíram a zero","Não foram mais medidos","Ficaram estáveis para sempre"],"Depois da forte queda no início do séc. XXI, os índices voltaram a subir após o novo Código Florestal."],[0,"Na Cúpula do Clima de Paris (2015), o Brasil se comprometeu a:","zerar o desmatamento ilegal na Amazônia Legal até 2030",["desmatar mais 20% da Amazônia","abandonar o Protocolo de Kyoto","construir mais hidrelétricas na Amazônia até 2020"],"O livro registra a meta brasileira de zerar o desmatamento (ilegal) na Amazônia Legal até 2030."],[0,"Em imagens de satélite, especialistas identificam áreas desmatadas por:","padrões como linhas retas entre a área desmatada (pasto) e a floresta",["manchas azuis no meio da mata","nuvens sempre presentes","sombras de montanhas"],"O ser humano deixa padrões geométricos (linhas retas) que diferenciam o pasto da floresta original."],[0,"O livro \"A vingança das harpias\", de José Milton Oliveira Santos, trata de:","gaviões nativos da Amazônia ameaçados pela destruição do hábitat causada pela extração ilegal de madeira",["peixes do Rio Doce atingidos pela lama","pandas da floresta de bambus","lêmures de Madagascar"],"As harpias são gaviões da Amazônia; na ficção, elas se revoltam contra o desmatamento."],[1,"O novo Código Florestal brasileiro foi aprovado em:","2012",["1972","1992","2015"],"O Congresso aprovou o novo Código Florestal em 2012, após debates entre políticos, ruralistas e cientistas."],[1,"Qual destas mudanças do novo Código Florestal foi criticada por ambientalistas?","Anistia a proprietários que desmataram antes de julho de 2008",["Proibição total do desmatamento","Aumento das Áreas de Preservação Permanente","Obrigação de reflorestar toda a Amazônia"],"O livro lista a anistia para quem desmatou antes de julho de 2008 entre os pontos criticados."],[1,"Segundo o livro, o novo Código Florestal permitiu cultivo de alguns produtos em topos de morro e encostas com inclinação de até:","45°",["5°","90°","10°"],"Foi permitido o cultivo em topos de morro e encostas com inclinação de até 45°."],[1,"Em relação à mata ciliar de rios de até 10 metros de largura, o novo Código:","reduziu pela metade, em alguns casos, a área de vegetação que deve ser preservada",["dobrou a área obrigatória","proibiu qualquer uso do entorno","não mudou nada"],"O texto diz que a área obrigatória no entorno desses rios foi reduzida pela metade em alguns casos."],[1,"Sobre os manguezais, o novo Código Florestal:","autorizou, em alguns casos, a utilização dessas áreas para urbanização e habitação",["proibiu qualquer pesca nos manguezais","transformou todos em parques nacionais","mandou reflorestar todos os manguezais"],"É um dos pontos criticados: uso de áreas de mangue para urbanização e moradia."],[1,"APP significa:","Área de Preservação Permanente",["Área de Produção Pecuária","Agência de Proteção do Planeta","Acordo de Paris pelo Planeta"],"O novo Código flexibilizou o cultivo em Áreas de Preservação Permanente (APP)."],[1,"Quais regiões de floresta equatorial apresentam índices de desmatamento mais alarmantes que os amazônicos?","Vale do Congo e, principalmente, Indonésia",["Canadá e Rússia","Alemanha e Estados Unidos","Austrália e Nova Zelândia"],"O livro cita o Vale do Congo e, sobretudo, a Indonésia."],[1,"Na Malásia, partes da floresta equatorial deram lugar a:","monoculturas de seringueira, para produção de borracha",["plantações de soja","áreas de Taiga","parques nacionais"],"O texto cita a troca da floresta por seringais (borracha), com grandes prejuízos à biodiversidade."],[1,"No sudeste asiático, há grande participação de quais empresas no desflorestamento?","Madeireiras japonesas",["Mineradoras brasileiras","Pesqueiras africanas","Petroleiras canadenses"],"O livro menciona a participação expressiva das madeireiras japonesas."],[1,"Por que o reflorestamento de florestas tropicais é mais acessível que o das equatoriais?","Porque elas não são necessariamente autofágicas e não dependem diretamente do próprio húmus",["Porque não sofrem desmatamento","Porque ficam em regiões geladas","Porque têm solos sempre arenosos"],"Sem a dependência direta do húmus, há recursos técnicos mais acessíveis para reflorestar."],[1,"Quanto resta da Mata Atlântica original no Brasil?","Menos de 10%",["Cerca de 50%","Cerca de 80%","100%, ela está intacta"],"Restam menos de 10%, concentrados principalmente na Serra do Mar, entre São Paulo e Paraná."],[1,"Uma das principais áreas preservadas de Mata Atlântica no Paraná fica no:","Parque Nacional do Iguaçu, onde estão as Cataratas do Iguaçu",["Parque de Yellowstone","Parque Nacional de Marojejy","Vale do Juruá"],"O livro cita o Parque Nacional do Iguaçu, no território paranaense."],[1,"No Caribe, a principal ameaça às florestas tropicais é:","a produção de frutas por grandes transnacionais",["a mineração de carvão","a extração de petróleo","o derretimento do permafrost"],"Apesar das áreas preservadas, a expansão agrícola de frutas por transnacionais ameaça a floresta."],[1,"As florestas tropicais do norte da Austrália estão bem preservadas porque:","estão em uma região remota e pouco povoada",["foram todas transformadas em parques urbanos","não há chuva na região","o governo proibiu a entrada de pessoas"],"O livro explica que a região é remota e pouco povoada, ao contrário do sudeste da Ásia."],[1,"Qual região africana se tornou um ícone do desmatamento mundial?","A Ilha de Madagascar",["O Deserto do Saara","O Vale do Nilo","A Cidade do Cabo"],"Madagascar é destacado como região de maior preocupação na África."],[1,"Os malgaxes são:","a principal etnia da Ilha de Madagascar, mais da metade da população",["uma espécie de lêmure","madeireiras japonesas","um tipo de floresta boreal"],"Malgaxe é a principal etnia de Madagascar."],[1,"Por que muitos camponeses malgaxes produzem carvão vegetal?","Porque, sem acesso à terra devido ao agronegócio, essa é uma das poucas fontes de sustento",["Porque é proibido plantar alimentos","Porque o carvão é exportado para a Europa por eles mesmos","Porque não existe floresta na ilha"],"As mudanças fundiárias dificultaram o acesso à terra, e o carvão da mata nativa virou opção de sustento."],[1,"Por que a perda de floresta em Madagascar é considerada imensurável?","Porque a maioria das espécies é endêmica e muitas ainda nem foram catalogadas",["Porque a ilha é muito pequena","Porque ninguém mora em Madagascar","Porque lá só existem espécies comuns no mundo todo"],"Espécies endêmicas só existem ali; perdê-las é perder patrimônio genético global."],[1,"Espécie endêmica é aquela que:","só existe em uma determinada região",["existe em todos os continentes","foi trazida de outro país","vive só em zoológicos"],"Em Madagascar, como os lêmures, a maioria das espécies é endêmica."],[1,"As florestas subtropicais e temperadas são as mais transformadas pelo ser humano porque:","são ocupadas intensamente desde a Antiguidade e têm madeira e solos de boa qualidade",["ficam em regiões desabitadas","não possuem árvores","são protegidas por gelo"],"Ocupação antiga somada à boa madeira e bons solos levou à degradação."],[1,"Quais são exemplos de parques nacionais que protegem florestas temperadas?","Yellowstone (EUA) e Schwarzwald (Alemanha)",["Iguaçu (Brasil) e Marojejy (Madagascar)","Amazônia e Pantanal","Sahel e Saara"],"O livro cita Yellowstone, nos EUA, e Schwarzwald (Floresta Negra), na Alemanha."],[1,"No Brasil, a floresta subtropical quase totalmente desmatada em meados do século XX foi:","a Mata de Araucárias",["a Floresta Amazônica","a Caatinga","o Pantanal"],"A expansão agrícola e a extração de madeira para a indústria acabaram com a maior parte da Mata de Araucárias."],[1,"Na China, o desmatamento da floresta de bambus ameaça:","o urso-panda, herbívoro que se alimenta de brotos de bambu",["o lêmure","a harpia","o urso-polar"],"A luta pela preservação do panda virou ícone do movimento ambientalista mundial."],[2,"As florestas boreais de coníferas (Taiga) são as mais preservadas do planeta por causa:","da dificuldade de acesso e do clima rigoroso",["da proibição total de corte de árvores","da falta de árvores com madeira útil","da grande população que mora nelas"],"O livro explica que o acesso difícil e o frio rigoroso protegeram essas florestas."],[2,"Os dois países com as maiores áreas de Taiga são:","Rússia e Canadá",["Brasil e Indonésia","China e Japão","Austrália e Madagascar"],"Rússia (Taiga siberiana) e Canadá têm as maiores áreas."],[2,"A maior floresta do planeta, segundo o livro, é:","a Taiga siberiana",["a Floresta Amazônica","a Mata Atlântica","a floresta de bambus da China"],"O texto chama a Taiga siberiana de \"a mais extensa floresta do planeta\"."],[2,"Qual o risco do derretimento do permafrost nas regiões de Taiga?","Liberar bactérias que podem contaminar animais e pessoas e lançar grandes quantidades de carbono na atmosfera",["Aumentar a fertilidade de todos os solos do mundo","Diminuir o aquecimento global","Criar novas florestas equatoriais"],"O permafrost guarda bactérias e carbono; ao derreter, pode liberar ambos e intensificar as mudanças climáticas."],[2,"No Canadá, a situação da Taiga é diferente da Rússia porque:","há processos de manejo, embora ainda haja empresas denunciadas por exploração ilegal",["não existe nenhuma exploração de madeira","o desmatamento está descontrolado e sem nenhuma regra","a floresta foi toda transformada em cidades"],"Na Rússia há aceleração descontrolada; no Canadá há manejo, mas também denúncias de ONGs."],[2,"A principal ameaça às Savanas é:","a expansão agrícola de monoculturas",["o derretimento de geleiras","a pesca predatória","a formação de manguezais"],"Grandes empresários do agronegócio desmatam para monoculturas."],[2,"Por que a agricultura nas Savanas pode poluir solos e rios?","Porque os solos têm baixa fertilidade e exigem muitos insumos agrícolas, que poluem",["Porque não chove nas Savanas","Porque os animais nativos poluem a água","Porque as Savanas ficam perto do mar"],"Solos pobres exigem adubos e agrotóxicos, com elevado poder de degradação."],[2,"O Cerrado é:","o segundo maior bioma do Brasil, com cerca de metade já desmatada",["o menor bioma do Brasil, totalmente preservado","uma floresta boreal","um bioma exclusivo da Região Sul"],"O livro diz que aproximadamente metade do Cerrado já foi desmatada."],[2,"Qual é o principal cultivo do agronegócio responsável por grande parte do desmatamento do Cerrado?","Soja",["Seringueira","Bambu","Uva"],"O livro mostra a soja ao lado do Cerrado original, na divisa de Mateiros (TO) e Formosa do Rio Preto (BA)."],[2,"Além do agronegócio, o Cerrado sofre com o desmatamento para:","produção de carvão vegetal, com mão de obra barata e até trabalho infantil e semiescravo",["construção de estações de esqui","criação de manguezais","extração de gelo"],"Famílias camponesas são exploradas na produção de carvão vegetal."],[2,"O livro \"Cerrado em quadrinhos\", do cartunista Alves, retrata:","problemas socioambientais do Cerrado, como agronegócio, queimadas e povos nativos",["a história do urso-panda","o desastre de Mariana","a Conferência de Estocolmo"],"São tiras humorísticas e de denúncia sobre o Cerrado."],[3,"As Áreas Suscetíveis à Desertificação (ASD) no Brasil se concentram:","na Região Nordeste e em algumas porções do Sudeste",["na Região Norte, na Amazônia","na Região Sul, nas serras gaúchas","apenas no litoral paulista"],"As ASD ocupam 1 488 municípios e cerca de 15,72% do território, sobretudo no Nordeste."],[3,"Aproximadamente qual porcentagem do território brasileiro é ocupada pelas Áreas Suscetíveis à Desertificação?","15,72%",["1,5%","50%","80%"],"O livro informa 15,72% do território nacional, em 1 488 municípios."],[3,"A desertificação no semiárido brasileiro é impulsionada principalmente:","pelo desmatamento da Caatinga para pecuária e agricultura irrigada",["pela construção de geleiras","pelo excesso de chuvas","pela criação de Unidades de Conservação"],"Retirar a Caatinga deixa expostos solos rasos e pedregosos, que não se recuperam facilmente."],[3,"Por que os solos do semiárido não se recuperam com facilidade?","Porque são rasos e pedregosos",["Porque são muito profundos e úmidos","Porque são cobertos por húmus de meio metro","Porque ficam congelados"],"Solos rasos e pedregosos não têm capacidade de se restaurar naturalmente."],[3,"Quem a desertificação no Nordeste afeta principalmente?","Os pequenos produtores e a população local",["Apenas as grandes indústrias","Somente os turistas","Os moradores da Região Sul"],"O regime de chuvas, já irregular, fica pior, com longos períodos de estiagem."],[3,"Cisternas são:","construções que captam e armazenam a água das chuvas",["máquinas que produzem chuva","poços de petróleo","barragens de rejeitos de mineração"],"No semiárido, captam água dos telhados para a família usar durante a estiagem."],[3,"O órgão que mapeou as áreas suscetíveis e os Núcleos de Desertificação no Brasil foi o:","INSA (Instituto Nacional do Semiárido)",["PNUMA","WWF","Clube de Roma"],"O Instituto Nacional do Semiárido identificou os Núcleos de Desertificação."],[3,"Qual destes é um Núcleo de Desertificação brasileiro?","Gilbués (PI)",["Quaraí (RS)","Linhares (ES)","Mariana (MG)"],"Os núcleos citados são Irauçuba, Seridó, Cabrobó, Gilbués, Jaguaribe e Inhamuns."],[3,"A desertificação compromete a segurança alimentar de aproximadamente:","quase 1/3 da população mundial",["1% da população mundial","toda a população mundial","apenas a população europeia"],"Ela atinge mais da metade dos países e ameaça a alimentação de quase um terço da humanidade."],[3,"Segundo a ONU, quantos hectares de terras férteis se tornam improdutivos por ano?","6 milhões, cerca de duas vezes a área da Bélgica",["600 hectares","6 bilhões","60 mil"],"O livro cita 6 milhões de hectares anuais, o dobro da área da Bélgica."],[3,"O continente mais afetado pela desertificação é:","a África",["a Europa","a Oceania","a Antártida"],"Até 50% das terras africanas estão degradadas, segundo algumas fontes."],[3,"O Sahel é:","uma faixa semiárida ao sul do Deserto do Saara, marcada por extrema pobreza",["uma floresta tropical da Ásia","um parque nacional nos EUA","uma conferência sobre o clima"],"No Sahel o deserto avança em média 5 km por ano."],[3,"Em algumas partes do Sahel, o deserto avança em média:","5 km por ano",["5 metros por século","500 km por dia","não avança"],"O livro informa avanço médio de 5 km ao ano."],[3,"Das áreas desmatadas nas últimas décadas (cerca de 120 mil km² por ano), quanto é recuperado?","Apenas 1/10",["Metade","Todo o desmatado","Nada é desmatado"],"Só um décimo é recuperado, naturalmente ou por reflorestamento."],[3,"A diferença entre desertificação e arenização é que a arenização:","ocorre em áreas de clima úmido, e a desertificação em áreas de chuvas irregulares e baixas",["só ocorre em desertos de verdade","é sempre natural, sem ação humana","ocorre apenas no semiárido nordestino"],"A arenização também pode ser impulsionada pela ação humana, mas acontece em climas úmidos."],[3,"No Brasil, formações de areais (arenização) ocorrem principalmente:","no Rio Grande do Sul e em partes do Centro-Oeste",["no sertão da Bahia","na Amazônia Central","no litoral do Ceará"],"O livro cita areais no RS (como em Quaraí) e no Centro-Oeste, com chuvas acima de 1 400 mm por ano."],[3,"A música \"Passarinhos\", de Emicida, citada no capítulo, aborda:","a degradação do planeta e a urbanização descontrolada",["a vida dos pandas","as regras do Protocolo de Kyoto","a formação do húmus"],"A canção trata dos efeitos da urbanização descontrolada e da degradação do planeta."],[4,"Antes da década de 1960, as ações de preservação da natureza tinham interesse principalmente:","econômico, para evitar o esgotamento de algum recurso específico",["religioso","esportivo","turístico"],"Exemplos: limitar a caça ou o número de animais em um pasto para não esgotar o recurso."],[4,"Qual acontecimento contribuiu para o surgimento do movimento ambientalista moderno?","A corrida espacial, com as fotografias da Terra feitas do espaço",["A invenção da máquina a vapor","A descoberta do Brasil","A queda do Império Romano"],"Ver a Terra do espaço despertou a percepção da fragilidade do planeta."],[4,"O determinismo geográfico é a ideia de que:","a condição socioeconômica de um povo é determinada pelas limitações do ambiente natural",["o clima não influencia nada na vida humana","todos os países são igualmente ricos","a natureza deve ser totalmente preservada"],"Frases como \"país sem carvão não se desenvolve\" vêm dessa visão, que ignora história e relações de poder."],[4,"Por que o livro critica o determinismo geográfico?","Porque ele ignora aspectos históricos, relações de poder e interesses dos grupos dominantes",["Porque ele valoriza demais a história","Porque ele defende os países pobres","Porque ele foi criado pela ONU"],"As condições naturais influenciam, mas não são definitivas nem determinantes."],[4,"As teses neomalthusianas se baseiam nas ideias de Thomas Malthus, que defendia:","o controle da natalidade para evitar o colapso alimentar da humanidade",["o aumento do consumo","o fim das florestas","o uso de energia solar"],"Malthus (1766–1834) temia que a população crescesse mais que a produção de alimentos."],[4,"O Clube de Roma foi fundado em 1968 por:","um grupo de cientistas e políticos reunidos na capital italiana",["os presidentes dos EUA e da Rússia","a ONU, no Rio de Janeiro","ambientalistas brasileiros"],"Foi uma organização pioneira no debate dos problemas ecológicos globais."],[4,"O relatório publicado pelo Clube de Roma chamava-se:","Os limites do crescimento",["Nosso futuro comum","Agenda 21","Carta da Terra"],"O relatório reconhecia limites da natureza pressionados pela humanidade."],[4,"O ecomalthusianismo defendia que:","os limites dos recursos naturais eram consequência da explosão demográfica, culpando os países mais pobres",["os países ricos eram os principais culpados","a natureza não tem limites","o consumo deveria aumentar"],"Essa visão colocava os países pobres, de maior crescimento populacional, como responsáveis."],[4,"A Conferência de Estocolmo (1972) foi:","a primeira grande conferência internacional sobre meio ambiente, promovida pela ONU na capital da Suécia",["uma reunião do Clube de Roma na Itália","a conferência que criou o Protocolo de Kyoto","realizada no Rio de Janeiro"],"Estocolmo é a capital da Suécia; a conferência foi em 1972."],[4,"O documento final da Conferência de Estocolmo recomendava:","políticas de controle de natalidade, especialmente nos países pobres",["o fim de toda indústria","o mercado de créditos de carbono","metas para os países ricos reduzirem emissões"],"Ainda influenciada pelo ecomalthusianismo, a conferência recomendou o controle de natalidade."],[4,"A Conferência de Estocolmo celebrou a criação do:","PNUMA, Programa das Nações Unidas para o Meio Ambiente",["MDL, Mecanismo de Desenvolvimento Limpo","INSA","MapBiomas"],"O PNUMA coordena ações internacionais de proteção ambiental e desenvolvimento sustentável."],[4,"Qual destas é uma das seis áreas de atuação do PNUMA?","Mudança climática",["Corrida espacial","Exploração de petróleo","Comércio de armas"],"As áreas: mudança climática; desastres e conflitos; manejo de ecossistemas; governança ambiental; substâncias químicas e resíduos; eficiência no uso dos recursos."],[4,"O conceito de ecodesenvolvimento, criado em Estocolmo, valoriza:","um desenvolvimento capaz de criar bem-estar social a partir das peculiaridades e anseios das populações locais",["o crescimento econômico a qualquer custo","o controle populacional dos países ricos","a exploração máxima da natureza"],"O ecodesenvolvimento considera as particularidades de cada povo e lugar."],[5,"Por que as teses ecomalthusianas enfraqueceram nas décadas seguintes a Estocolmo?","Estudos mostraram que as ações predatórias dos países ricos eram mais determinantes que o crescimento populacional dos pobres",["Porque a população mundial parou de crescer","Porque os países pobres ficaram ricos","Porque o Clube de Roma foi proibido"],"O foco passou do número de pessoas para os padrões de consumo dos ricos."],[5,"O relatório \"Nosso futuro comum\", de 1987, ficou mais conhecido como:","Relatório Brundtland",["Relatório do Clube de Roma","Protocolo de Montreal","Agenda 21"],"O nome vem da norueguesa Gro Harlem Brundtland, que coordenou sua elaboração."],[5,"Qual foi um avanço importante do Relatório Brundtland?","Usar pela primeira vez a expressão \"desenvolvimento sustentável\"",["Defender o aumento da natalidade","Criar o mercado de carbono","Aprovar o Código Florestal brasileiro"],"O relatório também ligou a luta ambiental à paz entre as nações e ao combate à pobreza."],[5,"Desenvolvimento sustentável é um modelo de progresso que:","integra economia, sociedade e meio ambiente",["prioriza só o crescimento econômico","proíbe qualquer atividade econômica","considera apenas a natureza"],"O crescimento econômico deve levar em conta a inclusão social e a proteção ambiental."],[5,"O Relatório Brundtland superou a visão ecomalthusiana porque passou a questionar:","os padrões de consumo das sociedades mais do que as taxas de crescimento populacional",["a existência dos problemas ambientais","o direito dos países ricos ao consumo","o uso das bicicletas"],"O foco deixou de ser o número de pessoas e passou a ser como as sociedades consomem."],[5,"A Eco-92 (Rio-92) foi:","a segunda conferência da ONU sobre meio ambiente, realizada no Rio de Janeiro",["a primeira conferência sobre meio ambiente, em Estocolmo","a conferência que fundou o Clube de Roma","uma reunião em Paris em 2015"],"Ocorreu no Riocentro e teve grandes manifestações populares na cidade."],[5,"Durante a Rio-92, uma grande manifestação em Copacabana protestou contra:","George H. W. Bush, presidente dos EUA, que recusou assinar os principais tratados",["o governo da Suécia","o Clube de Roma","a criação do PNUMA"],"Os participantes protestaram contra a negativa dos EUA em assinar tratados da Eco-92."],[5,"Qual destes documentos teve suas discussões iniciadas na Rio-92?","Agenda 21",["Os limites do crescimento","Nosso futuro comum","Código Florestal de 2012"],"A Rio-92 iniciou as discussões da Agenda 21, da Carta da Terra e do Protocolo de Kyoto."],[5,"A Agenda 21 é:","um programa de incentivos a medidas locais e globais para um século XXI com preservação ambiental, redução das diferenças e paz",["um tratado de comércio de petróleo","o relatório do Clube de Roma","uma lei brasileira sobre florestas"],"Ela incentiva ações locais e globais para preservação, redução das diferenças socioeconômicas e paz."],[5,"A Carta da Terra estabelece:","os direitos da biodiversidade e das futuras gerações",["regras para a mineração","metas de natalidade","o preço dos créditos de carbono"],"Começou a ser elaborada em 1995 e teve a versão final ratificada em 2000."],[5,"O \"princípio das responsabilidades comuns, porém diferenciadas\" significa que:","todos os países devem agir, mas as metas e custos são proporcionais ao impacto histórico de cada nação",["só os países pobres devem reduzir emissões","nenhum país tem responsabilidade","todos os países têm exatamente as mesmas metas"],"Quem poluiu mais historicamente (os ricos) deve contribuir mais."],[5,"Uma contribuição da Rio-92 foi a superação da concepção ecomalthusiana pela tese do desenvolvimento sustentável, colocando as maiores responsabilidades sobre:","os países ricos",["os países pobres","as ONGs","as populações indígenas"],"A Rio-92 inverteu o foco do ecomalthusianismo, que culpava os países pobres."],[5,"O Protocolo de Kyoto foi lançado em:","1997, na cidade japonesa de Kyoto",["1972, em Estocolmo","1992, no Rio de Janeiro","2015, em Paris"],"As negociações começaram na Rio-92 e o protocolo foi lançado em 1997."],[5,"O Protocolo de Kyoto tinha como objetivo:","reduzir a emissão de gases de efeito estufa para diminuir o aquecimento global",["proteger a camada de ozônio dos CFCs","controlar a natalidade nos países pobres","criar parques nacionais"],"Kyoto tratava dos gases de efeito estufa (GEE); a camada de ozônio é tema do Protocolo de Montreal."],[5,"Por que o Protocolo de Kyoto não teve sucesso em reduzir os gases de efeito estufa?","Os EUA não o ratificaram, alegando prejuízo à economia, e influenciaram outros países",["Porque todos os países cumpriram as metas cedo demais","Porque ele proibia a energia solar","Porque não havia metas de redução"],"Mesmo entrando em vigor em 2005, com a adesão da Rússia, o protocolo não alcançou o objetivo."],[5,"O Protocolo de Kyoto entrou em vigor em 2005 graças à adesão:","da Rússia",["dos Estados Unidos","do Clube de Roma","da Noruega apenas"],"O texto diz que entrou em vigor em 2005 com a adesão da Rússia."],[5,"Pelo Protocolo de Kyoto, quantas nações mais emissoras receberam metas de redução?","38",["5","100","195"],"As metas foram para 38 nações que mais emitiam gases, começando pelas mais ricas."],[6,"Segundo o livro, o insucesso da Conferência de Joanesburgo (2002, Rio+10) teve como \"desculpa\":","os reflexos dos atentados de 11 de setembro de 2001 e a \"guerra contra o terror\"",["a falta de convidados","o sucesso total de Kyoto","a chuva em Joanesburgo"],"O livro diz que havia essa desculpa, mas a Rio+20 também fracassou."],[6,"Ambientalistas e cientistas criticam as grandes conferências por causa:","do descompasso entre a rapidez com que os problemas se agravam e a lentidão das decisões políticas",["do excesso de acordos cumpridos","da falta de problemas ambientais","da rapidez das decisões"],"O Protocolo de Kyoto é exemplo desse descompasso."],[6,"A Conferência de Copenhague (2009) deveria:","fixar novas metas dos países ricos e as primeiras metas dos países emergentes",["criar o Clube de Roma","aprovar o Código Florestal","extinguir o PNUMA"],"Diante do impasse, na Rio+20 (2012) decidiu-se prolongar Kyoto até 2020."],[6,"Na Rio+20 (2012), o que foi decidido sobre o Protocolo de Kyoto?","Prolongá-lo até 2020, mas grande parte dos países abandonou o acordo",["Encerrá-lo imediatamente","Transformá-lo no Protocolo de Montreal","Aplicá-lo só ao Brasil"],"Vários países, inclusive a Rússia, abandonaram o acordo, que ficou esvaziado."],[6,"O MDL (Mecanismo de Desenvolvimento Limpo), do Protocolo de Kyoto, criou:","um mercado de créditos de carbono",["uma floresta de bambus","um imposto sobre carros","uma lei de controle de natalidade"],"Países que não atingissem suas metas poderiam comprar créditos (direitos de emissão)."],[6,"Uma das formas de um país conseguir créditos de carbono pelo MDL era:","financiar projetos ambientais em outros países, preferencialmente do mundo periférico",["desmatar mais florestas","aumentar suas emissões","abandonar o protocolo"],"Isso permitiria transferência de renda e tecnologia dos ricos para os pobres."],[6,"Onde os créditos de carbono seriam comercializados?","Em bolsas de valores internacionais",["Em feiras livres","Apenas em bancos públicos","Em leilões de gado"],"O valor oscilaria conforme o mercado, como ações (ex.: Bovespa)."],[6,"O Protocolo de Montreal (1987) restringiu o uso de:","gases que agridem a camada de ozônio",["madeira da Amazônia","energia solar","água das cisternas"],"É um dos poucos acordos ecológicos internacionais de sucesso."],[6,"Qual destes é um motivo do sucesso do Protocolo de Montreal, segundo o livro?","Havia consenso científico e soluções técnicas imediatas com gases alternativos a custo baixo",["Ele atingia todos os setores da economia mundial","Os EUA se recusaram a participar","Não havia soluções técnicas disponíveis"],"Também atingiu menos setores da economia, ao contrário de Kyoto."],[6,"A COP-21 (Paris, 2015) resultou:","no primeiro acordo em décadas com adesão maciça, visando reduzir as emissões de gases de efeito estufa",["no fim do PNUMA","na criação do Clube de Roma","na proibição total de petróleo"],"O Acordo de Paris foi menos ambicioso que Kyoto, mas teve adesão de quase todos."],[6,"O aspecto mais positivo do Acordo de Paris, segundo o livro, é:","a criação de um fundo de US$ 100 bilhões por ano para ajudar países em desenvolvimento a adotar tecnologias menos poluentes",["a anistia a quem desmatou","o controle da natalidade","o sistema de cobrança mútua mais rígido que o de Kyoto"],"O fundo financia tecnologias menos impactantes nos países em desenvolvimento."],[6,"O protesto com milhares de pares de sapatos na Place de la République, em Paris, aconteceu porque:","manifestações públicas estavam proibidas após atentados terroristas, na véspera da COP-21",["os parisienses doaram sapatos aos pobres","era uma feira de calçados","a ONU pediu silêncio total"],"Foi um protesto simbólico e pacífico para contornar a proibição."],[6,"Na COP-22 (Marrakech, 2016), ativistas levavam uma faixa que dizia:","\"Mudemos o sistema, e não o clima\"",["\"Abaixo as bicicletas\"","\"Mais petróleo, menos floresta\"","\"Os limites do crescimento\""],"A COP-22 definiu as regras de implementação do Acordo de Paris."],[6,"A sustentabilidade, termo vindo da Biologia, representa:","o equilíbrio dinâmico entre os seres vivos e a natureza, sem ultrapassar limites que comprometam as futuras gerações",["o crescimento econômico sem limites","a extinção de espécies","um selo comercial de empresas"],"O livro afirma que a sustentabilidade não é opção, mas necessidade."],[6,"Qual crítica os ambientalistas fazem ao uso da expressão \"desenvolvimento sustentável\"?","Virou uma espécie de logomarca banalizada, sem reflexão sobre as mudanças que realmente exige",["Nunca foi usada por governos","É uma expressão muito recente","Só é usada por cientistas"],"Pensa-se que a sustentabilidade deve se adaptar à economia, quando é o modo de produção que deveria mudar."],[6,"Segundo o livro, por que o mundo não consegue avançar na ecodiplomacia?","Por um impasse ideológico e ético que confronta as prioridades das nações",["Por falta total de tecnologia","Porque os problemas ambientais já foram resolvidos","Porque não existem conferências"],"Não é falta de tecnologia nem só de vontade política; envolve países, empresas e indivíduos."],[6,"O Brasil é considerado país-chave no debate ecopolítico porque:","é um dos maiores emissores de gases de efeito estufa e tem a maior parte da floresta amazônica",["não emite nenhum gás de efeito estufa","não possui florestas","fundou o Clube de Roma"],"A Amazônia é uma das últimas florestas equatoriais relativamente preservadas."],[6,"Em 2002, o Brasil:","ratificou o Protocolo de Kyoto",["abandonou a ONU","aprovou o novo Código Florestal","sediou a COP-21"],"O livro cita a ratificação de Kyoto entre os avanços da política ambiental brasileira."],[6,"Qual destas é uma contradição da política ambiental brasileira apontada pelo livro?","Grandes investimentos em usinas hidrelétricas na Amazônia, com impactos ambientais e sociais",["A ratificação do Protocolo de Kyoto","A criação de Unidades de Conservação","Os investimentos em energia solar e eólica"],"As demais alternativas são avanços; as grandes hidrelétricas são citadas como contradição."],[6,"O fraturamento hidráulico (fracking) é uma técnica para extrair:","gás e óleo de folhelho, injetando água sob pressão com produtos químicos",["água de cisternas","madeira da Taiga","energia solar"],"A técnica ameaça as águas subterrâneas e o ecossistema; o Brasil abriu espaço para ela."],[6,"A tragédia de Mariana (MG), em 2015, foi:","o rompimento de uma barragem de rejeitos de mineração, o maior desastre ambiental do Brasil",["um grande incêndio na Amazônia","uma enchente no Rio Grande do Sul","um terremoto no Nordeste"],"A lama assoreou e contaminou o Rio Doce e causou 19 mortes."],[6,"Qual rio foi atingido pela lama da barragem de Mariana?","Rio Doce",["Rio Amazonas","Rio São Francisco","Rio Paraná"],"Imagens de satélite mostram a foz do Rio Doce em Linhares (ES) antes, durante e depois."],[6,"A empresa mineradora envolvida no desastre de Mariana foi a:","Samarco",["Bovespa","Absolar","WWF"],"Em 2017 houve outro vazamento, menor, em um duto da mesma mineradora."],[6,"A \"Pegada Ecológica\", proposta pela rede WWF, calcula:","o tamanho das áreas produtivas de terra e mar necessárias para sustentar o estilo de vida de uma pessoa ou país",["a quantidade de passos dados por dia","a temperatura média da Terra","o número de árvores de uma cidade"],"O resultado é dado em hectares por habitante."],[6,"Segundo o livro, a Pegada Ecológica média mundial é de:","2,7 ha por habitante",["9,5 ha por habitante","menos de 1 ha por habitante","100 ha por habitante"],"EUA: 9,5; indianos e maioria dos africanos: menos de 1; brasileiros: 2,9."],[6,"Qual grupo apresenta a maior Pegada Ecológica entre os citados no livro?","Estadunidenses, com 9,5 ha por habitante",["Indianos, com menos de 1 ha","Brasileiros, com 2,9 ha","Africanos, com menos de 1 ha"],"Isso revela grandes desigualdades entre as sociedades."],[6,"A Pegada Ecológica do brasileiro (2,9 ha/hab) é:","a maior entre os países do grupo BRICS",["a menor do mundo","maior que a dos estadunidenses","igual a zero"],"O livro destaca que é a maior do BRICS."]]},{"id":"historia","nome":"História","cor":"#9A4E22","temas":["Governo-Geral","Câmaras municipais e franceses","Igreja Católica e jesuítas","Escravidão na África e tráfico atlântico","Escravidão na América portuguesa e resistência","Economia e sociedade do açúcar","União Ibérica e holandeses","Revoltas coloniais"],"q":[[0,"Em que ano a Coroa portuguesa criou o Governo-Geral na América?","1548",["1500","1532","1640"],"O Governo-Geral foi criado em 1548, com a publicação do primeiro Regimento."],[0,"Qual era o principal objetivo do Governo-Geral?","Ampliar o controle português sobre a colônia e garantir sua ocupação efetiva",["Tornar a colônia independente de Portugal","Entregar o território aos franceses","Acabar com a produção de açúcar"],"O Governo-Geral buscava centralizar o controle e consolidar a ocupação portuguesa."],[0,"Quais problemas a dominação colonial enfrentava quando o Governo-Geral foi criado?","A resistência indígena e a presença de estrangeiros, como franceses e ingleses",["A falta de terras para plantar","A chegada dos holandeses ao Maranhão","A descoberta do ouro em Minas Gerais"],"Indígenas resistiam à invasão de seus territórios e estrangeiros comerciavam com eles, ameaçando a soberania portuguesa."],[0,"Por que a presença de franceses e ingleses preocupava Portugal?","Eles mantinham comércio com os indígenas e podiam fundar colônias, desfazendo a soberania portuguesa",["Eles queriam comprar o açúcar português a preço justo","Eles eram aliados de Portugal contra a Espanha","Eles trouxeram os jesuítas para a colônia"],"O risco era que esses povos estabelecessem colônias na América portuguesa."],[0,"O primeiro Regimento do Governo-Geral (1548) era um documento que:","estipulava os direitos e deveres do governador, para que seguisse os interesses de Portugal",["declarava a independência da colônia","criava as capitanias hereditárias","proibia a escravidão"],"O Regimento orientava o governador para consolidar a colonização segundo os interesses portugueses."],[0,"Cerca de um terço das instruções do Regimento do Governo-Geral tratava:","da defesa do território",["da educação dos colonos","do comércio com a Holanda","da mineração de ouro"],"Havia ordens para construir embarcações defensivas contra piratas e organizar forças ofensivas."],[0,"Até quando vigorou o primeiro Regimento do Governo-Geral?","Até 1588, quando foi substituído por outro documento",["Até 1500","Até 1822","Até 1549"],"Ele vigorou durante a consolidação da colonização portuguesa no litoral."],[0,"Quem foi o primeiro governador-geral da América portuguesa?","Tomé de Souza",["Mem de Sá","Duarte da Costa","Maurício de Nassau"],"Tomé de Souza, nobre português, chegou em 1549."],[0,"Qual cargo da administração colonial era responsável por aplicar a justiça?","Ouvidor-geral",["Provedor-mor","Capitão-mor da costa","Bispo"],"O ouvidor-geral cuidava da justiça."],[0,"O provedor-mor era responsável:","pelos recursos econômicos do governo",["pela proteção do litoral","pela catequese dos indígenas","pela justiça"],"O provedor-mor controlava as finanças e os recursos econômicos."],[0,"O capitão-mor da costa tinha a função de:","proteger o litoral",["aplicar a justiça","cobrar impostos","dirigir os colégios jesuítas"],"Era o responsável pela defesa da costa."],[0,"Qual foi uma das primeiras medidas de Tomé de Souza?","Construir uma capital: a vila de Salvador, na Capitania da Baía de Todos-os-Santos",["Construir a capital no Rio de Janeiro","Expulsar os jesuítas","Fundar a vila de São Paulo"],"O Regimento mandava construir uma vila com forte; o local escolhido foi a Baía de Todos-os-Santos."],[0,"Salvador, primeira capital da América portuguesa, foi fundada em:","1549",["1500","1763","1630"],"A cidade foi construída a partir da chegada de Tomé de Souza, em 1549."],[0,"Tomé de Souza estimulou a criação de gado para:","servir de alimento e de força de trabalho nos engenhos",["exportar couro para a China","substituir o açúcar","abastecer os navios holandeses"],"O gado era usado como alimento e para mover as máquinas dos engenhos."],[0,"Mem de Sá, que governou até 1572, ficou conhecido por:","pôr em prática as primeiras medidas para expulsar os franceses",["fundar a Companhia de Jesus","trazer os holandeses","transferir a capital para o Rio de Janeiro"],"Ele sucedeu Duarte da Costa e combateu a presença francesa."],[0,"Em 1612, a Coroa reorganizou a colônia, dividindo-a em:","Estado do Grão-Pará e Maranhão e Estado do Brasil",["Nova Holanda e Estado do Brasil","Capitanias do Norte e do Sul, sem governo","Província de Minas e Província da Bahia"],"Cada Estado tinha governador próprio; a divisão durou até 1774."],[0,"Em 1763, a sede do governo foi transferida:","de Salvador para o Rio de Janeiro",["do Rio de Janeiro para Salvador","de Olinda para Recife","de São Vicente para São Paulo"],"A mudança ocorreu pelo desenvolvimento econômico da parte sul da colônia."],[0,"Segundo o Regimento de Tomé de Souza, como deviam ser tratados os indígenas que estabeleceram relações pacíficas com os portugueses?","Deviam ser favorecidos e ajudados",["Deviam ser castigados com rigor","Deviam ser enviados para Portugal","Deviam ser expulsos da colônia"],"O texto mostra tratamento diferente: os aliados eram favorecidos e os que resistiam, punidos."],[0,"Segundo o Regimento, os indígenas que fizeram guerra contra os portugueses deviam ser:","castigados com rigor, com destruição de aldeias, mortes e cativeiro, a menos que pedissem paz e aceitassem sujeição",["premiados com terras","deixados em paz","levados para as Missões sem punição"],"O documento revela a violência usada para \"pacificar\" e submeter os povos nativos."],[1,"A primeira Câmara municipal portuguesa na América foi criada em:","1532, na vila de São Vicente",["1549, em Salvador","1710, em Recife","1500, em Porto Seguro"],"O rei autorizou a Câmara de São Vicente em 1532."],[1,"Quais territórios tinham direito a constituir uma Câmara municipal?","Todo território que recebesse o título de vila ou cidade",["Apenas as capitais","Somente os engenhos","Somente as Missões jesuíticas"],"Assim se adotou na América o modelo de administração municipal de Portugal."],[1,"Diferentemente das Câmaras atuais, as Câmaras coloniais:","tinham poderes múltiplos, inclusive regular preços, cobrar tributos e aplicar a justiça",["tinham apenas atribuições legislativas","não tinham nenhum poder","só cuidavam da religião"],"Elas regulavam a vida local e tinham juízes para crimes menos graves."],[1,"Os crimes mais graves na colônia eram julgados:","por tribunais superiores",["pelas Câmaras municipais","pelos senhores de engenho","pelos jesuítas"],"As Câmaras julgavam crimes menos graves; os graves iam a tribunais superiores."],[1,"As Câmaras municipais adquiriram poder político porque:","podiam enviar reclamações e pedidos ao rei e denunciar governadores",["tinham exércitos próprios","eram donas de todos os engenhos","controlavam o tráfico de escravizados"],"Essa comunicação com o rei influenciava decisões e enfraquecia autoridades denunciadas."],[1,"Entre os séculos XVII e XVIII, as Câmaras municipais chegaram a:","servir de foco de organização de revoltas contra autoridades coloniais",["declarar a independência do Brasil","ser fechadas pelo rei","controlar a Inquisição"],"O poder político das Câmaras fez delas centros de revolta."],[1,"As Câmaras também podiam organizar expedições para:","combater a resistência indígena ou perseguir escravizados fugidos",["descobrir o caminho para as Índias","invadir a Holanda","explorar a Antártida"],"Além de cuidar da cidade, organizavam expedições militares locais."],[1,"Os piratas franceses que atuavam no litoral no século XVI estavam interessados principalmente:","no comércio do pau-brasil",["no ouro de Minas Gerais","no café","na borracha"],"Eles montavam feitorias e atacavam embarcações portuguesas."],[1,"A criação das capitanias hereditárias (1530) tinha como um dos objetivos:","inibir a pirataria francesa no litoral",["acabar com os engenhos","trazer os holandeses","criar o Governo-Geral"],"Mesmo assim, não impediu os franceses de planejar uma colônia."],[1,"A colônia francesa fundada no atual Rio de Janeiro, em 1555, chamava-se:","França Antártica",["Nova Holanda","França Equinocial","Nova Lusitânia"],"Foi liderada por Nicolas de Villegagnon."],[1,"Quem liderou a expedição que fundou a França Antártica?","Nicolas de Villegagnon",["Maurício de Nassau","Felipe II","Manuel Beckman"],"Ele teve apoio do rei francês Henrique II e de comerciantes."],[1,"Na França, a ideia de criar uma colônia na América ganhou força por causa:","dos conflitos entre protestantes e católicos na década de 1550",["da falta de alimentos na Europa","da União Ibérica","da independência dos Países Baixos"],"Alguns viam a colônia como forma de fugir dos conflitos religiosos e formar uma comunidade cristã unida."],[1,"Por que a França Antártica enfrentou conflitos internos?","Reuniu católicos, protestantes e degredados, grupos com interesses distintos",["Era formada apenas por indígenas","Os colonos eram todos protestantes e concordavam em tudo","Não havia nenhum colono"],"Sem voluntários protestantes suficientes, a expedição misturou grupos diferentes."],[1,"O que fez Villegagnon em 1559?","Abandonou as crenças protestantes, reconverteu-se ao catolicismo e voltou à França",["Tornou-se governador-geral do Brasil","Fundou a cidade de Salvador","Aliou-se aos holandeses"],"Ele liderou os franceses até 1559 e depois deixou a colônia."],[2,"Uma das motivações da colonização europeia da América era:","a possibilidade de catequizar a população nativa",["a busca por petróleo","a construção de estradas de ferro","a fuga de uma epidemia"],"Por isso jesuítas vieram com o primeiro governador-geral."],[2,"Os jesuítas que vieram com Tomé de Souza eram comandados por:","Manuel da Nóbrega",["Pedro Fernandes Sardinha","Mem de Sá","Debret"],"Manuel da Nóbrega iniciou a organização religiosa da colônia."],[2,"A Companhia de Jesus foi criada em 1534 com o objetivo de:","difundir a fé católica nas colônias europeias pelo mundo",["comercializar escravizados","fabricar açúcar","combater os portugueses"],"Os jesuítas pertenciam a essa ordem religiosa."],[2,"O primeiro bispado da América portuguesa foi criado em 1552, tendo como primeiro bispo:","dom Pedro Fernandes Sardinha",["Manuel da Nóbrega","Tomé de Souza","Gregório XIII"],"Com o bispado, a Coroa queria organizar a Igreja e garantir os aldeamentos."],[2,"Qual destas ordens religiosas atuou na América portuguesa a partir de 1584?","Franciscanos",["Templários","Hospitalários","Calvinistas"],"Também vieram beneditinos (séc. XVI) e capuchinhos (início do séc. XVII)."],[2,"Os conflitos entre religiosos e colonos geralmente envolviam:","o controle de terras e da mão de obra indígena",["o preço do café","o uso de calculadoras","a escolha do rei de Portugal"],"Os colonos queriam usar os indígenas na lavoura; os jesuítas queriam mantê-los nas Missões."],[2,"Sobre a Inquisição na América portuguesa, é correto afirmar:","nunca houve um Tribunal do Santo Ofício permanente, mas houve visitações da Inquisição",["havia um tribunal permanente em cada vila","a Inquisição nunca chegou à colônia","a Inquisição era comandada pelos holandeses"],"Nas visitações havia interrogatórios e punições por heresia."],[2,"Em uma sociedade muito religiosa, a ameaça de excomunhão era:","aterrorizante para a população",["ignorada por todos","uma recompensa","uma forma de pagar impostos"],"Ir à missa e às festas religiosas era muito importante; a punição religiosa assustava."],[2,"O sincretismo cultural na colônia foi:","a mistura de crenças cristãs com valores indígenas, africanos e tradições judaicas",["a proibição de todas as religiões","a aceitação total e pura do catolicismo europeu","a expulsão dos jesuítas"],"Isso criou crenças e hábitos com características próprias na América."],[2,"A procissão de Corpus Christi (Corpo de Deus), em junho de 1549, em Salvador, serviu para:","iniciar a implantação do calendário religioso de Portugal na colônia",["comemorar a independência","celebrar a expulsão dos holandeses","inaugurar o primeiro engenho"],"Foi uma das primeiras medidas de Nóbrega para organizar a vida religiosa."],[2,"O colégio jesuíta fundado em 1554 no interior da capitania de São Vicente deu origem:","à vila de São Paulo, atual cidade de São Paulo",["à cidade do Rio de Janeiro","à cidade de Salvador","à vila de Recife"],"Em torno do colégio surgiu a vila de São Paulo."],[2,"Até o século XVIII, os principais responsáveis pela educação na América portuguesa foram:","os jesuítas",["os holandeses","os senhores de engenho","os franceses"],"Eles criaram colégios para ensinar leitura e escrita e formar religiosos."],[2,"A \"língua geral\" criada pelos jesuítas era baseada:","no tupi, tronco linguístico dos povos do litoral",["no latim","no holandês","nas línguas africanas bantas"],"A gramática da língua geral, publicada no fim do séc. XVI, ajudava na catequese."],[2,"Como os jesuítas usavam as crenças indígenas na catequese?","Transformavam figuras mitológicas indígenas em figuras santas, como dizer que Tupã era Deus",["Proibiam qualquer conversa sobre os mitos","Adotavam a religião indígena","Ensinavam a religião em latim apenas"],"Isso promovia o sincretismo, mas também desorganizava os modos de vida tradicionais."],[2,"Segundo os jesuítas, Tupansy seria:","a Virgem Maria",["Deus","o diabo","São Paulo"],"Tupã foi associado a Deus e Tupansy à Virgem Maria."],[2,"Como era a vida dos indígenas nas Missões jesuíticas?","Abandonavam estruturas tradicionais e viviam sob rígido controle de horários e trabalho pesado",["Mantinham todos os costumes sem mudança","Não trabalhavam","Eram livres para sair quando quisessem e voltar às aldeias"],"Para os jesuítas, o trabalho ajudava na conversão e na produção de riquezas."],[2,"Nos séculos XVII e XVIII, os jesuítas criaram uma rede de Missões no sul que ia até:","o atual Paraguai",["o Peru","o México","a Venezuela"],"Também construíram aldeamentos no Maranhão e na Amazônia."],[2,"Além das Missões, os jesuítas tornaram-se:","proprietários de terras e de importantes engenhos de açúcar",["donos dos navios holandeses","governadores-gerais","comerciantes de ouro na Ásia"],"Os recursos sustentavam a catequese; mostra a ligação entre fé e exploração colonial."],[2,"Até quando a Companhia de Jesus atuou nos territórios portugueses?","Até o século XVIII, quando foi expulsa",["Até o século XVI","Até hoje, sem interrupção","Até 1549"],"Mudanças políticas em Portugal levaram à expulsão dos jesuítas no século XVIII."],[2,"O calendário gregoriano, criado em 1582 pelo papa Gregório XIII, substituiu o calendário juliano porque:","o juliano tinha defasagem de cerca de 11 minutos por ano, acumulando 10 dias até 1582",["o juliano não tinha meses","o juliano era usado só pelos holandeses","o papa queria mudar o nome dos dias"],"O calendário juliano foi criado em 46 a.C. por Júlio César."],[3,"A pesquisa da Fundação Seade (2017) mostrou que uma pessoa negra com Ensino Médio recebe, em média:","85% do salário de uma pessoa branca em posto semelhante",["o dobro do salário de uma pessoa branca","exatamente o mesmo salário","10% do salário de uma pessoa branca"],"Com ensino superior, a diferença é maior: 65%. Isso evidencia preconceito e desigualdade."],[3,"Segundo o livro, a origem da desigualdade racial no Brasil remonta:","ao processo de colonização e à utilização do trabalho escravizado africano",["à chegada da família real em 1808","ao século XX","à independência dos Estados Unidos"],"Mesmo com o fim da escravidão, no fim do séc. XIX, a desigualdade não foi superada."],[3,"No Império Romano, a mão de obra escravizada:","tinha grande importância para as atividades produtivas",["não existia","era proibida por lei","era usada só nos templos"],"Na Europa feudal, ao contrário, a escravidão perdeu força."],[3,"Durante muito tempo, a escravidão na África:","tinha alcance pequeno e pouca importância econômica, resultando de guerras entre sociedades",["era a base de toda a economia africana","era igual à escravidão moderna nas Américas","não existia"],"Havia número limitado de escravizados, usados em tarefas domésticas, agricultura e exércitos."],[3,"Uma característica da escravidão na África antes dos europeus é que, em geral:","não era hereditária: filhos de escravizadas com homens livres eram livres",["passava sempre de mãe para filho","era aplicada apenas a europeus","não envolvia guerras"],"Com o tempo, os descendentes deixavam de ser vistos como filhos de escravizados."],[3,"A primeira grande mudança no padrão da escravidão na África ocorreu:","após o século VII, com o domínio de povos islâmicos em regiões africanas",["no século XX","com a chegada dos holandeses ao Brasil","com a criação do calendário gregoriano"],"A escravidão ganhou importância em mineração, extração de sal e grandes unidades agrícolas."],[3,"Os povos islâmicos levavam escravizados africanos para regiões como:","Pérsia e Índia",["Brasil e Peru","Portugal e Espanha apenas","Austrália e Japão"],"Eles criaram longas rotas comerciais dentro e fora do continente."],[3,"Segundo o livro, a grande transformação da escravidão africana aconteceu:","a partir do século XV, com a chegada dos europeus e as rotas para a América",["no século VII","na Antiguidade","depois de 1888"],"Os europeus criaram rotas cada vez mais dinâmicas para levar africanos à força."],[3,"Entre as décadas de 1430 e 1470, os portugueses:","exploraram o litoral africano e estabeleceram feitorias",["fundaram Salvador","invadiram a Holanda","criaram o Governo-Geral"],"As feitorias deram início a um comércio ainda pequeno de escravizados."],[3,"Até o século XVI, os escravizados levados pelos portugueses eram usados principalmente:","na produção agrícola das ilhas atlânticas",["nas minas de ouro do Brasil","nas fábricas da Inglaterra","nas plantações de café"],"A grande demanda só surgiu com os engenhos na América."],[3,"Por que começou o comércio atlântico de africanos escravizados para a América portuguesa?","Os engenhos precisavam de mão de obra, e a escravização indígena foi proibida pelas autoridades metropolitanas",["Os africanos pediram para vir à América","Os indígenas exigiram africanos","Os holandeses obrigaram os portugueses"],"A partir de meados do séc. XVI a escravidão africana se tornou a base dos engenhos."],[3,"Com o aumento da demanda por cativos:","o preço subiu, e a escravidão se tornou prática muito lucrativa",["o preço caiu a zero","o tráfico acabou","os europeus deixaram de participar"],"Isso estimulou grupos africanos a intensificar as capturas para vender no litoral."],[3,"Por que os comerciantes europeus não entravam no interior da África para capturar pessoas?","Tinham dificuldade de explorar o interior e pouco conheciam além de cerca de 80 km da costa",["Era proibido pela Igreja","Não havia pessoas no interior","Usavam aviões"],"Os ataques diretos capturavam poucas pessoas; por isso passaram a negociar com africanos."],[3,"Alvise Cadamosto foi:","um explorador veneziano a serviço da Coroa portuguesa que trocava mercadorias por escravizados na África",["um rei africano do Benin","o primeiro governador-geral","um pintor francês"],"Ele trocava cavalos, prata e tecidos por pessoas escravizadas."],[3,"Entre os séculos XV e XVI, os portugueses comerciavam escravizados com chefes do litoral e com:","o Reino de Benin, em partes da atual Nigéria",["o Império Romano","o Sacro Império","a Nova Holanda"],"O livro cita o Reino de Benin como parceiro comercial."],[3,"A partir do século XVII, quais países europeus também passaram a comprar escravizados?","Espanha, Países Baixos e Inglaterra",["Suíça, Áustria e Polônia","Rússia, China e Japão","Apenas Portugal"],"Os portugueses deixaram de ser os únicos compradores."],[3,"Segundo a leitura \"Sociedades desestabilizadas\", qual foi uma consequência do tráfico na África?","Aumento de guerras, desestruturação de sociedades e empobrecimento de regiões",["Fim de todas as guerras","Crescimento populacional em todo o continente","Enriquecimento de todas as sociedades africanas igualmente"],"Alguns reinos se beneficiaram, mas o continente perdeu milhões de pessoas."],[3,"Os comerciantes europeus ampliaram a oferta de cativos oferecendo como moeda de troca:","armamentos",["açúcar","livros","ouro brasileiro"],"As armas eram usadas nas guerras do interior, capturando ainda mais pessoas."],[3,"Segundo o livro, a escravidão foi uma invenção europeia?","Não, mas a presença europeia a transformou em fator de grande desequilíbrio para as sociedades africanas",["Sim, os europeus inventaram a escravidão","Sim, ela começou no Brasil","Não, ela foi inventada pelos holandeses no Recife"],"Quatro séculos de comércio europeu tiveram grande impacto na África até hoje."],[3,"Registros do século XVII indicam que, em algumas regiões africanas, a população:","se reduziu a um oitavo do tamanho anterior ao comércio escravista",["dobrou de tamanho","não mudou","foi toda para a Europa"],"Guerras, doenças e crises de fome provocadas pela desorganização social explicam a queda."],[3,"Os navios que transportavam pessoas escravizadas pelo Atlântico eram chamados de:","navios negreiros",["caravelas da Índia","naus de Kyoto","galeões de prata"],"Com o tempo, passaram a levar centenas de cativos por viagem."],[3,"Como eram as condições dentro dos navios negreiros?","Péssimas: ambiente apertado e poluído, alimentação restrita, punições e muitas mortes",["Confortáveis e seguras","Iguais às dos navios de passageiros ricos","Os cativos viajavam livres no convés"],"Os navios funcionavam como prisão e preparação para o cativeiro."],[3,"Em 1820, os Estados Unidos determinaram que o tráfico de escravizados era:","ilegal, com o mesmo estatuto da pirataria",["legal e incentivado","obrigatório","permitido só no Brasil"],"Foi parte do declínio do tráfico no início do século XIX."],[3,"A partir de 1835, a Inglaterra determinou que os envolvidos no tráfico de escravizados:","poderiam ser punidos com pena de morte",["receberiam prêmios","seriam enviados ao Brasil","não teriam nenhuma punição"],"A Inglaterra passou a reprimir duramente o tráfico."],[3,"No Brasil, apesar de medidas tomadas em 1826, o tráfico atlântico continuou aceito até:","1850",["1700","1822","1988"],"Disputas políticas no Império brasileiro atrasaram o fim do tráfico."],[3,"Aproximadamente quantos africanos foram trazidos à força para a América e para o atual território brasileiro, respectivamente?","Mais de 10 milhões e cerca de 4 milhões",["1 milhão e 100 mil","50 milhões e 40 milhões","10 mil e 4 mil"],"Esses números mostram a dimensão do tráfico atlântico."],[4,"Nas primeiras décadas da colonização, os portugueses pagavam o trabalho indígena por meio do:","escambo (troca de mercadorias)",["salário em moedas de ouro","crédito de carbono","arrendamento de terras"],"Esse modelo deixou de ser suficiente com a criação das fazendas de açúcar, por volta de 1530."],[4,"Por que comerciantes eram contra a escravização indígena?","Queriam controlar o lucrativo abastecimento de mão de obra africana",["Achavam que os indígenas eram ricos","Queriam proteger os jesuítas","Não queriam vender açúcar"],"O tráfico africano dava muito lucro a esses comerciantes."],[4,"Por que os jesuítas eram contra a escravização dos indígenas pelos colonos?","Queriam utilizar a mão de obra indígena em seus aldeamentos",["Queriam que os indígenas fossem para a Europa","Defendiam o tráfico africano por lucro próprio apenas","Queriam vender os indígenas aos holandeses"],"A partir de 1570 várias leis foram criadas contra o cativeiro indígena."],[4,"O exemplo do Engenho Sergipe, na Bahia, mostra que a porcentagem de africanos entre os trabalhadores:","subiu de 7% (1574) para 37% (1591) e 100% (1638)",["caiu de 100% para 7%","ficou sempre em 50%","nunca passou de 10%"],"Isso mostra a lenta substituição da mão de obra indígena pela africana."],[4,"Ao chegar à América portuguesa, os africanos escravizados eram:","registrados na Alfândega e vendidos, normalmente, em leilões",["libertados imediatamente","enviados para escolas jesuítas","devolvidos à África"],"Senhores de terras preferiam comprar homens jovens."],[4,"Por que os senhores separavam famílias e compravam cativos de regiões diferentes da África?","Para evitar rebeliões e vínculos, já que as línguas diferentes dificultavam a comunicação",["Para ensinar várias línguas","Porque era exigido pela Igreja","Para facilitar a fuga"],"Era uma forma de enfraquecer laços culturais entre os escravizados."],[4,"No corte da cana, como os escravizados eram organizados?","Em grupos de 20 a 40 pessoas, em duplas: um homem cortava e uma mulher juntava a cana em feixes",["
