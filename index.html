d = 5·(5 − 3)/2 = 5·2/2 = 5."],[4,"Quantas diagonais tem um hexágono (6 lados)?","9",["18","3","15"],"d = 6·(6 − 3)/2 = 6·3/2 = 9."],[4,"Quantas diagonais tem um heptágono (7 lados)?","14",["28","4","21"],"d = 7·(7 − 3)/2 = 7·4/2 = 14."],[4,"Quantas diagonais tem um octógono (8 lados)?","20",["40","5","28"],"d = 8·(8 − 3)/2 = 8·5/2 = 20."],[4,"Quantas diagonais tem um eneágono (9 lados)?","27",["54","6","36"],"d = 9·(9 − 3)/2 = 9·6/2 = 27."],[4,"Quantas diagonais tem um decágono (10 lados)?","35",["70","7","45"],"d = 10·(10 − 3)/2 = 10·7/2 = 35."],[4,"Quantas diagonais tem um dodecágono (12 lados)?","54",["108","9","66"],"d = 12·(12 − 3)/2 = 12·9/2 = 54."],[4,"Quantas diagonais tem um icoságono (20 lados)?","170",["340","17","190"],"d = 20·(20 − 3)/2 = 20·17/2 = 170."],[4,"Qual é a soma dos ângulos internos de um quadrilátero (4 lados)?","360°",["720°","180°","540°"],"O quadrilátero se divide em 4 − 2 = 2 triângulos: 2·180° = 360°."],[4,"Qual é a soma dos ângulos internos de um pentágono (5 lados)?","540°",["900°","360°","1 080°"],"O pentágono se divide em 5 − 2 = 3 triângulos: 3·180° = 540°."],[4,"Qual é a soma dos ângulos internos de um hexágono (6 lados)?","720°",["1 080°","540°","360°"],"O hexágono se divide em 6 − 2 = 4 triângulos: 4·180° = 720°."],[4,"Qual é a soma dos ângulos internos de um heptágono (7 lados)?","900°",["1 260°","720°","360°"],"O heptágono se divide em 7 − 2 = 5 triângulos: 5·180° = 900°."],[4,"Qual é a soma dos ângulos internos de um octógono (8 lados)?","1 080°",["1 440°","900°","360°"],"O octógono se divide em 8 − 2 = 6 triângulos: 6·180° = 1 080°."],[4,"Qual é a soma dos ângulos internos de um eneágono (9 lados)?","1 260°",["1 620°","1 080°","360°"],"O eneágono se divide em 9 − 2 = 7 triângulos: 7·180° = 1 260°."],[4,"Qual é a soma dos ângulos internos de um decágono (10 lados)?","1 440°",["1 800°","1 260°","360°"],"O decágono se divide em 10 − 2 = 8 triângulos: 8·180° = 1 440°."],[4,"Qual é a soma dos ângulos internos de um dodecágono (12 lados)?","1 800°",["2 160°","1 620°","360°"],"O dodecágono se divide em 12 − 2 = 10 triângulos: 10·180° = 1 800°."],[4,"Quanto mede cada ângulo interno de um quadrado?","90°",["360°","180°","100°"],"Soma = 360°; como os 4 ângulos são iguais: 360° ÷ 4 = 90°."],[4,"Quanto mede cada ângulo interno de um hexágono regular?","120°",["720°","60°","70°"],"Soma = 720°; como os 6 ângulos são iguais: 720° ÷ 6 = 120°."],[4,"Quanto mede cada ângulo interno de um pentágono regular?","108°",["540°","72°","82°"],"Soma = 540°; como os 5 ângulos são iguais: 540° ÷ 5 = 108°."],[4,"Quanto mede cada ângulo interno de um octógono regular?","135°",["1 080°","45°","55°"],"Soma = 1 080°; como os 8 ângulos são iguais: 1 080° ÷ 8 = 135°."],[5,"Uma variável quantitativa é aquela que:","pode ser representada por um número, como idade ou altura",["representa uma qualidade, como a cor do cabelo","não pode ser medida","só aparece em gráficos de linha"],"Ex.: idade, número de filhos, quantidade de imóveis, altura."],[5,"Qual destas é uma variável qualitativa?","Cor do cabelo",["Idade","Altura","Número de filhos"],"Qualitativa não é mensurada por número: gênero, cor do cabelo, religião, estado civil."],[5,"Qual destas é uma variável quantitativa?","Número de filhos",["Religião","Estado civil","Gênero"],"Número de filhos é representado por um numeral."],[5,"O que é um rol em Estatística?","Uma lista de dados organizada em ordem crescente ou decrescente",["A média dos dados","O valor que mais se repete","Um tipo de gráfico de barras"],"Organizar em rol facilita a análise e o cálculo da mediana."],[5,"O rol em ordem crescente de 12, 3, 7, 19 e 5 é:","3, 5, 7, 12, 19",["19, 12, 7, 5, 3","3, 7, 5, 12, 19","12, 3, 7, 19, 5"],"Ordenando do menor para o maior."],[5,"A média aritmética de um conjunto de dados é:","a soma de todos os valores dividida pela quantidade de valores",["o valor do meio do rol","o valor que mais se repete","a diferença entre o maior e o menor valor"],"M = (x1 + x2 + ... + xn)/n."],[5,"A mediana é:","o valor que fica no centro de um conjunto de dados em ordem",["o valor mais frequente","a soma dos valores","o maior valor do conjunto"],"Se n é par, é a média dos dois termos centrais."],[5,"A moda é:","o valor que aparece com maior frequência",["o valor central do rol","a média dos valores","o menor valor do conjunto"],"É o valor que mais se repete."],[5,"Quando o número de dados é par, a mediana é:","a média dos dois termos centrais do rol",["o primeiro termo","sempre zero","o termo que mais se repete"],"Ex.: em 2, 4, 6, 8 a mediana é (4 + 6)/2 = 5."],[5,"Na média ponderada, cada valor:","recebe um peso que influencia proporcionalmente o resultado",["vale sempre o mesmo","é multiplicado por 10","é descartado se for menor"],"M = (p1·x1 + ... + pn·xn)/(p1 + ... + pn)."],[5,"Média, mediana e moda são chamadas de:","medidas de tendência central",["gráficos estatísticos","variáveis qualitativas","espaços amostrais"],"Representam um conjunto de dados por um único número."],[5,"Qual é a média aritmética dos valores 7; 8; 5,5; 2; 9,5; 9; 10?","7,29",["8","51","6,38"],"Soma = 51; quantidade = 7. M = 51/7 = 7,29."],[5,"Qual é a mediana dos valores 7; 8; 5,5; 2; 9,5; 9; 10?","8",["2","7,29","10"],"Rol: 2; 5,5; 7; 8; 9; 9,5; 10. n = 7 ímpar: termo central = 8."],[5,"Qual é a média aritmética dos valores 3; 5; 7; 12; 19?","9,2",["7","46","7,67"],"Soma = 46; quantidade = 5. M = 46/5 = 9,2."],[5,"Qual é a mediana dos valores 3; 5; 7; 12; 19?","7",["3","9,2","19"],"Rol: 3; 5; 7; 12; 19. n = 5 ímpar: termo central = 7."],[5,"Qual é a média aritmética dos valores 2; 4; 4; 6; 9?","5",["4","25","4,17"],"Soma = 25; quantidade = 5. M = 25/5 = 5."],[5,"Qual é a mediana dos valores 2; 4; 4; 6; 9?","4",["2","5","9"],"Rol: 2; 4; 4; 6; 9. n = 5 ímpar: termo central = 4."],[5,"Qual é a moda dos valores 2; 4; 4; 6; 9?","4",["2","9","5"],"O valor 4 aparece 2 vezes, mais que os outros."],[5,"Qual é a média aritmética dos valores 10; 20; 30; 40?","25",["26","100","20"],"Soma = 100; quantidade = 4. M = 100/4 = 25."],[5,"Qual é a mediana dos valores 10; 20; 30; 40?","25",["30","26","40"],"Rol: 10; 20; 30; 40. n = 4 par: média dos centrais (20 + 30)/2 = 25."],[5,"Qual é a média aritmética dos valores 5; 8; 8; 9; 10; 2?","7",["8","42","6"],"Soma = 42; quantidade = 6. M = 42/6 = 7."],[5,"Qual é a mediana dos valores 5; 8; 8; 9; 10; 2?","8",["9","7","10"],"Rol: 2; 5; 8; 8; 9; 10. n = 6 par: média dos centrais (8 + 8)/2 = 8."],[5,"Qual é a moda dos valores 5; 8; 8; 9; 10; 2?","8",["2","10","7"],"O valor 8 aparece 2 vezes, mais que os outros."],[5,"Qual é a média aritmética dos valores 1; 3; 3; 3; 5; 9?","4",["3","24","3,43"],"Soma = 24; quantidade = 6. M = 24/6 = 4."],[5,"Qual é a mediana dos valores 1; 3; 3; 3; 5; 9?","3",["1","4","9"],"Rol: 1; 3; 3; 3; 5; 9. n = 6 par: média dos centrais (3 + 3)/2 = 3."],[5,"Qual é a moda dos valores 1; 3; 3; 3; 5; 9?","3",["1","9","4"],"O valor 3 aparece 3 vezes, mais que os outros."],[5,"Qual é a média aritmética dos valores 6; 7; 7; 8; 12?","8",["7","40","6,67"],"Soma = 40; quantidade = 5. M = 40/5 = 8."],[5,"Qual é a mediana dos valores 6; 7; 7; 8; 12?","7",["6","8","12"],"Rol: 6; 7; 7; 8; 12. n = 5 ímpar: termo central = 7."],[5,"Qual é a moda dos valores 6; 7; 7; 8; 12?","7",["6","12","8"],"O valor 7 aparece 2 vezes, mais que os outros."],[5,"Qual é a média aritmética dos valores 15; 10; 20; 15; 25; 5?","15",["16","90","12,86"],"Soma = 90; quantidade = 6. M = 90/6 = 15."],[5,"Qual é a mediana dos valores 15; 10; 20; 15; 25; 5?","15",["5","16","25"],"Rol: 5; 10; 15; 15; 20; 25. n = 6 par: média dos centrais (15 + 15)/2 = 15."],[5,"Qual é a moda dos valores 15; 10; 20; 15; 25; 5?","15",["5","25","105"],"O valor 15 aparece 2 vezes, mais que os outros."],[5,"Qual é a média ponderada de: nota 7 com peso 2 e nota 8 com peso 3?","7,6",["7,5","38","19"],"M = (2·7 + 3·8)/(2 + 3) = 38/5 = 7,6."],[5,"Qual é a média ponderada de: nota 6 com peso 1 e nota 9 com peso 2?","8",["7,5","24","12"],"M = (1·6 + 2·9)/(1 + 2) = 24/3 = 8."],[5,"Qual é a média ponderada de: nota 5 com peso 2 e nota 10 com peso 3?","8",["7,5","40","20"],"M = (2·5 + 3·10)/(2 + 3) = 40/5 = 8."],[5,"Qual é a média ponderada de: nota 8 com peso 1 e nota 6 com peso 1 e nota 10 com peso 2?","8,5",["8","34","11,33"],"M = (1·8 + 1·6 + 2·10)/(1 + 1 + 2) = 34/4 = 8,5."],[6,"O principal objetivo de um gráfico estatístico é:","tornar mais fácil a comparação e a identificação de padrões nos dados",["esconder os dados","substituir todos os cálculos","mostrar apenas um número"],"Gráficos são representações visuais que ajudam a analisar dados numéricos."],[6,"Em um gráfico de barras, o comprimento de cada barra é:","proporcional ao valor da categoria que ela representa",["sempre igual","aleatório","inversamente proporcional ao valor"],"Assim é possível comparar visualmente as quantidades."],[6,"No gráfico de barras horizontais, os dados variáveis ficam:","no eixo horizontal",["no eixo vertical","fora do gráfico","no título"],"No de barras verticais, os dados variáveis ficam no eixo vertical."],[6,"No gráfico de barras verticais, os dados variáveis ficam:","no eixo vertical",["no eixo horizontal","na legenda","no título"],"E os dados fixos (categorias) ficam no eixo horizontal."],[6,"O gráfico de linhas é geralmente usado para:","mostrar a mudança de uma variável ao longo de um fenômeno, como temperatura ao longo dos dias",["comparar partes de um todo em fatias","listar nomes em ordem alfabética","calcular diagonais"],"Os pontos são ligados por linhas contínuas."],[6,"No gráfico de linhas, os dados são representados por:","pontos ligados por linhas contínuas",["barras de comprimentos diferentes","fatias de um círculo","figuras de polígonos"],"Exemplo do livro: temperaturas médias no Rio de Janeiro em julho de 2024."],[6,"Para mostrar a temperatura média em cada um dos 15 primeiros dias de julho, o gráfico mais adequado é:","o gráfico de linhas",["o gráfico de barras horizontais com clubes","uma tabela de polígonos","o espaço amostral"],"Gráfico de linhas mostra a variação ao longo do tempo."],[6,"Os clubes do livro, da música e dos esportes têm 20, 30 e 50 integrantes. Em um gráfico de barras, qual barra é a maior?","A do clube dos esportes",["A do clube do livro","A do clube da música","Todas são iguais"],"A barra é proporcional ao valor: 50 é o maior."],[6,"Os clubes têm 20, 30 e 50 integrantes. Quantos integrantes há no total?","100",["50","80","60"],"20 + 30 + 50 = 100."],[6,"Os clubes têm 20, 30 e 50 integrantes. Qual a média de integrantes por clube?","33,33 (aproximadamente)",["30","50","100"],"M = 100/3 ≈ 33,33."],[6,"O clube do livro leu 10 livros em janeiro, 17 em fevereiro e 13 em março. Em que mês leu mais?","Fevereiro",["Janeiro","Março","Leu igual nos três"],"No gráfico de barras verticais, a barra de fevereiro (17) é a mais alta."],[6,"O clube do livro leu 10, 17 e 13 livros em três meses. Quantos livros leu no total?","40",["30","37","27"],"10 + 17 + 13 = 40."],[6,"O clube do livro leu 10, 17 e 13 livros em três meses. Qual a mediana?","13",["10","17","40"],"Rol: 10, 13, 17. O termo central é 13."]]},{"id":"portugues","nome":"Língua Portuguesa","cor":"#7D3C98","temas":["Sujeito e predicado","Transitividade verbal","Tipos de predicado e verbos de ligação","Concordância e regência","Referenciação e seleção de palavras","Intolerância e discurso de ódio","Sintagmas adjetivais","Textos do capítulo"],"q":[[0,"Na língua portuguesa, a estrutura básica da oração é formada por:","sujeito e predicado",["substantivo e adjetivo","artigo e preposição","advérbio e conjunção"],"O ser de quem se fala é o sujeito; as informações ditas sobre ele formam o predicado."],[0,"Sujeito e predicado são chamados de:","termos essenciais da oração",["termos acessórios da oração","termos integrantes da oração","vocativos"],"Essa estrutura é tão fundamental para a construção da frase que esses dois termos são os essenciais."],[0,"O sujeito de uma oração é:","o ser sobre o qual se fala",["a ação praticada","o complemento do verbo","a preposição que liga as palavras"],"Os sintagmas nominais podem exercer a função de sujeito."],[0,"O predicado é:","a parte da oração que traz as informações sobre o sujeito",["a palavra que vem sempre no início da frase","o nome da pessoa que fala","um tipo de adjetivo"],"Ele é representado por um sintagma verbal, cujo verbo concorda com o sujeito."],[0,"Na oração \"As principais mudanças envolvem a substituição de alimentos in natura\", o sujeito é:","As principais mudanças",["envolvem a substituição","alimentos in natura","a substituição de alimentos"],"O núcleo do sujeito é \"mudanças\"; o resto da oração é o predicado."],[0,"Na oração \"As principais mudanças envolvem a substituição de alimentos in natura\", o predicado é:","envolvem a substituição de alimentos in natura",["As principais mudanças","As principais","mudanças envolvem"],"O predicado traz as informações sobre o sujeito \"as principais mudanças\"."],[0,"O número de orações em um período é indicado:","pela quantidade de verbos (ou locuções verbais)",["pela quantidade de vírgulas","pela quantidade de substantivos","pelo número de linhas"],"As orações se organizam com base em um verbo; uma oração tem um verbo ou locução verbal."],[0,"Em \"Lemos as informações nutricionais do alimento\", o sujeito é identificado pela forma do verbo como:","nós",["eles","você","eu"],"O verbo \"lemos\" revela que quem lê somos \"nós\": sujeito identificado pela forma verbal."],[0,"Na comunicação, o \"ser\" geralmente é representado por:","substantivos, pronomes, numerais e adjetivos",["apenas verbos","apenas preposições","apenas advérbios"],"Já a ação é representada pelos verbos."],[0,"Os verbos são palavras capazes de demonstrar:","movimento, mudança ou permanência de estado e fenômenos naturais",["apenas nomes de objetos","apenas lugares","apenas quantidades"],"O verbo é a palavra que representa a ação ou o estado."],[0,"Em \"Houve mudança devido à Ciência da Nutrição\", temos:","uma oração sem sujeito, formada apenas pelo predicado",["sujeito \"mudança\" e predicado \"houve\"","sujeito \"a Ciência da Nutrição\"","duas orações com sujeito oculto"],"O verbo \"haver\" no sentido de existir é impessoal: indica um fato e não concorda com sujeito."],[0,"Nas orações sem sujeito, o verbo:","é impessoal e indica, normalmente, um fato",["sempre fica no plural","concorda com o objeto","é sempre de ligação"],"Não há ser sobre o qual a informação é dada; há apenas o predicado."],[1,"Verbos de significação absoluta, que têm sentido completo sozinhos, são chamados de:","intransitivos",["transitivos diretos","transitivos indiretos","de ligação"],"Ex.: \"As ações contra a obesidade não param por aí\": \"param\" não precisa de complemento."],[1,"Verbos de significação relativa, que precisam de complemento, são chamados de:","transitivos",["intransitivos","impessoais","de ligação"],"Ex.: \"Os nutricionistas defendem\" fica incompleto: defendem o quê?"],[1,"Em \"Os nutricionistas defendem a boa alimentação\", o termo \"a boa alimentação\" é:","objeto direto",["objeto indireto","sujeito","predicativo do sujeito"],"O complemento se liga ao verbo sem preposição: quem defende, defende algo."],[1,"Em \"Todos apelam para o bom senso\", o verbo \"apelam\" é:","transitivo indireto, com objeto indireto introduzido pela preposição \"para\"",["transitivo direto","intransitivo","de ligação"],"Quem apela, apela para algo: o complemento vem com preposição."],[1,"O objeto indireto é o complemento que se liga ao verbo:","por meio de uma preposição",["sem nenhuma preposição","por meio de uma vírgula","apenas com artigo"],"Por isso se chama \"indireto\"."],[1,"Em \"Os nutricionistas pedem atenção aos pais\", o verbo \"pedir\" é:","transitivo direto e indireto (pedem algo a alguém)",["intransitivo","de ligação","apenas transitivo indireto"],"\"atenção\" é o objeto direto e \"aos pais\" é o objeto indireto."],[1,"Em \"Os nutricionistas pedem atenção aos pais\", o objeto indireto é:","aos pais",["atenção","Os nutricionistas","pedem"],"\"aos pais\" vem com preposição (\"a\" + \"os\")."],[1,"Em \"As ações contra a obesidade não param por aí\", o verbo \"param\" é:","intransitivo",["transitivo direto","transitivo indireto","de ligação"],"O verbo tem sentido completo; \"por aí\" é apenas uma circunstância."],[1,"Na frase \"Os nutricionistas defendem.\", o que torna o sentido incompleto?","O verbo \"defender\" é transitivo e está sem complemento",["Falta um sujeito","O verbo está no plural","Falta um adjetivo"],"Para a oração ter sentido completo, foi preciso acrescentar \"a boa alimentação\"."],[1,"Qual verbo está sendo usado como transitivo direto?","\"Nós preparamos os alimentos.\"",["\"Todos apelam para o bom senso.\"","\"As ações não param.\"","\"A comida está boa.\""],"\"os alimentos\" se liga ao verbo sem preposição: objeto direto."],[1,"O verbo \"assistir\" no sentido de \"ver\" (assistir ao filme) pede:","complemento com a preposição \"a\"",["complemento sem preposição","nenhum complemento","sempre um predicativo"],"\"Eu levei meus avós para assistir ao filme\" = ver o filme."],[1,"Em \"eu assisti aquele senhor\", o verbo \"assistir\" significa:","ajudar, prestar assistência",["ver um filme","morar","esquecer"],"Sem preposição, \"assistir\" tem o sentido de ajudar: \"eu ajudei aquele senhor\"."],[2,"Verbo nocional é aquele que:","indica um processo, como ação ou movimento",["apenas liga o sujeito a uma característica","nunca tem sujeito","é sempre impessoal"],"Todo verbo intransitivo ou transitivo é nocional."],[2,"Se o verbo da oração for nocional, o predicado é:","verbal",["nominal","verbo-nominal obrigatoriamente","inexistente"],"Dica do livro: verbo nocional → predicado verbal; verbo de ligação → predicado nominal."],[2,"Se o verbo da oração for de ligação, o predicado é:","nominal",["verbal","impessoal","transitivo"],"O núcleo do predicado nominal é um nome (o predicativo do sujeito)."],[2,"Em \"A cientista foi para a apresentação sobre nutrição\", o predicado é:","verbal, pois o verbo \"ir\" indica movimento",["nominal, pois \"foi\" é verbo de ligação","verbo-nominal","inexistente"],"\"foi\" aqui é o verbo \"ir\" (movimento), não o verbo \"ser\"."],[2,"Em \"Nós preparamos os alimentos in natura para as refeições do dia\", o predicado é:","verbal",["nominal","verbo-nominal","sem verbo"],"\"preparamos\" é verbo nocional (ação), núcleo do predicado."],[2,"Em \"Alimentação saudável é essencial\", o predicado é:","nominal, com núcleo \"essencial\"",["verbal, com núcleo \"é\"","verbo-nominal","inexistente"],"\"é\" apenas liga o sujeito à característica \"essencial\", que é o predicativo do sujeito."],[2,"Os verbos de ligação têm a função de:","ligar ou relacionar um nome (predicativo) ao sujeito que ele qualifica",["indicar uma ação concreta","ligar duas orações","substituir o sujeito"],"Eles indicam estado, não processo."],[2,"Qual destas listas contém apenas verbos que costumam funcionar como verbos de ligação?","ser, estar, ficar, parecer, permanecer, continuar, andar",["correr, pular, comer, beber","defender, pedir, apelar, preparar","haver, chover, nevar, ventar"],"Ex.: \"A boa alimentação é / está / anda / continua / permanece / ficou / parece difícil.\""],[2,"Em \"A boa alimentação parece difícil\", o termo \"difícil\" é:","predicativo do sujeito",["objeto direto","objeto indireto","adjunto adverbial"],"\"parece\" é verbo de ligação e \"difícil\" atribui uma característica ao sujeito."],[2,"Em \"A boa alimentação virou uma obsessão\", o verbo \"virar\" é:","de ligação, indicando mudança de estado",["de ação, indicando movimento do corpo","intransitivo","impessoal"],"Ele apenas relaciona o predicativo \"uma obsessão\" ao sujeito."],[2,"Em \"Ela virou-se para comer\", o verbo \"virar\" é:","verbo de ação, indicando um processo",["verbo de ligação","verbo impessoal","predicativo"],"Aqui \"virar\" indica movimento; o contexto define a função do verbo."],[2,"Em \"Os produtos in natura são mais saudáveis\", o núcleo do predicado é:","saudáveis",["são","produtos","in natura"],"O verbo \"são\" é de ligação; o nome \"saudáveis\" é o núcleo significativo (predicado nominal)."],[2,"Por que \"saudáveis\" muda para \"saudável\" em \"O produto in natura é mais saudável\"?","Porque o predicativo concorda com o sujeito",["Porque o verbo é intransitivo","Porque é uma regra de regência","Porque o adjetivo é invariável"],"Pelo mecanismo de concordância, se \"produto\" vai para o singular, \"saudável\" também vai."],[2,"Em \"Os nutricionistas pedem atenção aos pais\", o núcleo do predicado é:","o verbo \"pedem\"",["o nome \"atenção\"","o nome \"pais\"","o sujeito \"nutricionistas\""],"O verbo concorda com o sujeito e é o núcleo significativo: predicado verbal."],[2,"O predicado verbo-nominal é aquele que:","tem dois núcleos significativos: um verbo e um nome",["não tem nenhum verbo","tem só verbo de ligação","tem só um nome"],"É a fusão de um predicado verbal com um predicado nominal."],[2,"Em \"Os pacientes chegaram nervosos ao consultório\", o predicado é:","verbo-nominal",["nominal","verbal","inexistente"],"\"chegaram\" é verbo nocional e \"nervosos\" é predicativo do sujeito: dois núcleos."],[2,"Em \"Você publicava os estudos feliz\", o termo \"feliz\" é:","predicativo do sujeito",["predicativo do objeto","objeto direto","adjunto adverbial de modo"],"\"feliz\" indica uma característica do sujeito \"você\", e o predicado é verbo-nominal."],[2,"A oração \"Você publicava os estudos feliz\" equivale a:","\"Você publicava os estudos e você estava feliz\"",["\"Os estudos estavam felizes\"","\"Você não publicava os estudos\"","\"Feliz publicava você\""],"O predicado verbo-nominal é uma forma concisa de juntar um predicado verbal e um nominal."],[2,"No predicado verbo-nominal, o verbo é sempre:","nocional",["de ligação","impessoal","auxiliar"],"O verbo indica processo, e o predicativo atribui estado ou qualidade."],[2,"Em \"Os cientistas elegeram a pesquisadora representante do estudo de nutrição\", o termo \"representante do estudo de nutrição\" é:","predicativo do objeto",["predicativo do sujeito","objeto indireto","sujeito"],"Ele caracteriza o objeto direto \"a pesquisadora\"."],[2,"Em \"As nutricionistas consideram os ultraprocessados danosos\", o termo \"danosos\" é:","predicativo do objeto",["predicativo do sujeito","objeto direto","adjunto adnominal do sujeito"],"\"danosos\" qualifica o objeto \"os ultraprocessados\" e concorda com ele."],[2,"Em \"A nutricionista considera o ultraprocessado danoso\", por que \"danoso\" está no singular?","Porque o predicativo do objeto concorda com o núcleo do objeto",["Porque concorda com o sujeito","Porque o verbo está no singular","Porque é um advérbio"],"Mudando o objeto para o singular, o predicativo também vai para o singular."],[2,"O predicativo do sujeito estabelece concordância com:","o núcleo do sujeito",["o objeto direto","o objeto indireto","a preposição"],"Ex.: \"Os pacientes chegaram nervosos\" / \"O paciente chegou nervoso\"."],[2,"Núcleo, em Gramática, é:","tudo aquilo que concentra em si a importância de algum termo",["a última palavra da frase","sempre um verbo","sempre um artigo"],"Sujeitos e predicados têm seus núcleos."],[3,"Concordância é o mecanismo gramatical de:","adaptar as palavras determinadas a seus determinantes",["ligar palavras por preposições","retomar termos já ditos","separar orações por vírgula"],"Pode ser nominal (entre nomes) ou verbal (entre o núcleo do sujeito e o verbo)."],[3,"A concordância nominal é a relação estabelecida:","entre os nomes",["entre o sujeito e o verbo","entre o verbo e a preposição","entre duas orações"],"Ex.: artigos e adjetivos concordam em gênero e número com o substantivo."],[3,"A concordância verbal é a relação estabelecida:","entre o núcleo do sujeito e o verbo",["entre o adjetivo e o substantivo","entre o artigo e o numeral","entre o advérbio e o adjetivo"],"Ex.: \"Os idosos merecem respeito\" / \"O ancião merece respeito\"."],[3,"Os nomes podem sofrer flexões de:","gênero e número",["tempo e modo","pessoa e voz","aspecto e modo"],"Já os verbos se flexionam em tempo, número e pessoa."],[3,"Os verbos podem sofrer flexões de:","tempo, número e pessoa",["gênero apenas","grau apenas","gênero e grau"],"Por isso o verbo se adapta ao sujeito."],[3,"Em \"Os idosos / Os velhos / Os anciãos merecem respeito\", se o sujeito fosse \"O ancião\", o verbo seria:","merece",["merecem","merecemos","mereceram"],"O verbo precisa concordar com o sujeito no singular."],[3,"Em uma oração, os núcleos dos sintagmas são chamados de:","determinantes",["determinados","referentes","regidos"],"As palavras que se ligam aos núcleos são as determinadas."],[3,"Cada sintagma é organizado em torno de:","um núcleo, que é o termo mais importante do agrupamento",["uma vírgula","uma conjunção","um ponto final"],"O núcleo pode ser um nome (sintagma nominal) ou um verbo (sintagma verbal)."],[3,"Sintagma nominal é aquele cujo núcleo é:","um nome",["um verbo","uma preposição","um advérbio"],"Já o sintagma verbal tem um verbo como núcleo."],[3,"No cartaz \"Violência contra o idoso é crime\", o núcleo do sintagma nominal \"violência contra o idoso\" é:","violência",["idoso","contra","crime"],"\"violência\" precisa de complemento de sentido (\"contra o idoso\")."],[3,"No cartaz, \"Violência contra o idoso é crime\" foi reescrito como \"Constrangimentos contra a pessoa idosa são crimes\". Por que \"é\" virou \"são\"?","Porque o núcleo do sujeito foi para o plural (constrangimentos)",["Porque \"idosa\" é feminino","Porque a frase ficou mais longa","Porque \"crime\" é singular"],"O verbo concorda em número com o núcleo do sujeito."],[3,"Em \"E você pode ajudar a combatê-la\", o pronome \"-la\" retoma:","a violência",["você","o idoso","o crime"],"O pronome evita repetir \"violência\" e dá fluidez ao texto."],[3,"Na reescrita \"E nós podemos ajudar a combatê-los\", o \"-los\" passou a retomar:","constrangimentos",["nós","a pessoa idosa","crimes contra você"],"\"constrangimentos\" é masculino plural, então o pronome mudou de \"-la\" para \"-los\"."],[3,"Ao trocar \"você\" por \"nós\" no cartaz, o que muda no sentido?","A campanha passa a incluir também quem fala como responsável pelo combate",["A campanha deixa de falar de violência","O idoso passa a ser o culpado","Nada muda no sentido"],"\"você\" se dirige só ao observador; \"nós\" inclui o enunciador e todas as pessoas."],[3,"Regência é o estudo de:","como os termos dependentes se ligam a outras palavras, de maneira direta ou indireta",["como as palavras concordam em gênero","como se separam as sílabas","como se acentuam as palavras"],"Há termos regentes (que pedem complemento) e regidos (que completam)."],[3,"Quando o termo regente é um nome, temos:","regência nominal",["regência verbal","concordância verbal","referenciação"],"Quando o regente é um verbo, a regência é verbal."],[3,"Quando o termo regente é um verbo, temos:","regência verbal",["regência nominal","concordância nominal","predicado nominal"],"Ex.: \"assistir ao filme\" (o verbo rege a preposição \"a\")."],[3,"Em \"violência contra o idoso\", a regência é indireta porque:","há uma preposição (\"contra\") ligando o regente ao termo regido",["não há preposição","o verbo é intransitivo","\"idoso\" é um adjetivo"],"Quando uma preposição liga as palavras, a regência é indireta."],[3,"O complemento nominal tem a função de:","completar ou realçar o sentido de um nome (substantivo, adjetivo ou advérbio)",["completar o sentido de um verbo","indicar o sujeito","ligar duas orações"],"Em \"violência contra o idoso\", \"contra o idoso\" completa o sentido de \"violência\"."],[3,"Os termos que pedem complemento são chamados de:","regentes",["regidos","determinados","vocativos"],"Os termos que completam o sentido são os regidos."],[3,"Em português, a ordem direta da oração é:","sujeito + verbo + complemento",["verbo + sujeito + complemento","complemento + verbo + sujeito","sujeito + complemento + verbo"],"O português é flexível e admite ordens inversas, como \"Merecem respeito os da melhor idade\"."],[3,"Em alemão, segundo o livro, o verbo conjugado:","ocupa sempre a segunda posição da frase",["vem sempre no fim da frase","não existe","vem sempre antes do sujeito"],"Por isso o livro aconselha não comparar outro idioma com a língua materna ao aprender."],[4,"As pessoas do discurso são:","1ª (eu/nós), 2ª (tu/vós) e 3ª (ele, ela, eles, elas)",["apenas eu e você","sujeito, verbo e objeto","artigo, nome e adjetivo"],"A 1ª pessoa fala, a 2ª é com quem se fala e a 3ª é de quem ou do que se fala."],[4,"A 1ª pessoa do discurso corresponde a:","quem produz a sentença (eu/nós)",["com quem se fala (tu/vós)","de quem se fala (ele/ela)","o objeto da frase"],"Quem toma a palavra se constitui no \"eu\"."],[4,"A 2ª pessoa do discurso corresponde a:","com quem se fala, o interlocutor (tu/vós)",["quem fala (eu)","o assunto (ele)","um lugar"],"Quem fala é o \"eu\", e o seu interlocutor é o \"tu\"."],[4,"Referentes são:","palavras cujo significado está atrelado a alguma situação ou a algum termo já expresso",["palavras que só existem em outras línguas","verbos de ligação","sinais de pontuação"],"Ex.: pronomes que retomam termos e advérbios como \"aqui\" e \"agora\"."],[4,"Os advérbios \"aqui\" e \"agora\" fazem referência:","ao espaço e ao tempo da fala",["a uma pessoa específica","ao objeto direto","ao sujeito da frase"],"O momento da fala é o presente (\"agora\") e o espaço do falante é o \"aqui\"."],[4,"Os pronomes relativos introduzem orações adjetivas e:","estabelecem concordância com o antecedente, a que se referem",["nunca têm antecedente","funcionam sempre como verbos","indicam sempre o futuro"],"Identificar o referente desses termos é fundamental."],[4,"Por que usar pronomes para retomar termos já ditos no texto?","Para evitar repetições e deixar o texto mais fluido",["Para deixar o texto mais longo","Para confundir o leitor","Porque é proibido repetir palavras"],"Repetir \"a violência\" deixaria o texto lento, sem fluidez."],[4,"Na reportagem sobre a seresta, a repórter usa aspas para:","ceder a voz às entrevistadas, marcando a citação da fala delas",["indicar palavras estrangeiras","destacar erros de português","mostrar ironia"],"As entrevistadas passam a falar em 1ª pessoa dentro das aspas."],[4,"Verbos como \"relembra\", \"diz\" e \"fala e completa\", na reportagem, servem para:","marcar quando a voz volta para a repórter e apresentar a fala das entrevistadas",["indicar o predicado nominal","substituir os pronomes","mostrar a regência nominal"],"São recursos textuais que evidenciam a \"batalha de vozes\" do texto."],[4,"A língua portuguesa possui cerca de:","500 mil palavras",["5 mil palavras","50 milhões de palavras","500 palavras"],"Contando uma por segundo, levaria cerca de seis dias para terminar."],[4,"Termos sinonímicos são aqueles que:","têm significado semelhante",["têm significado oposto","têm a mesma escrita e sentidos diferentes","não têm significado"],"Ex.: idosos, velhos, anciãos, pessoas da melhor idade."],[4,"Por que \"Idosos têm direitos\" e \"Velhos têm privilégios\" passam sentidos diferentes?","Porque palavras semelhantes não são iguais: a segunda permite um sentido irônico ou crítico",["Porque têm o mesmo sentido exato","Porque uma está no singular","Porque \"têm\" muda de significado"],"Semelhante é diferente de igual; a escolha das palavras muda o efeito de sentido."],[4,"Ao produzir um texto, o falante faz uma seleção e uma combinação de palavras. Isso significa que ele:","escolhe palavras entre as disponíveis e as organiza conforme o sentido que pretende",["usa sempre as mesmas palavras","não pode mudar a ordem das palavras","usa todas as 500 mil palavras"],"A organização das frases pode mudar o efeito de sentido delas."],[5,"Segundo o dicionário Aulete digital, intolerância é:","atitude agressiva ou repressora para com as diferenças de outrem, como etnia, crença, opinião ou modo de vida",["capacidade de aceitar as diferenças","direito de expressar opiniões","falta de vontade de comer"],"Quando essa intolerância se manifesta, temos o discurso de ódio."],[5,"O discurso de ódio é, em geral:","a manifestação de ódio e desprezo contra determinados grupos, com base no preconceito",["uma opinião respeitosa e diferente","um debate democrático","uma crítica a um produto"],"Infelizmente ocorre com muita frequência, inclusive no ambiente digital."],[5,"Segundo o livro, a internet oferece:","uma falsa sensação de liberdade, como se fosse possível falar tudo sem consequências",["liberdade total sem nenhuma regra","proteção contra qualquer crime","apenas informações verdadeiras"],"A ideia de falar tudo sem consequências está errada."],[5,"A Constituição Federal garante a livre manifestação do pensamento, mas também afirma que:","são invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas",["todos podem ofender quem quiserem","a internet não tem lei","só jornalistas podem opinar"],"Quem viola esses direitos pode ser obrigado a indenizar por dano material ou moral."],[5,"O limite entre a liberdade de expressão e o discurso de ódio está:","no respeito à intimidade, à vida privada, à honra e à imagem das pessoas",["no número de seguidores de quem fala","no horário em que se fala","no idioma usado"],"Quando há segregação, preconceito ou ofensa à dignidade humana, há discurso de ódio."],[5,"A boa convivência com a pluralidade de ideias exige:","respeito: pode-se discordar, mas não menosprezar nem agredir",["que todos pensem igual","que ninguém discorde de ninguém","que as diferenças sejam escondidas"],"Assim como você tem direito de expressar suas ideias, os outros também têm."],[5,"A Cartilha da tolerância foi lançada pelo:","Ministério Público de São Paulo (MPSP)",["Ministério da Saúde","Organização Mundial da Saúde","Pasta Grannies"],"O objetivo era conscientizar e estimular atitudes positivas como tolerância e empatia."],[5,"O slogan da Cartilha da tolerância é:","\"Quem se dá bem com gente se dá bem na vida\"",["\"Prato bom é prato colorido\"","\"Disque 100\"","\"Mudemos o sistema, e não o clima\""],"A argumentação associa a tolerância ao sucesso na vida e nas relações."],[5,"Na frase \"A tolerância gera pessoas melhores, profissionais melhores e, consequentemente, uma sociedade melhor\", a repetição de \"melhor(es)\":","é intencional, para evidenciar os benefícios da tolerância",["é um erro de concordância","deve ser evitada sempre","indica ironia"],"A repetição é uma intencionalidade discursiva."],[5,"O projeto \"100 faces 100 countries\", do fotógrafo turco Mustafa Çankaya, busca:","valorizar a pluralidade e as características próprias de cada pessoa",["mostrar que todos são iguais fisicamente","vender roupas","mapear aeroportos"],"No aeroporto, ele fotografa pessoas com traços que chamam sua atenção."],[5,"Segundo o livro, a democracia se pauta:","na garantia de ideias e de expressão, para que os povos debatam e cheguem às melhores conclusões",["na proibição de opiniões diferentes","na escolha de um único pensamento","na ausência de leis"],"Encontrar pessoas com ideias diferentes é um momento rico de aprendizado."],[6,"Sintagmas adjetivais são aqueles que têm como núcleo:","um adjetivo ou uma locução adjetiva",["um verbo","um substantivo","uma preposição"],"Podem ser modificados por um intensificador (sempre preposto) e admitem variação de grau."],[6,"Em \"idioma brasileiro\", a palavra \"brasileiro\":","é um adjetivo que caracteriza o substantivo e aponta qual é o idioma",["é o núcleo do sintagma","é um verbo","é um advérbio"],"O adjetivo indica exatamente a língua à qual o falante se refere."],[6,"Em \"A tolerância gera pessoas melhores\", o termo \"A tolerância\" tem função de:","sujeito",["predicado","objeto direto","adjunto adnominal"],"É um sintagma nominal na função de sujeito."],[6,"Em \"A tolerância gera pessoas melhores\", o termo \"pessoas melhores\" tem função de:","complemento verbal (objeto direto)",["sujeito","predicativo do sujeito","adjunto adverbial"],"É um sintagma nominal que completa o verbo \"gera\"."],[6,"Em \"A tolerância gera pessoas melhores\", a palavra \"melhores\" é:","um sintagma adjetival com função de adjunto adnominal",["o núcleo do sujeito","um verbo","um objeto indireto"],"O adjetivo caracteriza o substantivo \"pessoas\"."],[6,"Os adjetivos explicativos:","explicam o substantivo, destacando características que ele já tem",["restringem o substantivo a um grupo","são sempre verbos","nunca podem ser omitidos"],"Ex.: \"pessoa humana\" — toda pessoa é humana."],[6,"Os adjetivos restritivos:","restringem o substantivo, tornando-o único dentro de um grupo",["apenas repetem uma característica óbvia","não alteram o sentido se forem retirados","são sempre advérbios"],"Ex.: \"valores essenciais\" não são quaisquer valores."],[6,"Em \"a dignidade da pessoa humana\", o adjetivo \"humana\" é:","explicativo, pois pode ser omitido sem alterar o sentido",["restritivo","um verbo no particípio","um advérbio"],"Toda pessoa é humana; o adjetivo apenas destaca essa característica."],[6,"Em \"valores essenciais a qualquer sociedade civil organizada\", os adjetivos \"essenciais\", \"civil\" e \"organizada\" são:","restritivos",["explicativos","advérbios","verbos de ligação"],"Não é qualquer valor nem qualquer sociedade: os adjetivos restringem o sentido."],[6,"Em \"língua portuguesa\", o adjetivo \"portuguesa\":","restringe o sentido, indicando que se trata do idioma, e não do órgão do corpo",["não muda o sentido de \"língua\"","é explicativo","é um verbo"],"Sem o adjetivo, \"língua\" pode ser o órgão ou o idioma."],[6,"Em \"Sociedade civil organizada\", a palavra \"organizada\" exerce função de:","adjetivo, pois aponta uma característica da sociedade",["verbo, núcleo do predicado","advérbio de modo","objeto direto"],"Na função adjetiva, concorda em gênero e número com o núcleo \"sociedade\"."],[6,"Em \"A reunião foi organizada pelo chefe\", a palavra \"organizada\" exerce função de:","verbo, núcleo do predicado, indicando a ação feita pelo chefe",["adjetivo explicativo","predicativo do objeto","advérbio"],"Forma a locução verbal \"foi organizada\", que aponta uma ação."],[6,"Ao passar \"sociedade civil organizada\" para \"agrupamentos civis\", o adjetivo deve ficar:","organizados",["organizada","organizadas","organizando"],"Na função adjetiva, o particípio concorda com o núcleo em gênero e número."],[6,"Uma forma verbal no particípio, como \"organizada\":","pode funcionar como adjetivo ou como verbo, dependendo do contexto",["é sempre verbo","é sempre advérbio","nunca se flexiona"],"O contexto de uso aponta se a função é verbal ou adjetival."],[6,"Em \"Falei claro\", a palavra \"claro\" funciona como:","advérbio, equivalente a \"claramente\"",["adjetivo que concorda com o sujeito","substantivo","verbo"],"A frase pode ser reescrita como \"Falei claramente\" sem mudar o sentido; indica o modo de falar."],[6,"Em \"Muitas pessoas confundem liberdade de expressão e discurso de ódio\", a palavra \"muitas\":","concorda com \"pessoas\", funcionando como determinante do substantivo",["é advérbio e não varia","é um verbo","é o núcleo do predicado"],"Ela se refere à quantidade de pessoas e varia em gênero e número."],[6,"Em \"As pessoas confundem muito liberdade de expressão e discurso de ódio\", a palavra \"muito\":","é advérbio de intensidade, invariável, ligado ao verbo \"confundem\"",["é adjetivo e concorda com \"pessoas\"","é substantivo","é objeto direto"],"Ela intensifica a ação de confundir, por isso não varia."],[6,"Os sintagmas adjetivais podem ser modificados por um intensificador que aparece:","sempre antes do adjetivo (preposto)",["sempre depois do adjetivo","no fim da frase","nunca"],"Ex.: \"muito feliz\", \"mais saudável\"."],[6,"Em \"Os produtos in natura são mais saudáveis\", a palavra \"mais\":","intensifica o adjetivo \"saudáveis\", indicando grau",["é o núcleo do predicado","é o sujeito","é um verbo de ligação"],"Os adjetivos admitem variação de grau."],[6,"Na frase \"Da poderosa mensagem de orgulho negro\", se a ordem mudar para \"negro orgulho\":","o sentido pode mudar, pois a posição do adjetivo interfere no significado",["nada muda, a ordem nunca importa","a frase fica sem verbo","o adjetivo vira verbo"],"A posição das palavras pode alterar o efeito de sentido."],[7,"Segundo o texto de abertura do capítulo 4, a pirâmide alimentar tem na base:","os alimentos que devem ser mais consumidos, como arroz, pão e batata",["os doces, açúcares e óleos","apenas as frutas","apenas as carnes"],"No topo ficam doces, açúcares, óleos e gorduras, que devem ser consumidos com menos frequência."],[7,"A pirâmide alimentar brasileira foi elaborada pela pesquisadora:","Sonia Philippi",["Vicky Bennison","Beatriz Spinoza","Dulce Silva"],"A pirâmide alimentar nacional é de 1999."],[7,"Alimentos in natura são:","os mais próximos possíveis da forma natural, com pouco ou nenhum produto químico",["os que têm muitos corantes e açúcares","os sucos industrializados","os alimentos de fast-food"],"Ex.: laranjas compradas para fazer o suco em casa."],[7,"Alimentos ultraprocessados são aqueles que:","passam por muitos processos e recebem produtos químicos como corantes e açúcares",["vêm direto da natureza","não podem ser vendidos","têm só vitaminas"],"Ex.: suco de laranja industrializado, com concentração insuficiente de vitaminas e sais."],[7,"O Guia alimentar para a população brasileira, lançado em 2014, traz:","informações para escolher alimentos e combiná-los em refeições, com dez passos para a alimentação saudável",["receitas de pizza italiana","regras de concordância","leis contra a violência ao idoso"],"O guia incentiva o consumo de alimentos in natura."],[7,"O canal Pasta Grannies, criado pela jornalista Vicky Bennison, mostra:","idosos italianos preparando receitas típicas",["jovens aprendendo a dirigir","a história do futebol","crianças cozinhando doces"],"O nome significa, em tradução livre, \"Vovós da massa\"; alguns apresentadores têm mais de 90 anos."],[7,"No Brasil, uma pessoa é considerada idosa a partir de:","60 anos",["50 anos","70 anos","80 anos"],"É a mesma definição adotada pela Organização Mundial da Saúde (OMS)."],[7,"O Estatuto do Idoso foi aprovado em:","2003",["1988","2014","1999"],"Ele assegura aos idosos, por exemplo, preferência em hospitais, bancos e terminais de ônibus."],[7,"Nas sociedades indígenas, segundo o livro, os idosos:","são líderes, inclusive espirituais, e transmitem as tradições pela oralidade",["não têm nenhuma função","vivem isolados da comunidade","escrevem livros de receitas"],"Como muitas sociedades indígenas não têm registros escritos, os idosos são a fonte desses saberes."],[7,"O cuscuz brasileiro, segundo o texto, é feito basicamente com:","massa de milho temperada com sal",["sêmola de trigo e peixes","farinha de trigo e água","leite e ovos"],"Foi trazido pelos africanos e ganhou outro modo de preparo após o contato com indígenas."]]},{"id":"quimica","nome":"Química","cor":"#C2185B","temas":["Química Verde","Reagente limitante e em excesso","Reações sucessivas","Rendimento","Pureza","Cálculo do reagente limitante","Cálculo com reações sucessivas","Cálculo de rendimento","Cálculo de pureza"],"q":[[0,"A Química Verde é o ramo de pesquisa que busca:","tornar os processos químicos mais sustentáveis, minimizando impactos ambientais",["aumentar o uso de substâncias tóxicas","produzir mais resíduos para reciclar depois","substituir toda a indústria química por agricultura"],"Ela reduz substâncias tóxicas, melhora a eficiência das reações, mitiga riscos e usa energia renovável e reciclagem."],[0,"Qual destas atitudes está de acordo com a Química Verde?","Melhorar o rendimento das reações e reduzir o desperdício de reagentes",["Usar solventes tóxicos em maior quantidade","Descartar resíduos sem tratamento","Usar sempre fontes de energia não renováveis"],"Rendimento maior e menos desperdício diminuem custos e preservam recursos naturais."],[0,"Segundo o livro, uma alternativa aos solventes tradicionais é o uso de:","dióxido de carbono supercrítico ou solventes aquosos",["ácido sulfúrico concentrado","gasolina adulterada","monóxido de carbono"],"Esses solventes permitem recuperar e reutilizar o solvente, reduzindo custos e impactos."],[0,"O CO₂ supercrítico se forma quando o gás é submetido a:","temperatura crítica de 31,04 °C e pressão crítica de 100 bar",["0 °C e 1 atm","100 °C e 1 bar","−78 °C e vácuo"],"Nessas condições, propriedades como densidade e viscosidade do CO₂ são modificadas."],[0,"Por que reagentes tóxicos são um problema para a indústria e os laboratórios?","Porque eles e seus resíduos podem causar danos ao meio ambiente",["Porque sempre aumentam o rendimento","Porque não reagem com nada","Porque são sempre mais baratos"],"Muitos reagentes são tóxicos e diversas reações geram resíduos que também apresentam toxicidade."],[0,"Todos os processos químicos dependem diretamente:","das proporções entre reagentes e produtos",["da cor dos reagentes","do tamanho do frasco","da hora do dia"],"Usar as quantidades corretas evita o desperdício e o descarte de materiais."],[1,"No cálculo estequiométrico \"comum\", considera-se que:","100% dos reagentes foram convertidos em produto, sem excessos ou faltas",["sempre sobra metade de cada reagente","nenhum reagente é consumido","os produtos viram reagentes"],"Esse cálculo dá as quantidades teóricas; na prática, os resultados podem ser diferentes."],[1,"Duas substâncias A e B reagem para formar C. Após a reação, B foi totalmente consumida e ainda sobrou A. Então:","A é o reagente em excesso e B é o reagente limitante",["A é o reagente limitante e B está em excesso","os dois são limitantes","não houve reação"],"O reagente que acaba primeiro limita a quantidade de produto; o que sobra está em excesso."],[1,"O reagente limitante é aquele que:","é totalmente consumido e determina a quantidade máxima de produto",["sobra no final da reação","nunca participa da reação","é sempre o de maior massa"],"Quando ele acaba, a reação para, mesmo que ainda exista o outro reagente."],[1,"O reagente em excesso é aquele que:","não é totalmente consumido e permanece no sistema junto com o produto",["acaba primeiro","determina a massa de produto","é sempre o de menor massa"],"Pela proporção de Dalton e pela Lei de Lavoisier, o que está fora da proporção sobra."],[1,"Todos os cálculos estequiométricos de quantidade de produto devem partir:","do reagente limitante",["do reagente em excesso","do reagente de maior massa","de qualquer reagente, tanto faz"],"Por isso, havendo possibilidade de excesso ou falta, a primeira análise é identificar o limitante."],[1,"Por que, às vezes, um reagente é adicionado em excesso de propósito?","Para garantir que o outro reagente seja completamente consumido",["Para diminuir o rendimento","Para deixar a reação mais lenta de propósito","Porque a equação não precisa ser balanceada"],"No processo Haber-Bosch, por exemplo, adiciona-se H₂ em excesso para aumentar o rendimento."],[1,"O processo Haber-Bosch é usado para produzir:","amônia (NH₃), principalmente para fertilizantes",["ácido sulfúrico","gasolina","cloreto de cálcio"],"Equação: N₂(g) + 3 H₂(g) → 2 NH₃(g)."],[1,"A equação balanceada do processo Haber-Bosch é:","N₂ + 3 H₂ → 2 NH₃",["N₂ + H₂ → NH₃","2 N₂ + 3 H₂ → NH₃","N₂ + 3 H₂ → NH₃"],"1 mol de N₂ reage com 3 mol de H₂ formando 2 mol de NH₃."],[1,"Ao comparar a massa teórica necessária de um reagente (m teórica) com a massa disponível (m), se m teórica for MENOR que m, esse reagente está:","em excesso",["limitante","em falta","totalmente consumido"],"Há mais do que o necessário, então sobra. Se m teórica ≥ m, o reagente é limitante."],[1,"Ao comparar a massa teórica necessária de um reagente com a massa disponível, se a necessária for MAIOR ou igual à disponível, esse reagente é:","limitante",["em excesso","catalisador","produto"],"Não há o suficiente (ou há exatamente o necessário), então ele acaba primeiro."],[1,"Qual é o PRIMEIRO passo para resolver um problema de reagente limitante?","Escrever a equação química balanceada",["Calcular o rendimento","Somar as massas dos produtos","Calcular a pureza"],"Depois vêm as relações estequiométricas, a massa teórica, a comparação e o cálculo do produto."],[1,"Segundo o #FICAADICA, o reagente limitante também pode ser identificado com base:","na quantidade de matéria (mol) ou no volume molar",["na cor das substâncias","apenas na massa","no nome dos compostos"],"Desde que se use a relação estequiométrica do balanceamento."],[1,"Na reação 2 HCl + CaCO₃ → CaCl₂ + H₂O + CO₂, a proporção em mol entre HCl e CaCO₃ é:","2 : 1",["1 : 1","1 : 2","3 : 1"],"Pelos coeficientes, 2 mol de HCl reagem com 1 mol de CaCO₃."],[1,"Em uma reação com reagente em excesso, a massa total do sistema após a reação:","continua igual à inicial (Lei de Lavoisier), pois o excesso permanece junto com o produto",["diminui exatamente a massa do excesso","dobra","fica igual a zero"],"Massa de produtos + massa que sobrou = massa inicial dos reagentes."],[2,"Reações sucessivas (ou consecutivas) são aquelas em que:","os produtos de uma reação atuam como reagentes em outra reação",["nenhum produto é formado","só há um reagente","a reação acontece ao contrário"],"É comum na natureza e na indústria, como na formação da chuva ácida."],[2,"A equação global de reações sucessivas é obtida:","somando as equações parciais e cancelando as substâncias que se repetem em lados opostos",["multiplicando todas as massas","escolhendo só a última equação","subtraindo os reagentes dos produtos"],"Às vezes é preciso multiplicar ou inverter equações para igualar os coeficientes."],[2,"Na chuva ácida, a reação I é S + O₂ → SO₂. A reação II, SO₂ + ½ O₂ → SO₃, mostra que:","o SO₂ é produto da reação I e reagente da reação II",["o SO₂ não participa da reação II","o S é produto da reação II","o SO₃ é reagente da reação I"],"O SO₂ é comum às reações I e II, e o SO₃ é comum às reações II e III."],[2,"A reação III da chuva ácida, SO₃ + H₂O → H₂SO₄, forma:","ácido sulfúrico",["ácido nítrico","ácido clorídrico","amônia"],"O trióxido de enxofre reage com a água da chuva e forma H₂SO₄."],[2,"A equação global da formação do ácido sulfúrico na chuva ácida é:","S + 3/2 O₂ + H₂O → H₂SO₄",["S + O₂ → SO₂","S + 1/2 O₂ + H₂O → H₂SO₄","SO₂ + SO₃ → H₂SO₄"],"Somando I, II e III, SO₂ e SO₃ se cancelam e o O₂ soma 1 + ½ = 3/2."],[2,"Na chuva ácida, o dióxido de enxofre (SO₂) tem origem principalmente:","na queima do enxofre presente em combustíveis",["na fotossíntese das plantas","na evaporação do mar","no processo Haber-Bosch"],"S + O₂ → SO₂ é a primeira etapa."],[2,"No processo de formação dos ácidos nítrico e nitroso, o monóxido de nitrogênio (NO) vem:","da combustão do gás nitrogênio: N₂ + O₂ → 2 NO",["da reação do enxofre com água","da decomposição do calcário","da fotossíntese"],"Depois: 2 NO + O₂ → 2 NO₂ e 2 NO₂ + H₂O → HNO₂ + HNO₃."],[2,"A equação global da formação dos ácidos nítrico e nitroso é:","N₂ + 2 O₂ + H₂O → HNO₂ + HNO₃",["N₂ + O₂ → 2 NO","N₂ + O₂ + H₂O → HNO₃","2 NO₂ → N₂ + 2 O₂"],"NO e NO₂ são cancelados (lados opostos) e os O₂ são somados (mesmo lado)."],[2,"Ao somar as equações parciais, por que NO e NO₂ são cancelados no exemplo do ácido nítrico?","Porque aparecem em lados opostos, como produto de uma etapa e reagente da seguinte",["Porque não existem","Porque têm massa zero","Porque estão do mesmo lado"],"Já os O₂ são somados, pois estão do mesmo lado (reagentes)."],[2,"Nas estações de tratamento de água, a etapa em que CaO e Al₂(SO₄)₃ agregam impurezas em flocos grandes chama-se:","floculação",["destilação","evaporação","combustão"],"CaO + H₂O → Ca(OH)₂ e depois 3 Ca(OH)₂ + Al₂(SO₄)₃ → 2 Al(OH)₃ + 3 CaSO₄."],[2,"No exercício da floculação, por que a equação I (CaO + H₂O → Ca(OH)₂) é multiplicada por 3?","Para igualar a quantidade de Ca(OH)₂ que a equação II consome",["Porque o CaO é limitante","Para mudar o produto","Porque a água está em excesso"],"A equação II usa 3 Ca(OH)₂; multiplicando a I por 3, o Ca(OH)₂ se cancela na soma."],[2,"A equação global da floculação é:","3 CaO + 3 H₂O + Al₂(SO₄)₃ → 2 Al(OH)₃ + 3 CaSO₄",["CaO + Al₂(SO₄)₃ → CaSO₄","3 Ca(OH)₂ → 3 CaO + 3 H₂O","CaO + H₂O → Ca(OH)₂"],"A proporção global CaO : CaSO₄ é 3 : 3, ou seja, 1 : 1."],[2,"No exercício da floculação (252 kg de CaO e 1 026 kg de Al₂(SO₄)₃), qual reagente é o limitante?","CaO",["Al₂(SO₄)₃","H₂O","CaSO₄"],"252 kg de CaO precisariam de apenas 513 kg de Al₂(SO₄)₃; como há 1 026 kg, o sulfato de alumínio está em excesso."],[3,"Rendimento teórico de uma reação é:","a quantidade de produto prevista supondo que a reação ocorre completamente e sem perdas",["a quantidade de produto realmente obtida","a massa das impurezas","a velocidade da reação"],"Já o que é efetivamente obtido no processo é o rendimento real."],[3,"Rendimento real de uma reação é:","a quantidade de produto efetivamente obtida no processo",["a quantidade prevista pelo cálculo","sempre 100%","a massa dos reagentes"],"Nem sempre o obtido é igual ao calculado."],[3,"O rendimento percentual é calculado por:","r% = (m real ÷ m teórica) · 100%",["r% = (m teórica ÷ m real) · 100%","r% = m real − m teórica","r% = m teórica · 100"],"A relação vale também para quantidade de matéria (mol) ou volume."],[3,"Quando os rendimentos teórico e real são iguais, o rendimento é:","100%, indicando que todo o reagente disponível foi convertido em produto",["0%","50%","impossível de calcular"],"Na prática, isso nem sempre acontece."],[3,"Qual destes fatores pode fazer o rendimento real ser menor que o teórico?","Reações secundárias não previstas",["Balancear corretamente a equação","Usar a massa molar certa","Escrever a fórmula correta"],"Condições do meio reacional, reações secundárias e impurezas dos reagentes reduzem o rendimento."],[3,"A combustão do octano (C₈H₁₈) é representada por:","C₈H₁₈ + 12,5 O₂ → 8 CO₂ + 9 H₂O",["C₈H₁₈ + O₂ → CO₂ + H₂O","C₈H₁₈ + 8 O₂ → 9 CO₂ + 8 H₂O","C₈H₁₈ → 8 C + 9 H₂"],"A partir de 1 mol de octano esperam-se 8 mol de CO₂ e 9 mol de H₂O."],[3,"Na combustão de 114 g de octano, o livro espera 352 g de CO₂, mas obtém 300 g. O rendimento é aproximadamente:","85,2%",["117,3%","52%","100%"],"r% = 300 ÷ 352 · 100% ≈ 85,2%."],[3,"A gasolina contém impurezas como enxofre e nitrogênio. No motor, elas geram:","subprodutos como SO₂ e NOₓ",["apenas água pura","oxigênio","gás hidrogênio"],"Parte do oxigênio reage com as impurezas; além disso, a combustão incompleta produz CO e fuligem (C)."],[3,"A combustão incompleta do combustível no motor pode produzir:","monóxido de carbono (CO) e fuligem (C)",["apenas CO₂ e água","ácido sulfúrico","amônia"],"Isso reduz o rendimento em CO₂ e polui."],[3,"Gasolina adulterada com água, etanol ou outros solventes pode:","comprometer o desempenho do motor e danificar o veículo",["melhorar o rendimento do motor","eliminar toda a poluição","transformar-se em água pura"],"O livro alerta para os riscos do combustível adulterado."],[4,"Nas equações químicas, as fórmulas representam:","substâncias puras, sem considerar outros compostos misturados",["sempre misturas","apenas impurezas","substâncias com 50% de pureza"],"Na realidade, a maioria das substâncias tem algum teor de compostos secundários."],[4,"Os compostos químicos secundários presentes em uma amostra são chamados de:","impurezas",["catalisadores","produtos","reagentes limitantes"],"Eles diminuem o teor do composto de interesse."],[4,"O sistema mais próximo da água pura (só moléculas de H₂O) é:","a água desmineralizada (ou deionizada)",["a água mineral","a água do mar","a água da chuva ácida"],"Sua pureza se aproxima de 100%."],[4,"A água mineral NÃO é considerada substância pura porque:","contém gases e sais minerais dissolvidos, formando uma mistura",["não contém H₂O","é sempre contaminada por bactérias","tem cor diferente"],"Mesmo invisíveis, esses componentes fazem dela uma mistura."],[4,"A pureza percentual (p%) de uma amostra é:","a razão entre a massa do composto puro e a massa total da amostra, vezes 100%",["a massa das impurezas vezes 100","a soma das massas molares","o rendimento da reação"],"p% = (m pura ÷ m amostra) · 100%; vale também para mol ou volume."],[4,"O carbonato de cálcio (CaCO₃) é encontrado em:","calcita, aragonita, rochas calcárias, conchas, corais e cascas de ovos",["apenas na água destilada","no ar puro","na gasolina"],"Nesses materiais ele não é puro, porque há outras substâncias junto."],[4,"No experimento das conchas, a pureza do CaCO₃ foi determinada medindo-se:","a massa de gás carbônico (CO₂) produzida na reação com HCl",["a cor das conchas","o volume de água","a temperatura do mar"],"CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂: pela massa de CO₂ se calcula quanto CaCO₃ reagiu."],[4,"Se uma amostra tem 80% de pureza, isso significa que:","80% da massa é o composto de interesse e 20% são impurezas",["80% são impurezas","a reação rende 80%","só 20 g reagem sempre"],"Só a parte pura participa da reação."],[4,"Ao usar um reagente impuro em um cálculo estequiométrico, deve-se:","considerar apenas a massa pura do reagente",["usar a massa total da amostra","somar a massa das impurezas ao produto","ignorar a equação"],"Primeiro se calcula a massa pura (massa da amostra × pureza) e depois se aplica a proporção."],[5,"Na síntese da amônia (N₂ + 3 H₂ → 2 NH₃; N = 14, H = 1), misturam-se 28 g de N₂ e 8 g de H₂. Qual é o reagente limitante?","N₂",["H₂","NH₃","Os dois são consumidos totalmente"],"28 g de N₂ precisam de 6 g de H₂ (28 : 6). Há 8 g, então o N₂ acaba primeiro."],[5,"Na síntese da amônia (N₂ + 3 H₂ → 2 NH₃; N = 14, H = 1), misturam-se 28 g de N₂ e 8 g de H₂. Qual é a massa máxima de NH₃ formada?","34 g",["36 g","45,33 g","17 g"],"Calcula-se pelo limitante (N₂): 28 g de N₂ ou 6 g de H₂ formam 34 g de NH₃. Resultado: 34 g."],[5,"Na síntese da amônia (N₂ + 3 H₂ → 2 NH₃; N = 14, H = 1), misturam-se 28 g de N₂ e 8 g de H₂. Quanto sobra do reagente em excesso (H₂)?","2 g",["8 g","0 g","4 Cl (CaCO₃ = 100 g/mol)?","176 g",["220 g","400 g","352g"],"Massa pura = 500 · 80% = 400 g; CO₂ = 400 · 44 ÷ 100 = 176 g. Impurezas não reagem."],[8,"Uma amostra de 1 000 g de calcário tem 90% de CaCO₃. Qual massa de CO₂ (44 g/mol) ela libera ao reagir totalmente com HCl (CaCO₃ = 100 g/mol)?","396 g",["440 g","900 g","792g"],"Massa pura = 1 000 · 90% = 900 g; CO₂ = 900 · 44 ÷ 100 = 396 g. Impurezas não reagem."],[8,"Uma amostra de 250 g de calcário tem 60% de CaCO₃. Qual massa de CO₂ (44 g/mol) ela libera ao reagir totalmente com HCl (CaCO₃ = 100 g/mol)?","66 g",["110 g","150 g","132g"],"Massa pura = 250 · 60% = 150 g; CO₂ = 150 · 44 ÷ 100 = 66 g. Impurezas não reagem."],[8,"Uma amostra de 200 g de calcário tem 75% de CaCO₃. Qual massa de CO₂ (44 g/mol) ela libera ao reagir totalmente com HCl (CaCO₃ = 100 g/mol)?","66 g",["88 g","150 g","132g"],"Massa pura = 200 · 75% = 150 g; CO₂ = 150 · 44 ÷ 100 = 66 g. Impurezas não reagem."],[8,"Quantos kg de CaCl₂ (111 g/mol) se obtêm a partir de 1 000 kg de calcário com 90% de CaCO₃ (100 g/mol), com HCl em excesso?","999 kg",["1 110 kg","900 kg","499,5 kg"],"Massa pura = 900 kg; 100 kg de CaCO₃ formam 111 kg de CaCl₂: 999 kg."],[8,"Quantos kg de CaCl₂ (111 g/mol) se obtêm a partir de 500 kg de calcário com 80% de CaCO₃ (100 g/mol), com HCl em excesso?","444 kg",["555 kg","400 kg","222 kg"],"Massa pura = 400 kg; 100 kg de CaCO₃ formam 111 kg de CaCl₂: 444 kg."],[8,"1 000 g de calcário com 90% de CaCO₃ reagem com HCl em excesso (CaCO₃ = 100; CaCl₂ = 111 g/mol). Com rendimento de 80%, qual massa de CaCl₂ se obtém?","799,2 g",["1 110 g","999 g","888 g"],"Primeiro a pureza: 900 g de CaCO₃ → 999 g de CaCl₂ (teórico); depois o rendimento: · 80% = 799,2 g."],[8,"200 g de calcário com 80% de CaCO₃ reagem com HCl em excesso (CaCO₃ = 100; CaCl₂ = 111 g/mol). Com rendimento de 50%, qual massa de CaCl₂ se obtém?","88,8 g",["222 g","177,6 g","111 g"],"Primeiro a pureza: 160 g de CaCO₃ → 177,6 g de CaCl₂ (teórico); depois o rendimento: · 50% = 88,8 g."]]}];
const app = document.getElementById('app');
const POR_RODADA = 10;
let estado = null;

function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function ler(k, padrao){ try{ const v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); }catch(e){ return padrao; } }
function el(tag, attrs, ...filhos){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const f of filhos.flat()) if (f !== null && f !== undefined && f !== false) n.append(f.nodeType ? f : document.createTextNode(String(f)));
  return n;
}
function embaralhar(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmt = n => String(n).replace('.', ',');
function mostrar(...nos){ app.replaceChildren(...nos); app.firstElementChild?.classList.add('entra'); window.scrollTo(0, 0); }

/* sorteia priorizando questões que o aluno ainda não viu neste aparelho */
function sortear(m){
  const chave = 'vistas-' + m.id;
  let vistas = new Set(ler(chave, []));
  let livres = m.q.map((_, i) => i).filter(i => !vistas.has(i));
  let escolha = embaralhar(livres).slice(0, POR_RODADA);
  if (escolha.length < POR_RODADA){
    vistas = new Set();
    const resto = embaralhar(m.q.map((_, i) => i).filter(i => !escolha.includes(i)));
    escolha = escolha.concat(resto.slice(0, POR_RODADA - escolha.length));
  }
  escolha.forEach(i => vistas.add(i));
  guardar(chave, [...vistas]);
  return escolha.map(i => {
    const [tema, enun, certa, erradas, expl] = m.q[i];
    const alts = embaralhar([certa, ...erradas]);
    return { tema: m.temas[tema], enun, alts, certa: alts.indexOf(certa), expl, resp: null };
  });
}

function inicio(){
  const lista = el('ul', { class: 'materias' }, DADOS.map(m => {
    const rec = ler('melhor-' + m.id, null);
    return el('li', { class: 'mat', style: '--c:' + m.cor },
      el('div', { class: 'mat-info' },
        el('h2', {}, m.nome),
        el('p', { class: 'mat-temas' }, m.q.length + ' questões · ' + m.temas.join('; ')),
        rec !== null ? el('div', { class: 'mat-recorde' }, 'Sua melhor nota aqui: ' + fmt(rec)) : null),
      el('div', { class: 'mat-acoes' },
        el('button', { class: 'btn', type: 'button', onclick: () => comecar(m) }, 'Fazer 10 questões'),
        el('span', { class: 'pdfs' },
          el('a', { href: 'pdf/' + m.id + '-questoes.pdf', target: '_blank', rel: 'noopener' }, 'PDF para imprimir'),
          el('a', { href: 'pdf/' + m.id + '-gabarito.pdf', target: '_blank', rel: 'noopener' }, 'Gabarito'))));
  }));
  const total = DADOS.reduce((s, m) => s + m.q.length, 0);
  mostrar(el('div', {},
    el('h1', {}, 'Revisão para a ', el('span', { class: 'grifo' }, 'prova')),
    el('p', { class: 'intro' }, 'Escolha a matéria. Você recebe 10 questões sorteadas do conteúdo do livro e, no final, vê a nota, o que errou e por quê. Cada rodada traz questões novas até você passar por todas.'),
    lista,
    el('p', { class: 'rodape' }, total + ' questões no total. Se quiser estudar no papel, cada matéria tem o PDF com todas as questões e o gabarito separado.')));
  document.title = 'Revisão para a prova';
}

function comecar(m){
  estado = { m, itens: sortear(m), i: 0 };
  document.title = m.nome + ' · Revisão para a prova';
  questao();
}

function topo(){
  const { m, i } = estado;
  return [
    el('div', { class: 'barra' },
      el('span', { class: 'etiqueta' }, m.nome),
      el('button', { class: 'sair', type: 'button', onclick: () => { if (estado.i === 0 || confirmarSaida()) inicio(); } }, 'Trocar de matéria')),
    el('div', { class: 'progresso', 'aria-hidden': 'true' },
      estado.itens.map((_, k) => el('i', { class: k < i ? 'feito' : k === i ? 'agora' : '' })))
  ];
}
function confirmarSaida(){ return window.confirm('Sair agora? As respostas desta rodada serão perdidas.'); }

function questao(){
  const { m, itens, i } = estado;
  const it = itens[i];
  const enviar = el('button', { class: 'btn', type: 'submit', disabled: '' }, i === POR_RODADA - 1 ? 'Responder e ver a nota' : 'Responder e seguir');
  const form = el('form', { class: 'cartao', onsubmit: ev => {
      ev.preventDefault();
      const marcado = form.querySelector('input:checked');
      if (!marcado) return;
      it.resp = Number(marcado.value);
      estado.i++;
      estado.i < itens.length ? questao() : resultado();
    } },
    el('p', { class: 'contador' }, 'Questão ' + (i + 1) + ' de ' + itens.length + ' · ' + it.tema),
    el('p', { class: 'enunciado', id: 'enun' }, it.enun),
    el('fieldset', { 'aria-labelledby': 'enun' },
      it.alts.map((a, k) => el('label', { class: 'alt' },
        el('input', { type: 'radio', name: 'alt', value: k, onchange: () => enviar.removeAttribute('disabled') }),
        el('span', { class: 'letra', 'aria-hidden': 'true' }, 'ABCD'[k]),
        el('span', {}, a)))),
    el('div', { class: 'acoes' }, enviar));
  const wrap = el('div', { style: '--c:' + m.cor }, topo(), form);
  mostrar(wrap);
}

function resultado(){
  const { m, itens } = estado;
  const acertos = itens.filter(it => it.resp === it.certa).length;
  const nota = acertos * 10 / itens.length;
  const ant = ler('melhor-' + m.id, null);
  if (ant === null || nota > ant) guardar('melhor-' + m.id, nota);
  const msg = nota === 10 ? 'Gabaritou!' : nota >= 7 ? 'Mandou bem.' : nota >= 5 ? 'Está no caminho.' : 'Vale revisar esse conteúdo.';
  const erradas = itens.filter(it => it.resp !== it.certa);
  const certas = itens.filter(it => it.resp === it.certa);
  const L = 'ABCD';
  const blocos = [
    el('div', { class: 'barra' }, el('span', { class: 'etiqueta' }, m.nome)),
    el('div', { class: 'nota' },
      el('span', { class: 'nota-num', 'aria-label': 'Nota ' + fmt(nota) }, fmt(nota)),
      el('div', { class: 'nota-txt' }, el('strong', {}, msg), el('span', {}, acertos + ' de ' + itens.length + ' certas · ' + erradas.length + (erradas.length === 1 ? ' errada' : ' erradas')))),
  ];
  if (erradas.length){
    blocos.push(el('h3', {}, erradas.length === 1 ? 'A questão que você errou' : 'As ' + erradas.length + ' questões que você errou'));
    erradas.forEach(it => blocos.push(el('article', { class: 'cartao erro' },
      el('p', { class: 'contador' }, it.tema),
      el('p', { class: 'enunciado' }, it.enun),
      el('p', { class: 'linha-resp sua' }, el('b', {}, '✗ Você marcou ' + L[it.resp] + ':'), el('span', {}, it.alts[it.resp])),
      el('p', { class: 'linha-resp certa' }, el('b', {}, '✓ Correta ' + L[it.certa] + ':'), el('span', {}, it.alts[it.certa])),
      el('p', { class: 'porque' }, el('b', {}, 'Por que', ), it.expl))));
  } else {
    blocos.push(el('p', { class: 'parabens' }, 'Nenhum erro nesta rodada. Faça outra para ver questões novas.'));
  }
  if (certas.length){
    blocos.push(el('details', { class: 'acertos' },
      el('summary', {}, 'Ver as ' + certas.length + (certas.length === 1 ? ' que acertou' : ' que acertou')),
      certas.map(it => el('div', { class: 'acerto' },
        el('p', {}, it.enun),
        el('p', { class: 'ok' }, '✓ ' + it.alts[it.certa]),
        el('p', { class: 'mat-temas' }, it.expl)))));
  }
  blocos.push(el('div', { class: 'botoes' },
    el('button', { class: 'btn', type: 'button', onclick: () => comecar(m) }, 'Fazer mais 10 de ' + m.nome),
    el('button', { class: 'btn claro', type: 'button', onclick: inicio }, 'Escolher outra matéria')));
  mostrar(el('div', { style: '--c:' + m.cor }, blocos));
}

inicio();
</script>
